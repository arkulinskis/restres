      <noscript><div class="seo-noscript">
      <h1>PlanPlate: restaurant reservations, floor plans and websites</h1>
      <p>Run bookings for all your restaurants: opening hours, a drag-and-drop floor plan, automatic approvals, menus, specials, events and a booking form for your website.</p>
      <p>PlanPlate is where restaurant managers run bookings for all their restaurants, and guests book through a form on the restaurant&#x27;s own website.</p>
      <p>Set opening periods and special days, draw the floor plan, join and split tables, and let bookings confirm themselves until the room is nearly full. Menus, specials, a photo of the day, events with their own room layout, a photo gallery and a daily phone check-in keep the restaurant&#x27;s website and team up to date.</p>
      <p>Who it's for: Restaurant owners and managers, from one restaurant to about ten</p>
      <h2>What it does</h2><ul><li>Opening periods and special days with a month calendar</li><li>Drag-and-drop floor plan; join and split tables by hour and weekday</li><li>Automatic confirmation until the restaurant is 80% booked, approvals for the rest</li><li>Booking link, button, iframe and QR codes for your website</li><li>Menus, specials, photo of the day, events and a photo gallery</li><li>Guest emails: confirmations, requests, declines and cancellations</li><li>Team roles for owners, managers and staff</li></ul>
      <h2>Questions</h2><h3>Can I run several restaurants?</h3><p>Yes. Create as many restaurants as you run (about ten is the target) and duplicate one to start the next.</p><h3>How do guests book?</h3><p>Through a booking link, a Reserve a table button, an iframe or a QR code on the restaurant&#x27;s website. They get emails for every change.</p><h3>Which bookings need approval?</h3><p>Bookings confirm themselves until the restaurant is 80% booked (adjustable); large parties and anything above that wait as a request with the numbers you need to decide.</p><h3>Can staff add phone and walk-in bookings?</h3><p>Yes. Staff add, move and resize bookings on a day timeline per table.</p>
      <p><a href="https://planplate-test.anvil.app/about">About PlanPlate</a> &middot; <a href="https://planplate-test.anvil.app/llms.txt">PlanPlate for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. PlanPlate needs JavaScript in your browser.</p>
      </div></noscript>
