<div class="ui pp pp-dlg pp-pe">
  <anvil-component type="Label" name="eyebrow" prop:role='["eyebrow-label"]'></anvil-component>
  <anvil-component type="Label" name="title_label" prop:role='["dlg-title"]'></anvil-component>
  <div class="ui-stack">
    <div class="pp-split">
      <label class="ui-field"><span>Date</span><anvil-component type="DatePicker" name="date_picker" prop:format="D MMM YYYY"></anvil-component></label>
      <label class="ui-field" anvil:name="to_field"><span>Until <em>(optional)</em></span><anvil-component type="DatePicker" name="to_picker" prop:format="D MMM YYYY"></anvil-component></label>
    </div>
    <label class="ui-field"><span>Label</span><anvil-component type="TextBox" name="label_box" prop:placeholder="e.g. Christmas, Private event"></anvil-component></label>
    <div class="ui-seg" role="radiogroup">
      <button type="button" anvil:name="mode_closed" data-mode="closed" anvil:on-dom:click="self.mode_click">Closed</button>
      <button type="button" anvil:name="mode_open" data-mode="open" anvil:on-dom:click="self.mode_click">Special hours</button>
    </div>
    <div anvil:name="ivs_box" class="pp-ivs">
      <anvil-component type="RepeatingPanel" name="ivs_panel" prop:item_template="PlanPlate_2_0.Items.Interval" prop:role='["contents"]'></anvil-component>
      <anvil-component type="Button" name="add_button" prop:text="Add hours" prop:role='["btn", "btn-ghost", "btn-sm", "ic-plus"]'></anvil-component>
    </div>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="ui-row end">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary"]'></anvil-component>
  </div>
</div>
