<div class="ui pp pp-dlg pp-fill">
  <div class="pp-dlg-head">
    <anvil-component type="Label" name="title_label" prop:role='["dlg-title"]' prop:text="Fill a quiet night"></anvil-component>
    <anvil-component type="Label" name="seats_badge" prop:role='["badge", "badge-warn"]' prop:visible="false"></anvil-component>
  </div>
  <anvil-component type="Label" name="lead_label" prop:role='["muted"]'></anvil-component>
  <anvil-component type="Label" name="loading_label" prop:role='["muted", "small"]' prop:text="Drawing your story…"></anvil-component>
  <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  <div class="pp-fill-grid" anvil:name="grid">
    <div class="pp-fill-prev"><img anvil:name="story_img" alt=""></div>
    <div class="pp-fill-side">
      <anvil-component type="RepeatingPanel" name="langs_panel" prop:item_template="PlanPlate_2_0.Items.Chip" prop:role='["chips", "pp-fill-langs"]'></anvil-component>
      <label class="ui-field"><span>Caption</span><anvil-component type="TextArea" name="caption_box" prop:height="150"></anvil-component></label>
      <div class="pp-fill-acts">
        <anvil-component type="Button" name="share_button" prop:text="Share" prop:role='["btn", "btn-primary", "ic-upload"]'></anvil-component>
        <anvil-component type="Button" name="download_button" prop:text="Download" prop:role='["btn", "ic-download"]'></anvil-component>
        <anvil-component type="Button" name="copy_text_button" prop:text="Copy text" prop:role='["btn", "btn-ghost", "ic-copy"]'></anvil-component>
        <anvil-component type="Button" name="whatsapp_button" prop:text="WhatsApp" prop:role='["btn", "btn-ghost", "ic-chat"]'></anvil-component>
        <anvil-component type="Button" name="copy_link_button" prop:text="Copy link" prop:role='["btn", "btn-ghost", "ic-link"]'></anvil-component>
      </div>
      <anvil-component type="Label" name="times_label" prop:role='["hint"]'></anvil-component>
    </div>
  </div>
  <div class="ui-row end">
    <anvil-component type="Button" name="close_button" prop:text="Close" prop:role='["btn"]'></anvil-component>
  </div>
</div>
