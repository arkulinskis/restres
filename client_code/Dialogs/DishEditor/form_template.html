<div class="ui pp pp-dlg">
  <anvil-component type="Label" name="eyebrow" prop:role='["eyebrow-label"]'></anvil-component>
  <anvil-component type="Label" name="title_label" prop:role='["dlg-title"]'></anvil-component>
  <div class="ui-stack">
    <div class="pp-split">
      <label class="ui-field"><span>Dish</span><anvil-component type="TextBox" name="name_box"></anvil-component></label>
      <label class="ui-field"><span>Price</span><anvil-component type="TextBox" name="price_box" prop:placeholder="e.g. $24"></anvil-component></label>
    </div>
    <label class="ui-field"><span>Description <em>(optional)</em></span><anvil-component type="TextArea" name="desc_box" prop:height="60"></anvil-component></label>
    <label class="ui-field"><span>Section</span><anvil-component type="DropDown" name="section_drop"></anvil-component></label>
    <div class="ui-field"><span>Labels</span><anvil-component type="RepeatingPanel" name="tags_panel" prop:item_template="PlanPlate_2_0.Items.Chip" prop:role='["chips"]'></anvil-component></div>
    <anvil-component type="CheckBox" name="available_box" prop:text="On the menu (untick when it sells out)"></anvil-component>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="ui-row end">
    <anvil-component type="Button" name="delete_button" prop:text="Delete dish" prop:role='["btn", "btn-danger"]'></anvil-component>
    <span class="ui-spacer"></span>
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Save dish" prop:role='["btn", "btn-primary"]'></anvil-component>
  </div>
</div>
