<div class="ui pp pp-dlg">
  <anvil-component type="Label" name="title_label" prop:role='["dlg-title"]'></anvil-component>
  <anvil-component type="Label" name="contact_label" prop:role='["muted", "small"]'></anvil-component>
  <div class="pp-gstats">
    <div><anvil-component type="Label" name="n_visits" prop:role='["num"]'></anvil-component><span>Visits</span></div>
    <div><anvil-component type="Label" name="n_covers" prop:role='["num"]'></anvil-component><span>Guests brought</span></div>
    <div><anvil-component type="Label" name="n_noshow" prop:role='["num"]'></anvil-component><span>No-shows</span></div>
    <div><anvil-component type="Label" name="n_cancel" prop:role='["num"]'></anvil-component><span>Cancelled</span></div>
  </div>
  <div class="ui-stack">
    <div class="ui-field"><span>Tags</span><anvil-component type="RepeatingPanel" name="tags_panel" prop:item_template="PlanPlate_2_0.Items.Chip" prop:role='["chips"]'></anvil-component></div>
    <label class="ui-field"><span>Team notes <em>(the guest never sees these)</em></span><anvil-component type="TextArea" name="note_box" prop:height="70" prop:placeholder="Allergies, favourite table, birthday…"></anvil-component></label>
    <anvil-component type="Label" name="readonly_label" prop:role='["hint"]' prop:text="Only managers and owners can change notes and tags." prop:visible="false"></anvil-component>
  </div>
  <h3 style="margin:22px 0 6px">Visits and bookings</h3>
  <div class="ui-card pp-res-list pp-res-dated">
    <anvil-component type="RepeatingPanel" name="history_panel" prop:item_template="PlanPlate_2_0.Items.ResRow" prop:role='["contents"]'></anvil-component>
  </div>
  <div class="ui-row end">
    <anvil-component type="Button" name="close_button" prop:text="Close" prop:role='["btn"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Save notes" prop:role='["btn", "btn-primary"]'></anvil-component>
  </div>
</div>
