<div class="ui pp pp-dlg">
  <anvil-component type="Label" name="eyebrow" prop:role='["eyebrow-label"]'></anvil-component>
  <anvil-component type="Label" name="title_label" prop:role='["dlg-title"]'></anvil-component>
  <div class="ui-row" style="margin:6px 0 14px">
    <anvil-component type="Button" name="upload_button" prop:role='["btn", "btn-primary", "ic-upload"]'></anvil-component>
    <anvil-component type="Label" name="status_label" prop:role='["muted", "small"]'></anvil-component>
    <span class="ui-spacer"></span>
    <anvil-component type="Label" name="storage_label" prop:role='["badge"]'></anvil-component>
  </div>
  <div class="pp-photo-pick">
    <anvil-component type="RepeatingPanel" name="photos_panel" prop:item_template="PlanPlate_2_0.Items.PhotoTile" prop:role='["contents"]'></anvil-component>
  </div>
  <anvil-component type="Label" name="empty_label" prop:role='["ui-empty-label", "muted"]' prop:visible="false"></anvil-component>
  <div class="ui-row end"><anvil-component type="Button" name="close_button" prop:text="Close" prop:role='["btn"]'></anvil-component></div>
</div>
