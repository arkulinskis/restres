<div class="pp-li">
  <anvil-component type="Button" name="remove_button" prop:text="Remove" prop:role='["btn", "btn-ghost", "btn-icon", "ic-x", "pp-li-rm"]'></anvil-component>
  <div class="pp-split" anvil:name="review_top">
    <anvil-component type="TextBox" name="name_box" prop:placeholder="Name, e.g. Thomas S."></anvil-component>
    <anvil-component type="TextBox" name="source_box" prop:placeholder="Where, e.g. Tripadvisor"></anvil-component>
  </div>
  <anvil-component type="DropDown" name="rating_drop" prop:items='[["★★★★★ 5", 5], ["★★★★ 4", 4], ["★★★ 3", 3], ["★★ 2", 2], ["★ 1", 1]]'></anvil-component>
  <anvil-component type="TextBox" name="title_box" prop:placeholder="Perfect for date nights"></anvil-component>
  <anvil-component type="TextArea" name="text_box" prop:height="70"></anvil-component>
</div>
