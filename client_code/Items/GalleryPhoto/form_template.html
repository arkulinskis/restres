<div class="ui-card pp-gph">
  <div class="pp-gph-img"><img anvil:name="img" alt="" loading="lazy"><anvil-component type="Label" name="video_badge" prop:role='["badge"]' prop:text="Video"></anvil-component></div>
  <anvil-component type="TextBox" name="caption_box" prop:placeholder="Caption (helps Google and screen readers)"></anvil-component>
  <div class="ui-row" style="gap:2px">
    <anvil-component type="Button" name="left_button" prop:text="Move earlier" prop:role='["btn", "btn-ghost", "btn-icon", "ic-left"]'></anvil-component>
    <anvil-component type="Button" name="right_button" prop:text="Move later" prop:role='["btn", "btn-ghost", "btn-icon", "ic-right"]'></anvil-component>
    <anvil-component type="Label" name="n_label" prop:role='["muted", "small"]'></anvil-component>
    <span class="ui-spacer"></span>
    <anvil-component type="Button" name="show_button" prop:role='["btn", "btn-ghost", "btn-icon"]'></anvil-component>
    <anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role='["btn", "btn-ghost", "btn-icon", "btn-danger", "ic-trash"]'></anvil-component>
  </div>
</div>
