<div class="pp-wrow">
  <div class="pp-wrow-main">
    <div class="pp-wrow-line">
      <anvil-component type="Label" name="name_label" prop:role='["strong"]'></anvil-component>
      <anvil-component type="Label" name="fit_badge" prop:role='["badge"]'></anvil-component>
    </div>
    <anvil-component type="Label" name="meta_label" prop:role='["muted", "small"]'></anvil-component>
    <anvil-component type="Label" name="notes_label" prop:role='["muted", "small", "pp-note"]'></anvil-component>
  </div>
  <div class="pp-wrow-acts">
    <anvil-component type="Button" name="book_button" prop:text="Book" prop:role='["btn", "btn-sm", "btn-primary", "ic-plus"]'></anvil-component>
    <a class="ui-btn sm" anvil:name="call_link" href="#"><i class="ic ic-phone"></i>Call</a>
    <a class="ui-btn sm" anvil:name="msg_link" href="#" target="_blank" rel="noopener"><i class="ic ic-chat"></i>Message</a>
    <anvil-component type="Button" name="remove_button" prop:text="Remove" prop:role='["btn", "btn-sm", "btn-ghost"]'></anvil-component>
  </div>
</div>
