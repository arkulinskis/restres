<anvil-form layout="PlanPlate_2_0.Layouts.Shell">
  <anvil-block slot="content">
    <div class="ui-wrap pp-events">
      <div class="pp-noprint"><anvil-component type="PlanPlate_2_0.Components.RestaurantNav" name="rnav" prop:tab="events"></anvil-component></div>

      <div anvil:name="list_part">
        <div class="ui-row" style="margin-bottom:18px"><h2 style="margin:0">Events</h2><span class="muted small">Private parties, wine dinners, live music</span><span class="ui-spacer"></span>
          <anvil-component type="Button" name="new_button" prop:text="Plan an event" prop:role='["btn", "btn-primary", "ic-plus"]'></anvil-component></div>
        <anvil-component type="RepeatingPanel" name="upcoming_panel" prop:item_template="PlanPlate_2_0.Items.EventCard"></anvil-component>
        <div class="ui-empty" anvil:name="empty"><h3>No events planned</h3><p>A private party closes online booking for its hours. A public event, like a jazz night, shows on your website. Each event can have its own room layout.</p></div>
        <details class="pp-past" anvil:name="past_box"><summary anvil:name="past_summary">Past events</summary>
          <anvil-component type="RepeatingPanel" name="past_panel" prop:item_template="PlanPlate_2_0.Items.EventCard"></anvil-component></details>
      </div>

      <div anvil:name="setup_part">
        <div class="pp-noprint" style="margin-bottom:12px"><anvil-component type="Button" name="back_button" prop:text="All events" prop:role='["btn", "btn-ghost", "btn-sm", "ic-left"]'></anvil-component></div>
        <div class="pp-setup">
          <div class="pp-print-area">
            <anvil-component type="Label" name="setup_eyebrow" prop:role='["eyebrow-label"]'></anvil-component>
            <anvil-component type="Label" name="setup_title" prop:role='["sec-title"]'></anvil-component>
            <anvil-component type="Label" name="setup_meta" prop:role='["muted", "small"]'></anvil-component>
            <anvil-component type="PlanPlate_2_0.Components.FloorPlan" name="floor"></anvil-component>
            <anvil-component type="Label" name="setup_notes" prop:role='["small"]'></anvil-component>
          </div>
          <div class="ui-card pp-side pp-noprint">
            <div class="ui-seg" role="group" aria-label="Floor plan tool">
              <button type="button" anvil:name="m_move" data-mode="move" anvil:on-dom:click="self.mode_click">Move</button>
              <button type="button" anvil:name="m_group" data-mode="group" anvil:on-dom:click="self.mode_click">Push together</button>
              <button type="button" anvil:name="m_out" data-mode="out" anvil:on-dom:click="self.mode_click">Take out</button>
            </div>
            <anvil-component type="Label" name="mode_help" prop:role='["muted", "small"]'></anvil-component>
            <div class="pp-group-form" anvil:name="group_form">
              <anvil-component type="Label" name="group_names" prop:role='["strong", "small"]'></anvil-component>
              <div class="pp-split">
                <label class="ui-field"><span>Seats</span><anvil-component type="TextBox" name="g_seats" prop:type="number"></anvil-component></label>
                <label class="ui-field"><span>Name</span><anvil-component type="TextBox" name="g_label" prop:placeholder="Head table"></anvil-component></label>
              </div>
              <anvil-component type="Button" name="make_group_button" prop:text="Make one table" prop:role='["btn", "btn-primary", "btn-sm", "btn-block", "ic-join"]'></anvil-component>
            </div>
            <anvil-component type="Label" name="capacity_label" prop:role='["small"]'></anvil-component>
            <anvil-component type="RepeatingPanel" name="groups_panel" prop:item_template="PlanPlate_2_0.Items.GroupRow"></anvil-component>
            <anvil-component type="Label" name="removed_label" prop:role='["muted", "small"]'></anvil-component>
            <anvil-component type="Button" name="save_setup_button" prop:text="Save the room" prop:role='["btn", "btn-primary", "btn-block"]'></anvil-component>
            <div class="ui-row">
              <anvil-component type="Button" name="everyday_button" prop:text="Start from the everyday layout" prop:role='["btn", "btn-sm"]'></anvil-component>
              <anvil-component type="Button" name="print_button" prop:text="Print" prop:role='["btn", "btn-ghost", "btn-sm", "ic-print"]'></anvil-component>
            </div>
          </div>
        </div>
      </div>
    </div>
  </anvil-block>
</anvil-form>
