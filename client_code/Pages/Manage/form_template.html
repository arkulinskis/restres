<anvil-form layout="PlanPlate_2_0.Layouts.Shell">
  <anvil-block slot="content">
    <div class="pp-book pp-manage">
      <div class="pp-sheet">
        <anvil-component type="RepeatingPanel" name="langs_panel" prop:item_template="PlanPlate_2_0.Items.Chip" prop:role='["pp-langs"]'></anvil-component>
        <div class="pp-masthead" anvil:name="masthead">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor"><circle cx="16" cy="16" r="14" stroke-width="1.4"/><circle cx="16" cy="16" r="9" stroke-width="1"/><path d="M16 10.5v11" stroke-width="1.4" stroke-linecap="round"/></svg>
          <anvil-component type="Label" name="name_label" prop:role='["pp-mast-name"]'></anvil-component>
          <anvil-component type="Label" name="addr_label" prop:role='["muted"]'></anvil-component>
        </div>
        <div class="ui-card pp-panel" anvil:name="problem_card">
          <anvil-component type="Label" name="problem_title" prop:role='["card-title"]'></anvil-component>
          <anvil-component type="Label" name="problem_text" prop:role='["muted"]'></anvil-component>
        </div>
        <div anvil:name="view_part">
          <div class="ui-card pp-status" anvil:name="status_card">
            <anvil-component type="Label" name="status_badge" prop:role='["badge"]'></anvil-component>
            <anvil-component type="Label" name="your_label" prop:role='["sec-title"]'></anvil-component>
            <anvil-component type="Label" name="lead_label" prop:role='["muted"]'></anvil-component>
            <div class="pp-facts">
              <div><anvil-component type="Label" name="f_date" prop:role='["num"]'></anvil-component><anvil-component type="Label" name="f_date_l" prop:role='["pp-fact-l"]'></anvil-component></div>
              <div><anvil-component type="Label" name="f_time" prop:role='["num"]'></anvil-component><anvil-component type="Label" name="f_time_l" prop:role='["pp-fact-l"]'></anvil-component></div>
              <div><anvil-component type="Label" name="f_party" prop:role='["num"]'></anvil-component><anvil-component type="Label" name="f_party_l" prop:role='["pp-fact-l"]'></anvil-component></div>
            </div>
            <anvil-component type="Label" name="who_label" prop:role='["muted", "small"]'></anvil-component>
          </div>
          <div class="pp-done-acts">
            <anvil-component type="Button" name="change_button" prop:role='["btn", "btn-primary", "ic-edit"]'></anvil-component>
            <anvil-component type="Button" name="ics_button" prop:role='["btn", "ic-calendar"]'></anvil-component>
            <anvil-component type="Button" name="cancel_button" prop:role='["btn", "btn-danger"]'></anvil-component>
            <a class="ui-btn primary" anvil:name="again_link" href="#"><anvil-component type="Label" name="again_label"></anvil-component></a>
            <anvil-component type="Label" name="nochange_label" prop:role='["hint", "pp-center"]'></anvil-component>
          </div>
        </div>
        <div class="ui-card pp-panel" anvil:name="change_part">
          <anvil-component type="PlanPlate_2_0.Components.SlotPicker" name="picker"></anvil-component>
          <hr>
          <div class="ui-stack">
            <anvil-component type="Label" name="details_h" prop:role='["pp-step-h"]'></anvil-component>
            <label class="ui-field"><anvil-component type="Label" name="name_cap" prop:role=\'["field-cap"]\'></anvil-component><anvil-component type="TextBox" name="name_box"></anvil-component></label>
            <div class="pp-split">
              <label class="ui-field"><anvil-component type="Label" name="email_cap" prop:role=\'["field-cap"]\'></anvil-component><anvil-component type="TextBox" name="email_box" prop:type="email"></anvil-component></label>
              <label class="ui-field"><anvil-component type="Label" name="phone_cap" prop:role=\'["field-cap"]\'></anvil-component><anvil-component type="TextBox" name="phone_box" prop:type="tel"></anvil-component></label>
            </div>
            <label class="ui-field"><anvil-component type="Label" name="notes_cap" prop:role=\'["field-cap"]\'></anvil-component><anvil-component type="TextArea" name="notes_box" prop:height="70"></anvil-component></label>
            <anvil-component type="Label" name="error_label" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
            <div class="ui-row">
              <anvil-component type="Button" name="back_button" prop:role='["btn"]'></anvil-component>
              <span class="ui-spacer"></span>
              <anvil-component type="Button" name="save_button" prop:role='["btn", "btn-primary"]'></anvil-component>
            </div>
          </div>
        </div>
        <div class="pp-bfoot">
          <a anvil:name="tel_link" href="#"><i class="ic ic-phone"></i><anvil-component type="Label" name="tel_label"></anvil-component></a>
          <a anvil:name="mail_link" href="#"><i class="ic ic-mail"></i><anvil-component type="Label" name="mail_label"></anvil-component></a>
        </div>
      </div>
    </div>
  </anvil-block>
</anvil-form>
