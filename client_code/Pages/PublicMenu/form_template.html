<anvil-form layout="PlanPlate_2_0.Layouts.Shell">
  <anvil-block slot="content">
    <div class="pp-menu">
      <div class="pp-sheet pp-menu-sheet">
        <anvil-component type="RepeatingPanel" name="langs_panel" prop:item_template="PlanPlate_2_0.Items.Chip" prop:role='["pp-langs"]'></anvil-component>
        <div class="pp-masthead">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor"><circle cx="16" cy="16" r="14" stroke-width="1.4"/><circle cx="16" cy="16" r="9" stroke-width="1"/><path d="M16 10.5v11" stroke-width="1.4" stroke-linecap="round"/></svg>
          <anvil-component type="Label" name="eyebrow" prop:role='["eyebrow-label"]'></anvil-component>
          <anvil-component type="Label" name="name_label" prop:role='["pp-mast-name"]'></anvil-component>
          <anvil-component type="Label" name="desc_label" prop:role='["muted"]'></anvil-component>
        </div>
        <div class="pp-mfiles" anvil:name="files_box"><anvil-component type="RepeatingPanel" name="files_panel" prop:item_template="PlanPlate_2_0.Items.MenuFileLink" prop:role='["contents"]'></anvil-component></div>
        <anvil-component type="RepeatingPanel" name="sections_panel" prop:item_template="PlanPlate_2_0.Items.MenuSection"></anvil-component>
        <anvil-component type="Label" name="empty_label" prop:role='["muted", "pp-center"]' prop:visible="false"></anvil-component>
        <anvil-component type="Label" name="legend_label" prop:role='["faint", "small", "pp-center"]'></anvil-component>
        <div class="pp-center pp-menu-cta" anvil:name="cta"><a class="ui-btn primary" anvil:name="book_link" href="#"><i class="ic ic-calendar"></i><anvil-component type="Label" name="book_label"></anvil-component></a></div>
      </div>
    </div>
  </anvil-block>
</anvil-form>
