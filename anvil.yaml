metadata: {title: PlanPlate 2.0}
name: PlanPlate
native_deps:
  head_html: |
    <!--
      PLANPLATE — SHARED THEME + CORE HELPERS
      Goes into: Anvil → Native Libraries (tools/sync_to_anvil.py does this).
      Fonts, colour tokens (light + dark), base styles every component uses, and window.PP.
      Look: ivory paper, warm ink, a brass accent. Serif display type, quiet sans for the interface.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- QR codes for the booking page and the menu (Settings → Share). -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <style>
    :root {
      --pp-bg: #f6f3ee; --pp-panel: #fffdf9; --pp-panel-2: #f1ede6; --pp-ink: #1d1b18; --pp-muted: #6f6a62; --pp-faint: #a19a8f; --pp-line: #e4ded4;
      --pp-accent: #1d1b18; --pp-accent-ink: #faf8f4; --pp-brass: #9c7a43; --pp-brass-soft: #f3ebdc;
      --pp-good: #3f6b4e; --pp-good-soft: #e5efe7; --pp-warn: #93650f; --pp-warn-soft: #f7ecd6; --pp-bad: #a23b2c; --pp-bad-soft: #f6e4e0;
      --pp-info: #3d5a80; --pp-info-soft: #e6ecf4;
      --pp-shadow: 0 1px 2px rgba(29,27,24,.04), 0 10px 30px rgba(29,27,24,.06);
      --pp-radius: 12px;
      --pp-serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
      --pp-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --pp-bg: #121110; --pp-panel: #1b1a18; --pp-panel-2: #161513; --pp-ink: #ece7de; --pp-muted: #a39d92; --pp-faint: #6f6a62; --pp-line: #2e2b27;
        --pp-accent: #ece7de; --pp-accent-ink: #151412; --pp-brass: #c9a56a; --pp-brass-soft: #2c2519;
        --pp-good: #8fbf9c; --pp-good-soft: #1d2a21; --pp-warn: #e2b660; --pp-warn-soft: #2f2615; --pp-bad: #e6907f; --pp-bad-soft: #33201b;
        --pp-info: #9db7da; --pp-info-soft: #1c2532;
        --pp-shadow: none; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --pp-bg: #121110; --pp-panel: #1b1a18; --pp-panel-2: #161513; --pp-ink: #ece7de; --pp-muted: #a39d92; --pp-faint: #6f6a62; --pp-line: #2e2b27;
      --pp-accent: #ece7de; --pp-accent-ink: #151412; --pp-brass: #c9a56a; --pp-brass-soft: #2c2519;
      --pp-good: #8fbf9c; --pp-good-soft: #1d2a21; --pp-warn: #e2b660; --pp-warn-soft: #2f2615; --pp-bad: #e6907f; --pp-bad-soft: #33201b;
      --pp-info: #9db7da; --pp-info-soft: #1c2532;
      --pp-shadow: none; color-scheme: dark;
    }

    /* Our design owns the page, not the Anvil theme. */
    html, body { background: var(--pp-bg) !important; color: var(--pp-ink); }
    body { font: 15px/1.55 var(--pp-sans); margin: 0; -webkit-font-smoothing: antialiased; }

    .pp, .pp * { box-sizing: border-box; }
    .pp { font: 15px/1.55 var(--pp-sans); color: var(--pp-ink); }
    .pp h1, .pp h2, .pp h3 { font-family: var(--pp-serif); font-weight: 500; line-height: 1.1; margin: 0 0 .35em; color: var(--pp-ink); letter-spacing: -.005em; }
    .pp h1 { font-size: 2.6rem; } .pp h2 { font-size: 1.75rem; } .pp h3 { font-size: 1.3rem; }
    .pp p { margin: 0 0 .8em; }
    .pp a { color: inherit; text-decoration-color: var(--pp-brass); text-underline-offset: 3px; }
    .pp [hidden] { display: none !important; }
    .pp .muted { color: var(--pp-muted); } .pp .small { font-size: .85rem; } .pp .faint { color: var(--pp-faint); }
    .pp .eyebrow { font: 600 .7rem/1.2 var(--pp-sans); letter-spacing: .18em; text-transform: uppercase; color: var(--pp-brass); margin-bottom: 10px; }
    .pp .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 96px; }
    .pp .narrow { max-width: 760px; margin: 0 auto; }
    .pp .card { background: var(--pp-panel); border: 1px solid var(--pp-line); border-radius: var(--pp-radius); box-shadow: var(--pp-shadow); }
    .pp .pad { padding: 22px 24px; }
    .pp .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pp .spacer { flex: 1; }
    .pp .stack > * + * { margin-top: 14px; }
    .pp .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    .pp .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 16px; }
    .pp hr { border: 0; border-top: 1px solid var(--pp-line); margin: 22px 0; }
    .pp .section-title { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 14px; }
    .pp .section-title h2 { margin: 0; }
    .pp :where(button.card) { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; margin: 0; -webkit-appearance: none; appearance: none; }

    .pp .btn { font: 500 .9rem/1.2 var(--pp-sans); border: 1px solid var(--pp-line); background: var(--pp-panel); color: var(--pp-ink); border-radius: 999px; padding: 10px 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; transition: border-color .15s, background .15s, opacity .15s; white-space: nowrap; }
    .pp .btn:hover { border-color: var(--pp-ink); }
    .pp .btn.primary { background: var(--pp-accent); border-color: var(--pp-accent); color: var(--pp-accent-ink); }
    .pp .btn.primary:hover { opacity: .9; }
    .pp .btn.ghost { background: transparent; border-color: transparent; color: var(--pp-muted); }
    .pp .btn.ghost:hover { color: var(--pp-ink); background: var(--pp-panel-2); }
    .pp .btn.good { background: var(--pp-good); border-color: var(--pp-good); color: #fff; }
    .pp .btn.danger { color: var(--pp-bad); }
    .pp .btn.danger:hover { border-color: var(--pp-bad); }
    .pp .btn.sm { padding: 6px 12px; font-size: .82rem; }
    .pp .btn.icon { padding: 8px; width: 36px; height: 36px; }
    .pp .btn.block { width: 100%; }
    .pp .btn:disabled { opacity: .45; cursor: not-allowed; }
    .pp .btn svg, .pp .ic { width: 16px; height: 16px; flex: none; }
    .pp .ic.rot { transform: rotate(90deg); }
    .pp .btn:focus-visible, .pp input:focus-visible, .pp textarea:focus-visible, .pp select:focus-visible, .pp [tabindex]:focus-visible { outline: 2px solid var(--pp-brass); outline-offset: 2px; }
    .pp input:focus, .pp textarea:focus, .pp select:focus { border-color: var(--pp-ink); outline: none; }

    .pp input[type=text], .pp input[type=email], .pp input[type=password], .pp input[type=tel], .pp input[type=number], .pp input[type=date], .pp input[type=time], .pp input[type=search], .pp input[type=url], .pp textarea, .pp select {
      font: inherit; color: var(--pp-ink); background: var(--pp-panel); border: 1px solid var(--pp-line); border-radius: 10px; padding: 10px 12px; width: 100%; margin: 0; box-shadow: none; height: auto; min-height: 42px;
    }
    .pp input[type=number] { -moz-appearance: textfield; }
    .pp textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
    .pp label.f { display: block; font-weight: 500; font-size: .84rem; margin-bottom: 6px; color: var(--pp-ink); }
    .pp .hint { font-size: .8rem; color: var(--pp-muted); margin-top: 5px; line-height: 1.45; }
    .pp .check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: .9rem; }
    .pp .check input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--pp-accent); flex: none; }
    .pp .inline { display: flex; align-items: center; gap: 8px; }
    .pp .inline input { width: auto; flex: 1; min-width: 0; }

    .pp .badge { display: inline-flex; align-items: center; gap: 5px; font: 500 .74rem/1.3 var(--pp-sans); padding: 3px 10px; border-radius: 99px; background: var(--pp-panel-2); color: var(--pp-muted); white-space: nowrap; letter-spacing: .02em; }
    .pp .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
    .pp .badge.plain::before { display: none; }
    .pp .badge.confirmed, .pp .badge.good { background: var(--pp-good-soft); color: var(--pp-good); }
    .pp .badge.pending, .pp .badge.warn { background: var(--pp-warn-soft); color: var(--pp-warn); }
    .pp .badge.declined, .pp .badge.bad { background: var(--pp-bad-soft); color: var(--pp-bad); }
    .pp .badge.cancelled { background: var(--pp-panel-2); color: var(--pp-faint); }
    .pp .badge.info { background: var(--pp-info-soft); color: var(--pp-info); }

    .pp .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--pp-panel-2); border-radius: 99px; border: 1px solid var(--pp-line); }
    .pp .seg button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 99px; font-size: .84rem; color: var(--pp-muted); }
    .pp .seg button.on { background: var(--pp-panel); color: var(--pp-ink); box-shadow: var(--pp-shadow); }
    .pp .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .pp .chip { all: unset; box-sizing: border-box; cursor: pointer; min-width: 40px; text-align: center; padding: 7px 11px; border-radius: 99px; border: 1px solid var(--pp-line); background: var(--pp-panel); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .pp .chip:hover { border-color: var(--pp-ink); }
    .pp .chip.on { background: var(--pp-accent); color: var(--pp-accent-ink); border-color: var(--pp-accent); }
    .pp .chip:disabled, .pp .chip.off { opacity: .35; cursor: not-allowed; text-decoration: line-through; }
    .pp .chip:focus-visible { outline: 2px solid var(--pp-brass); outline-offset: 2px; }

    .pp .bar { height: 6px; background: var(--pp-panel-2); border-radius: 99px; overflow: hidden; }
    .pp .bar > span { display: block; height: 100%; background: var(--pp-ink); border-radius: 99px; }
    .pp .bar.hot > span { background: var(--pp-warn); }

    .pp .empty { text-align: center; padding: 48px 20px; border: 1px dashed var(--pp-line); border-radius: var(--pp-radius); color: var(--pp-muted); }
    .pp .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: .9rem; }
    .pp .feedback.good { background: var(--pp-good-soft); color: var(--pp-good); }
    .pp .feedback.bad { background: var(--pp-bad-soft); color: var(--pp-bad); }
    .pp .feedback.info { background: var(--pp-warn-soft); color: var(--pp-warn); }
    .pp .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--pp-line); border-top-color: currentColor; border-radius: 50%; animation: pp-spin .8s linear infinite; vertical-align: -2px; }
    @keyframes pp-spin { to { transform: rotate(360deg); } }
    .pp .fade-in { animation: pp-fade .3s ease-out; }
    @keyframes pp-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .pp .loading { padding: 60px 0; text-align: center; color: var(--pp-muted); }

    /* Restaurant sub-navigation (PP.subnav) */
    .pp .subnav { border-bottom: 1px solid var(--pp-line); margin-bottom: 28px; }
    .pp .subnav .top { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding-bottom: 14px; }
    .pp .subnav .who { min-width: 0; }
    .pp .subnav h1 { margin: 0; overflow-wrap: anywhere; }
    .pp .subnav select { width: auto; min-height: 34px; padding: 5px 30px 5px 10px; font-size: .82rem; border-radius: 99px; color: var(--pp-muted); }
    .pp .subnav .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
    .pp .subnav .tabs::-webkit-scrollbar { display: none; }
    .pp .subnav .tabs button { all: unset; cursor: pointer; padding: 10px 14px; font-size: .9rem; color: var(--pp-muted); border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
    .pp .subnav .tabs button:hover { color: var(--pp-ink); }
    .pp .subnav .tabs button.on { color: var(--pp-ink); border-bottom-color: var(--pp-ink); }
    .pp .subnav .tabs .n { background: var(--pp-warn); color: #fff; font-size: .7rem; border-radius: 99px; padding: 1px 7px; font-weight: 600; }

    /* Time-zone picker (PP.tzField) */
    .pp .pp-tz { position: relative; }
    .pp .pp-tz input.pp-tz-q { padding-right: 38px; text-overflow: ellipsis; }
    .pp .pp-tz > .ic { position: absolute; right: 13px; top: 13px; color: var(--pp-faint); pointer-events: none; }
    .pp .pp-tz-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60; max-height: 296px; overflow-y: auto; overscroll-behavior: contain; padding: 4px;
      background: var(--pp-panel); border: 1px solid var(--pp-line); border-radius: 10px; box-shadow: 0 12px 32px rgba(29,27,24,.14); }
    .pp .pp-tz-o { display: flex; align-items: baseline; gap: 8px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: .88rem; }
    .pp .pp-tz-o b { font-weight: 500; white-space: nowrap; }
    .pp .pp-tz-o .c { flex: 1; min-width: 0; color: var(--pp-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pp .pp-tz-o .o { color: var(--pp-faint); font-size: .78rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .pp .pp-tz-o.on { background: var(--pp-panel-2); }
    .pp .pp-tz-o.sel { box-shadow: inset 2px 0 0 var(--pp-brass); }
    .pp .pp-tz-o.sel b { color: var(--pp-brass); }
    .pp .pp-tz-empty { padding: 12px 10px; color: var(--pp-muted); font-size: .85rem; }
    @media (max-width: 720px) { .pp .pp-tz-list { max-height: min(296px, 36vh); } }

    /* Modal (PP.modal) */
    .pp-modal { position: fixed; inset: 0; z-index: 900; background: rgba(18,17,16,.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto; }
    .pp-modal > .box { width: min(560px, 100%); padding: 26px 26px 22px; position: relative; }
    .pp-modal > .box.wide { width: min(760px, 100%); }
    .pp-modal .x { position: absolute; top: 12px; right: 12px; }
    .pp-modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }

    #pp-toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 1000; display: grid; gap: 8px; font: 14px/1.4 var(--pp-sans); }
    #pp-toasts .t { background: var(--pp-ink); color: var(--pp-bg); padding: 11px 18px; border-radius: 99px; box-shadow: var(--pp-shadow); max-width: 90vw; text-align: center; }
    #pp-toasts .t.err { background: var(--pp-bad); color: #fff; border-radius: 12px; }

    @media (max-width: 720px) {
      .pp h1 { font-size: 2rem; } .pp .pad { padding: 18px; } .pp .wrap { padding: 22px 16px 80px; }
      .pp .grid2, .pp .grid3 { grid-template-columns: 1fr; }
      .pp-modal { padding: 0; align-items: flex-end; }
      .pp-modal > .box, .pp-modal > .box.wide { width: 100%; border-radius: 16px 16px 0 0; max-height: 92vh; overflow-y: auto; padding: 22px 18px 18px; }
    }

    /* Anvil's loading spinner: a thin ring in our colours. */
    #loadingSpinner { --anvil-spinner-bg: var(--pp-bg); }
