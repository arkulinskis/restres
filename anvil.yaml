    .pp-res .list { width: 100%; border-collapse: collapse; }
    .pp-res .list th { text-align: left; font: 500 .7rem/1 var(--pp-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--pp-muted); padding: 12px 14px; border-bottom: 1px solid var(--pp-line); }
    .pp-res .list td { padding: 13px 14px; border-bottom: 1px solid var(--pp-line); font-size: .9rem; vertical-align: top; }
