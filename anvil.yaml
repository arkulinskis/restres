    .pp-book .note { font-size: .86rem; color: var(--pp-muted); border-left: 2px solid var(--pp-brass); padding: 2px 0 2px 12px; margin-bottom: 24px; }
    .pp-book .summary { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--pp-panel-2); border-radius: 10px; margin-bottom: 20px; font-size: .92rem; flex-wrap: wrap; }
    .pp-book .summary strong { font-weight: 600; }
    .pp-book .privacy { font-size: .84rem; color: var(--pp-muted); background: var(--pp-panel-2); border-radius: 10px; padding: 12px 14px; margin-top: 10px; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
    .pp-book .consent { padding: 14px 0 4px; }
    .pp-book .consent a, .pp-book .consent button.lnk { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--pp-brass); }
    .pp-book .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .pp-book .done { text-align: center; padding: 34px 26px 28px; }
    .pp-book .done .tick { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; background: var(--pp-good-soft); color: var(--pp-good); }
    .pp-book .done .tick.wait { background: var(--pp-warn-soft); color: var(--pp-warn); }
    .pp-book .done .tick svg { width: 28px; height: 28px; }
    .pp-book .done .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 22px 0; padding: 16px 0; border-top: 1px solid var(--pp-line); border-bottom: 1px solid var(--pp-line); }
    .pp-book .done .facts b { display: block; font: 500 1.35rem/1.2 var(--pp-serif); }
    .pp-book .done .facts span { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--pp-muted); }
    .pp-book .done .actions { display: grid; gap: 8px; max-width: 340px; margin: 18px auto 0; }
    .pp-book .foot { text-align: center; color: var(--pp-muted); font-size: .82rem; margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; }
    .pp-book .foot span { display: inline-flex; gap: 6px; align-items: center; }

    /* PP.picker */
    .pp-pick .cal { user-select: none; }
    .pp-pick .cal .hd { display: flex; align-items: center; margin-bottom: 8px; }
    .pp-pick .cal .hd strong { flex: 1; text-align: center; font: 500 1.25rem var(--pp-serif); }
    .pp-pick .cal .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .pp-pick .cal .wd { text-align: center; font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--pp-faint); padding: 4px 0; }
    .pp-pick .cal .d { all: unset; box-sizing: border-box; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; cursor: pointer; font-size: .9rem; font-variant-numeric: tabular-nums; max-height: 46px; margin: 0 auto; width: 100%; max-width: 46px; }
    .pp-pick .cal .d:hover:not(:disabled) { background: var(--pp-panel-2); }
    .pp-pick .cal .d:disabled { color: var(--pp-faint); cursor: default; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--pp-faint) 50%, transparent); }
    .pp-pick .cal .d.out { visibility: hidden; }
    .pp-pick .cal .d.on { background: var(--pp-accent); color: var(--pp-accent-ink); }
    .pp-pick .cal .d.today { font-weight: 700; }
    .pp-pick .cal .d:focus-visible { outline: 2px solid var(--pp-brass); }
    .pp-pick .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
    .pp-pick .times .chip { position: relative; }
    .pp-pick .times .chip.review::after { content: ""; position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--pp-warn); }
    .pp-pick .times .chip.walk { text-decoration: none; font-size: .72rem; }
    .pp-pick .tnote { font-size: .8rem; color: var(--pp-muted); margin-top: 10px; display: flex; gap: 8px; align-items: center; }
    .pp-pick .tnote i { width: 6px; height: 6px; border-radius: 50%; background: var(--pp-warn); display: inline-block; flex: none; }
    .pp-pick .party .more { width: auto; min-height: 36px; padding: 5px 30px 5px 12px; border-radius: 99px; font-size: .85rem; }
    @media (max-width: 520px) { .pp-book { padding: 22px 12px; } .pp-book .panel { padding: 20px 16px; } .pp-book .masthead h1 { font-size: 2.1rem; } }
