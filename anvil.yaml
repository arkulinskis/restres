  title: PlanPlate 2.0
name: PlanPlate
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=c034c12ee1\"></script>\n\n<!--\n  PLANPLATE — SHARED THEME + CORE HELPERS\n\
    \  Goes into: Anvil → Native Libraries (tools/sync_to_anvil.py does this).\n  Fonts, colour tokens (light + dark), base\
    \ styles every component uses, and window.PP.\n  Look: ivory paper, warm ink, a brass accent. Serif display type, quiet\
    \ sans for the interface.\n-->\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\"\
    \ href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap\"\
    \ rel=\"stylesheet\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<!-- Browser tab icon:\
    \ the PlanPlate mark (a plate from above), brass on ink. Anvil's default icon is removed. -->\n<link id=\"pp-favicon\"\
    \ rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0\
    \ 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231d1b18'/%3E%3Ccircle cx='16' cy='16' r='11.8' fill='none' stroke='%23c9a56a'\
    \ stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7.4' fill='none' stroke='%23c9a56a' stroke-width='1.3'/%3E%3Cpath d='M16\
    \ 11.6v8.8' stroke='%23c9a56a' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E\">\n<link rel=\"apple-touch-icon\"\
    \ href=\"_/theme/icon-180.png\">\n<script>\n(function () {\n  function keepOurs() {\n    var ours = document.getElementById('pp-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n    if (ours !== document.head.lastElementChild) document.head.appendChild(ours);\n  }\n  keepOurs();\n  document.addEventListener('DOMContentLoaded',\
    \ keepOurs);\n  window.addEventListener('load', keepOurs);\n})();\n</script>\n<!-- QR codes for the booking page and the\
    \ menu (Settings → Share). -->\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js\"\
    ></script>\n\n<style>\n:root {\n  --pp-bg: #f6f3ee; --pp-panel: #fffdf9; --pp-panel-2: #f1ede6; --pp-ink: #1d1b18; --pp-muted:\
    \ #6f6a62; --pp-faint: #a19a8f; --pp-line: #e4ded4;\n  --pp-accent: #1d1b18; --pp-accent-ink: #faf8f4; --pp-brass: #9c7a43;\
    \ --pp-brass-soft: #f3ebdc;\n  --pp-good: #3f6b4e; --pp-good-soft: #e5efe7; --pp-warn: #93650f; --pp-warn-soft: #f7ecd6;\
    \ --pp-bad: #a23b2c; --pp-bad-soft: #f6e4e0;\n  --pp-info: #3d5a80; --pp-info-soft: #e6ecf4;\n  --pp-shadow: 0 1px 2px\
    \ rgba(29,27,24,.04), 0 10px 30px rgba(29,27,24,.06);\n  --pp-radius: 12px;\n  --pp-serif: \"Cormorant Garamond\", \"\
    Iowan Old Style\", Georgia, serif;\n  --pp-sans: \"Inter\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n\
    \  color-scheme: light;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --pp-bg:\
    \ #121110; --pp-panel: #1b1a18; --pp-panel-2: #161513; --pp-ink: #ece7de; --pp-muted: #a39d92; --pp-faint: #6f6a62; --pp-line:\
    \ #2e2b27;\n    --pp-accent: #ece7de; --pp-accent-ink: #151412; --pp-brass: #c9a56a; --pp-brass-soft: #2c2519;\n    --pp-good:\
    \ #8fbf9c; --pp-good-soft: #1d2a21; --pp-warn: #e2b660; --pp-warn-soft: #2f2615; --pp-bad: #e6907f; --pp-bad-soft: #33201b;\n\
