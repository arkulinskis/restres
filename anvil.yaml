        closedOnline: 'La réservation en ligne est fermée pour le moment.', callUs: 'Appelez-nous', notFound: 'Restaurant introuvable',
        party: 'Personnes', at: 'à', bigGroup: 'Pour les groupes plus nombreux, contactez-nous.', poweredBy: 'Réservations par PlanPlate'
      };
      PP.LANGS.lv = {
        reserve: 'Rezervēt galdiņu', guests: 'Viesi', date: 'Datums', time: 'Laiks', details: 'Jūsu dati',
        guest: 'viesis', guestsN: 'viesi', more: 'Vairāk…', pickDate: 'Izvēlieties datumu, lai redzētu pieejamos laikus.',
        loading: 'Meklējam galdiņus…', noTimes: 'Šajā dienā nav brīvu galdiņu {n} personām. Lūdzu, izvēlieties citu dienu.',
        walkIn: 'Bez rezervācijas', walkNote: 'Dažos laikos esam gandrīz pilni, bet tad laipni gaidām arī bez rezervācijas.',
        reviewNote: 'Pieprasījumus šajos laikos restorāns apstiprina personīgi.', closedDay: 'Šajā dienā slēgts.',
        name: 'Vārds, uzvārds', email: 'E-pasts', phone: 'Tālrunis', notes: 'Īpaši vēlējumi', notesPh: 'Alerģijas, svētki, bērnu krēsliņš…', optional: 'nav obligāti',
        change: 'Mainīt', consent: 'Esmu izlasījis {link} un piekrītu, ka {r} izmanto manus datus šīs rezervācijas pārvaldībai.',
        privacyLink: 'privātuma paziņojumu', submit: 'Rezervēt', submitReview: 'Nosūtīt pieprasījumu', back: 'Atpakaļ',
        doneTitle: 'Jūsu galdiņš ir rezervēts', doneWait: 'Pieprasījums saņemts', doneText: 'Gaidīsim jūs! Saglabājiet šo saiti, lai mainītu vai atceltu rezervāciju:',
        waitText: 'Restorāns drīz apstiprinās jūsu pieprasījumu. Ar šo saiti varat pārbaudīt statusu, to mainīt vai atcelt:',
        manage: 'Pārvaldīt rezervāciju', copy: 'Kopēt saiti', calendar: 'Pievienot kalendāram', copied: 'Saite',
        closedOnline: 'Tiešsaistes rezervācija pašlaik nav pieejama.', callUs: 'Lūdzu, zvaniet', notFound: 'Restorāns nav atrasts',
        party: 'Viesi', at: 'plkst.', bigGroup: 'Lielākām grupām, lūdzu, sazinieties ar mums.', poweredBy: 'Rezervācijas: PlanPlate'
      };
      PP.LOCALES = { en: 'en-GB', fr: 'fr-FR', lv: 'lv-LV' };
      PP.LANG_NAMES = { en: 'English', fr: 'Français', lv: 'Latviešu' };
      PP.setLang = function (l) {
        PP.lang = PP.LANGS[l] ? l : 'en'; PP.locale = PP.LOCALES[PP.lang];
        try { document.documentElement.lang = PP.lang; } catch (e) {}
      };
      // A quiet "EN · FR · LV" switcher for the guest pages (only when the restaurant offers more than one).
      PP.langSwitch = function (langs) {
        if (!langs || langs.length < 2) return '';
        return '<div class="langs" role="group" aria-label="Language">' + langs.map(function (l) {
          return '<button type="button" data-lang="' + l + '" class="' + (l === PP.lang ? 'on' : '') + '" lang="' + l + '" title="' + PP.esc(PP.LANG_NAMES[l]) + '">' + l.toUpperCase() + '</button>';
        }).join('') + '</div>';
      };
      PP.T = function (key, vars, lang) {
        var t = (PP.LANGS[lang || PP.lang || 'en'] || PP.LANGS.en)[key] || PP.LANGS.en[key] || key;
        Object.keys(vars || {}).forEach(function (k) { t = t.split('{' + k + '}').join(vars[k]); });
        return t;
      };

      // An .ics calendar file for the reservation (floating local time, like the booking itself).
      PP.ics = function (res, restaurant, link) {
        function stamp(date, min) { return date.replace(/-/g, '') + 'T' + PP.hm(min).replace(':', '') + '00'; }
        function clean(s) { return String(s || '').replace(/[\\;,]/g, function (c) { return '\\' + c; }).replace(/\n/g, '\\n'); }
        var now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
        var body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PlanPlate//Reservations//EN', 'BEGIN:VEVENT', 'UID:' + res.token + '@planplate', 'DTSTAMP:' + now,
          'DTSTART:' + stamp(res.date, res.start_min), 'DTEND:' + stamp(res.date, res.start_min + res.duration),
          'SUMMARY:' + clean('Table at ' + restaurant.name), 'LOCATION:' + clean(restaurant.address),
          'DESCRIPTION:' + clean(res.party + ' guests. Change or cancel: ' + link), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' }));
        a.download = 'reservation.ics';
        document.body.appendChild(a); a.click(); a.remove();
      };

      // Party / date / time picker. opts: {days:[{date,open}], today, maxParty, party, date, time, load(date, party) → Promise(slots reply), onChange(state)}
      PP.picker = function (el, opts) {
        var esc = PP.esc, T = PP.T;
        var open = {}, firstDay = null, lastDay = null;
        (opts.days || []).forEach(function (d) { open[d.date] = d.open; if (!firstDay) firstDay = d.date; lastDay = d.date; });
        var S = { party: opts.party || 2, date: opts.date || null, time: opts.time || null, review: false, slots: null, loading: false, err: null };
        if (S.date && !(S.date in open)) S.date = null;
        var month = (S.date || firstDay || opts.today || PP.isoDate(new Date())).slice(0, 7);
        if (!S.date) { var f = (opts.days || []).filter(function (d) { return d.open; })[0]; S.date = f ? f.date : null; if (S.date) month = S.date.slice(0, 7); }
        var seq = 0;

        function partyHtml() {
          var max = opts.maxParty || 8, chips = '', top = Math.min(max, 8);
          for (var i = 1; i <= top; i++) chips += '<button type="button" class="chip' + (S.party === i ? ' on' : '') + '" data-p="' + i + '" aria-pressed="' + (S.party === i) + '">' + i + '</button>';
          if (max > 8) {
            var sel = '<select class="more" data-more aria-label="' + esc(T('more')) + '"><option value="">' + esc(T('more')) + '</option>';
            for (var j = 9; j <= max; j++) sel += '<option value="' + j + '"' + (S.party === j ? ' selected' : '') + '>' + j + '</option>';
            chips += sel + '</select>';
          }
          return '<div class="chips party">' + chips + '</div>';
        }
        function calHtml() {
          var first = PP.parseDate(month + '-01'), lead = (first.getDay() + 6) % 7, cells = '';
          for (var i = 0; i < lead; i++) cells += '<span class="d out"></span>';
          var d = new Date(first);
          while (d.getMonth() === first.getMonth()) {
            var iso = PP.isoDate(d), ok = open[iso] === true;
            cells += '<button type="button" class="d' + (iso === S.date ? ' on' : '') + (iso === opts.today ? ' today' : '') + '" data-d="' + iso + '"' + (ok ? '' : ' disabled') +
              ' aria-label="' + esc(PP.fmtDate(iso)) + '">' + d.getDate() + '</button>';
            d.setDate(d.getDate() + 1);
          }
          var prev = firstDay && month > firstDay.slice(0, 7), next = lastDay && month < lastDay.slice(0, 7);
          return '<div class="cal"><div class="hd"><button type="button" class="btn ghost icon" data-m="-1"' + (prev ? '' : ' disabled') + ' aria-label="Previous month">' + PP.icon('left') + '</button>' +
            '<strong>' + esc(first.toLocaleDateString(PP.locale || undefined, { month: 'long', year: 'numeric' })) + '</strong>' +
            '<button type="button" class="btn ghost icon" data-m="1"' + (next ? '' : ' disabled') + ' aria-label="Next month">' + PP.icon('right') + '</button></div>' +
            '<div class="g">' + PP.DAYS3.map(function (w, i) { return '<span class="wd">' + esc(PP.parseDate('2024-01-0' + (i + 1)).toLocaleDateString(PP.locale || undefined, { weekday: 'short' }).slice(0, 2)) + '</span>'; }).join('') + cells + '</div></div>';
        }
        function timesHtml() {
          if (!S.date) return '<p class="muted small">' + esc(T('pickDate')) + '</p>';
          if (S.loading) return '<p class="muted small"><span class="spin"></span> ' + esc(T('loading')) + '</p>';
          if (S.err) return '<div class="feedback bad">' + esc(S.err) + '</div>';
          var r = S.slots;
          if (!r) return '';
          if (r.closed) return '<p class="muted small">' + esc(T('closedDay')) + (r.label ? ' · ' + esc(r.label) : '') + '</p>';
          var any = r.slots.some(function (s) { return s.state === 'open'; }), walk = r.slots.some(function (s) { return s.state === 'walk_in'; }), rev = r.slots.some(function (s) { return s.review && s.state === 'open'; });
          if (!any) return '<p class="muted small">' + esc(T('noTimes', { n: S.party })) + '</p>' + (walk ? '<p class="tnote">' + esc(T('walkNote')) + '</p>' : '');
          return '<div class="times">' + r.slots.map(function (s) {
            if (s.state === 'full') return '';
            if (s.state === 'walk_in') return '<button type="button" class="chip walk off" disabled title="' + esc(T('walkNote')) + '">' + esc(s.time) + ' · ' + esc(T('walkIn')) + '</button>';
            return '<button type="button" class="chip' + (s.review ? ' review' : '') + (S.time === s.time ? ' on' : '') + '" data-t="' + s.time + '" data-r="' + (s.review ? 1 : 0) + '" aria-pressed="' + (S.time === s.time) + '">' + esc(s.time) + '</button>';
          }).join('') + '</div>' +
            (rev ? '<p class="tnote"><i></i>' + esc(T('reviewNote')) + '</p>' : '') + (walk ? '<p class="tnote">' + esc(T('walkNote')) + '</p>' : '');
        }
        function render() {
          el.innerHTML = '<div class="pp-pick"><div class="step"><h2>' + esc(T('guests')) + '</h2>' + partyHtml() + '</div>' +
            '<div class="step"><h2>' + esc(T('date')) + '</h2>' + calHtml() + '</div>' +
            '<div class="step"><h2>' + esc(T('time')) + (S.date ? ' · <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--pp-ink)">' + esc(PP.fmtDate(S.date)) + '</span>' : '') + '</h2><div data-el="times">' + timesHtml() + '</div></div></div>';
        }
        function load() {
          if (!S.date) { render(); return; }
          var my = ++seq;
          S.loading = true; S.err = null; render();
          opts.load(S.date, S.party).then(function (r) {
            if (my !== seq) return;
            S.loading = false;
            if (!r || r.ok === false) { S.err = (r && r.error) || 'Could not load times.'; S.slots = null; }
            else {
              S.slots = r;
              var still = r.slots.filter(function (s) { return s.time === S.time && s.state === 'open'; })[0];
              if (!still) S.time = null; else S.review = !!still.review;
            }
            render(); changed();
          }, function (e) { if (my === seq) { S.loading = false; S.err = PP.err(e); render(); } });
        }
        function changed() { if (opts.onChange) opts.onChange({ party: S.party, date: S.date, time: S.time, review: S.review }); }
        el.addEventListener('click', function (e) {
          var b = e.target.closest('button');
          if (!b || b.disabled) return;
          if (b.dataset.p) { S.party = +b.dataset.p; S.time = null; changed(); load(); }
          else if (b.dataset.d) { S.date = b.dataset.d; S.time = null; changed(); load(); }
          else if (b.dataset.m) { var m = PP.parseDate(month + '-01'); m.setMonth(m.getMonth() + +b.dataset.m); month = PP.isoDate(m).slice(0, 7); render(); }
          else if (b.dataset.t) { S.time = b.dataset.t; S.review = b.dataset.r === '1'; render(); changed(); }
        });
        el.addEventListener('change', function (e) { if (e.target.matches('[data-more]') && e.target.value) { S.party = +e.target.value; S.time = null; changed(); load(); } });
        load();
        return { state: function () { return { party: S.party, date: S.date, time: S.time, review: S.review }; }, reload: load };
      };

      PP.define('book', function (root, data, emit) {
        var esc = PP.esc, T = PP.T;
        var R = data.restaurant || {}, step = 'pick', pick = null, result = null, form = { name: '', email: '', phone: '', notes: '', consent: false }, busy = false, err = null;
        PP.setLang(data.lang || R.language || 'en');
        var embedded = window.self !== window.top;

        function masthead() {
          return PP.langSwitch(R.languages) + '<div class="masthead">' + PP.mark() + '<div class="eyebrow">' + esc(T('reserve')) + '</div><h1>' + esc(R.name) + '</h1>' + (R.description ? '<p>' + esc(R.description) + '</p>' : '') + '</div>';
        }
        function footer() {
          return '<div class="foot">' + (R.address ? '<span>' + PP.icon('pin') + esc(R.address) + '</span>' : '') + (R.phone ? '<span>' + PP.icon('phone') + '<a href="tel:' + esc(R.phone) + '">' + esc(R.phone) + '</a></span>' : '') + '</div>';
        }
        function summary(p) {
          return '<div class="summary">' + PP.icon('calendar') + '<strong>' + esc(PP.fmtDate(p.date)) + '</strong> · ' + esc(p.time) + ' · ' + p.party + ' ' + esc(p.party === 1 ? T('guest') : T('guestsN')) +
            '<span class="spacer"></span><button type="button" class="btn ghost sm" data-action="back">' + esc(T('change')) + '</button></div>';
        }
        function detailsHtml() {
          var p = pick;
          var consent = T('consent', { link: '<button type="button" class="lnk" data-action="privacy">' + esc(T('privacyLink')) + '</button>', r: esc(R.name) });
          return summary(p) + '<form data-el="form" class="stack"><div class="step" style="margin:0"><h2>' + esc(T('details')) + '</h2></div>' +
            '<div><label class="f" for="bkName">' + esc(T('name')) + '</label><input id="bkName" name="name" type="text" autocomplete="name" required maxlength="100" value="' + esc(form.name) + '"></div>' +
            '<div class="grid2"><div><label class="f" for="bkEmail">' + esc(T('email')) + '</label><input id="bkEmail" name="email" type="email" autocomplete="email" required maxlength="200" value="' + esc(form.email) + '"></div>' +
              '<div><label class="f" for="bkPhone">' + esc(T('phone')) + '</label><input id="bkPhone" name="phone" type="tel" autocomplete="tel" required maxlength="40" value="' + esc(form.phone) + '"></div></div>' +
            '<div><label class="f" for="bkNotes">' + esc(T('notes')) + ' <span class="faint">(' + esc(T('optional')) + ')</span></label><textarea id="bkNotes" name="notes" maxlength="1000" style="min-height:70px" placeholder="' + esc(T('notesPh')) + '">' + esc(form.notes) + '</textarea></div>' +
            '<div class="hp" aria-hidden="true"><label>Website<input name="website" type="text" tabindex="-1" autocomplete="off"></label></div>' +
            '<div class="consent"><label class="check"><input type="checkbox" name="consent" required' + (form.consent ? ' checked' : '') + '><span>' + consent + '</span></label>' +
              '<div class="privacy" data-el="privacy" hidden>' + esc(R.privacy_text) + '</div></div>' +
            (err ? '<div class="feedback bad">' + esc(err) + '</div>' : '') +
            '<button class="btn primary block" type="submit" style="padding:14px"' + (busy ? ' disabled' : '') + '>' + (busy ? '<span class="spin"></span>' : esc(p.review ? T('submitReview') : T('submit'))) + '</button></form>';
        }
        function doneHtml() {
          var res = result.reservation, ok = result.status === 'confirmed', link = PP.manageUrl(result.token);
          return '<div class="done fade-in"><div class="tick' + (ok ? '' : ' wait') + '">' + PP.icon(ok ? 'check' : 'clock') + '</div>' +
            '<h2>' + esc(ok ? T('doneTitle') : T('doneWait')) + '</h2>' +
            '<div class="facts"><div><b>' + esc(PP.fmtDate(res.date, { day: 'numeric', month: 'short' })) + '</b><span>' + esc(T('date')) + '</span></div><div><b>' + esc(res.time) + '</b><span>' + esc(T('time')) + '</span></div><div><b>' + res.party + '</b><span>' + esc(T('guests')) + '</span></div></div>' +
            '<p class="muted">' + esc(ok ? T('doneText') : T('waitText')) + '</p>' +
            '<div class="actions"><a class="btn primary" data-el="manage" href="' + esc(link) + '"' + (embedded ? ' target="_blank" rel="noopener"' : '') + '>' + esc(T('manage')) + '</a>' +
              '<button class="btn" data-action="copy">' + PP.icon('copy') + esc(T('copy')) + '</button>' +
              '<button class="btn ghost" data-action="ics">' + PP.icon('calendar') + esc(T('calendar')) + '</button></div></div>';
        }
        function render() {
          var body;
          if (!data.ok) body = '<div class="card panel" style="text-align:center"><h2>' + esc(T('notFound')) + '</h2><p class="muted">' + esc(data.error || '') + '</p></div>';
          else if (!R.accepting) body = '<div class="card panel" style="text-align:center"><p>' + esc(T('closedOnline')) + '</p>' + (R.phone ? '<a class="btn primary" href="tel:' + esc(R.phone) + '">' + PP.icon('phone') + esc(T('callUs')) + ' · ' + esc(R.phone) + '</a>' : '') + '</div>';
          else if (step === 'done') body = '<div class="card">' + doneHtml() + '</div>';
          else body = '<div class="card panel">' + (R.form_note && step === 'pick' ? '<div class="note">' + esc(R.form_note) + '</div>' : '') +
            '<div data-el="picker"' + (step === 'pick' ? '' : ' hidden') + '></div>' +
            (step === 'pick' ? '<button class="btn primary block" data-action="next" style="margin-top:24px;padding:14px"' + (pick && pick.time ? '' : ' disabled') + '>' + esc(T('details')) + PP.icon('right') + '</button>' +
              '<p class="hint" style="text-align:center;margin-top:12px">' + esc(T('bigGroup')) + '</p>' : detailsHtml()) + '</div>';
          root.innerHTML = '<div class="pp-book"><div class="sheet">' + (data.ok ? masthead() : '') + body + (data.ok ? footer() : '') + '</div></div>';
          var holder = root.querySelector('[data-el=picker]');
          if (holder) {
            if (!picker) picker = mkPicker();
            holder.appendChild(pickerEl);
          }
          var f = root.querySelector('[data-el=form]');
          if (f) f.onsubmit = submit;
        }
        var pickerEl = document.createElement('div'), picker = null;
        function mkPicker() {
          var was = pick || {};
          return PP.picker(pickerEl, {
            days: data.days, today: data.today, maxParty: R.max_party, party: was.party || 2, date: was.date, time: was.time,
            load: function (date, party) { return emit('slots', { date: date, party: party }); },
            onChange: function (st) { pick = st; var b = root.querySelector('[data-action=next]'); if (b) b.disabled = !st.time; }
          });
        }
        function keep() {
          var f = root.querySelector('[data-el=form]');
          if (!f) return;
          ['name', 'email', 'phone', 'notes'].forEach(function (k) { form[k] = f[k].value; });
          form.consent = f.consent.checked;
        }
        function submit(e) {
          e.preventDefault();
          if (busy) return;
          keep();
          var f = e.target;
          if (!f.reportValidity()) return;
          busy = true; err = null; render();
          emit('book', Object.assign({}, form, { date: pick.date, time: pick.time, party: pick.party, website: f.website.value, language: PP.lang })).then(function (res) {
            busy = false;
            if (res && res.ok) { result = res; step = 'done'; render(); window.scrollTo(0, 0); return; }
            err = (res && res.error) || 'Something went wrong.'; render();
            if (/taken|available/.test(err)) { picker.reload(); }
          }, function (x) { busy = false; err = PP.err(x); render(); });
        }
        root.addEventListener('click', function (e) {
          var lb = e.target.closest('[data-lang]');
          if (lb) {
            keep(); PP.setLang(lb.dataset.lang);
            if (data.privacy && data.privacy[PP.lang]) R.privacy_text = data.privacy[PP.lang];
            pickerEl = document.createElement('div'); picker = null;
            document.title = T('reserve') + ' · ' + R.name;
            render(); return;
          }
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var a = el.dataset.action;
          if (a === 'next' && pick && pick.time) { step = 'details'; render(); var n = root.querySelector('#bkName'); if (n) n.focus(); }
          else if (a === 'back') { keep(); step = 'pick'; err = null; render(); }
          else if (a === 'privacy') { var p = root.querySelector('[data-el=privacy]'); p.hidden = !p.hidden; }
          else if (a === 'copy') PP.copy(PP.manageUrl(result.token), T('copied'));
          else if (a === 'ics') PP.ics(result.reservation, R, PP.manageUrl(result.token));
        });
        if (data.ok) document.title = T('reserve') + ' · ' + R.name;
        render();
        return {};
      });
    })();
    </script>

    <!-- ===== ManagePage component ===== -->
    <style>
