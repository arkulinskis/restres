    .pp-res .list .note { color: var(--pp-muted); font-size: .8rem; display: block; margin-top: 2px; }
    @media (max-width: 720px) {
      .pp-res .list thead { display: none; }
      .pp-res .list tr { display: grid; grid-template-columns: 60px 1fr auto; padding: 10px 0; border-bottom: 1px solid var(--pp-line); }
      .pp-res .list td { border: 0; padding: 3px 10px; }
      .pp-res .list td.hide-m { display: none; }
      .pp-res .tl { --lab: 70px; } .pp-res .tl .lab { padding: 10px 8px; }
    }

    .pp-ed .tables-pick { max-height: 180px; overflow-y: auto; border: 1px solid var(--pp-line); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px 10px; }
    .pp-ed .meta { font-size: .8rem; color: var(--pp-muted); }
    .pp-ed details { margin-top: 16px; font-size: .84rem; }
    .pp-ed details summary { cursor: pointer; color: var(--pp-muted); }
    .pp-ed .hist { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
    .pp-ed .hist li { display: flex; gap: 10px; } .pp-ed .hist time { color: var(--pp-faint); white-space: nowrap; }
    .pp-ed .linkbox { display: flex; gap: 6px; align-items: center; background: var(--pp-panel-2); border-radius: 10px; padding: 6px 6px 6px 12px; font-size: .8rem; color: var(--pp-muted); }
    .pp-ed .linkbox code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
    <script>
    (function () {
      var PP = window.PP;
      PP.define('reservations', function (root, data, emit) {
        var esc = PP.esc;
        var D = data, view = 'timeline', HOUR = 96;
        try { view = localStorage.getItem('pp.resView') || 'timeline'; } catch (e) {}

        function byTable() {
          var m = {};
          D.tables.forEach(function (t) { m[t.id] = t; });
          return m;
        }
        function resById(id) {
          return D.reservations.concat(D.pending).filter(function (r) { return r.id === id; })[0];
        }

        // ---------- approvals
        function approvals() {
          if (!D.pending.length) return '';
          return '<section class="approvals"><div class="section-title" style="margin-top:0"><h2>' + PP.icon('bell') + 'Awaiting your approval</h2><span class="muted small">' + D.pending.length + '</span></div>' +
            '<div class="ap-grid">' + D.pending.map(function (r) {
              var a = r.analysis || {};
              return '<div class="card ap fade-in" data-id="' + esc(r.id) + '">' +
                '<div class="when">' + esc(PP.fmtShort(r.date)) + ' · ' + esc(r.time) + '–' + esc(r.end) + '</div>' +
                '<h3>' + esc(r.name) + ' <span class="muted" style="font-size:1rem">· ' + PP.plural(r.party, 'guest') + '</span></h3>' +
                '<div class="why">' + esc(r.review_reason || 'Needs a decision.') + '</div>' +
                '<div class="meter"><div class="bar"><span class="with" style="width:' + Math.min(100, a.pct_with || 0) + '%"></span><span class="without" style="width:' + Math.min(100, a.pct_without || 0) + '%"></span>' +
                  '<span class="thr" style="left:' + (a.threshold || 80) + '%" title="Auto-approval limit"></span></div>' +
                  '<div>' + (a.pct_without || 0) + '% booked now · ' + (a.pct_with || 0) + '% if you accept · limit ' + (a.threshold || 80) + '%</div></div>' +
                '<div class="facts"><span>' + PP.icon('table') + esc((r.table_names || []).join(' + ') || 'No table') + '</span>' +
                  '<span>' + PP.icon('grid') + PP.plural(a.free_units || 0, 'other table') + ' free</span>' +
                  (r.phone ? '<span>' + PP.icon('phone') + '<a href="tel:' + esc(r.phone) + '">' + esc(r.phone) + '</a></span>' : '') + '</div>' +
                (r.notes ? '<p class="small muted" style="margin-top:-6px">“' + esc(r.notes) + '”</p>' : '') +
                '<div class="acts"><button class="btn good sm" data-action="status" data-status="confirmed">' + PP.icon('check') + 'Approve</button>' +
                  '<button class="btn sm danger" data-action="status" data-status="declined">Decline</button>' +
                  '<button class="btn ghost sm" data-action="edit">Details</button>' +
                  (r.date !== D.date ? '<button class="btn ghost sm" data-action="goto" data-date="' + esc(r.date) + '">See the day</button>' : '') + '</div></div>';
            }).join('') + '</div></section>';
        }

        // ---------- day header
        function dayHeader() {
          var s = D.summary, isToday = D.date === D.today;
          return '<div class="daybar"><button class="btn icon" data-action="shift" data-n="-1" aria-label="Previous day">' + PP.icon('left') + '</button>' +
            '<h2>' + esc(PP.fmtDate(D.date)) + '</h2>' +
            '<button class="btn icon" data-action="shift" data-n="1" aria-label="Next day">' + PP.icon('right') + '</button>' +
            (isToday ? '' : '<button class="btn sm" data-action="today">Today</button>') +
            '<input type="date" data-el="pick" value="' + esc(D.date) + '" aria-label="Pick a date"></div>' +
            '<div class="daymeta"><span>' + PP.icon('clock') + (D.hours.length ? esc(PP.hoursText(D.hours)) : 'Closed') + ' <span class="faint">· ' + esc(D.hours_label) + '</span></span>' +
              '<span><b>' + s.bookings + '</b> bookings</span><span><b>' + s.covers + '</b> guests</span>' +
              (s.peak.time ? '<span>Busiest <b>' + s.peak.pct + '%</b> at ' + esc(s.peak.time) + '</span>' : '') + '</div>' +
            '<div class="tools"><div class="seg"><button data-action="view" data-v="timeline" class="' + (view === 'timeline' ? 'on' : '') + '">Timeline</button>' +
              '<button data-action="view" data-v="list" class="' + (view === 'list' ? 'on' : '') + '">List</button></div><span class="spacer"></span>' +
              '<button class="btn primary" data-action="new">' + PP.icon('plus') + 'New booking</button></div>';
        }

        // ---------- timeline
        function range() {
          var lo = null, hi = null;
          D.hours.forEach(function (p) { var a = PP.toMin(p[0]), b = PP.toMin(p[1]); lo = lo == null ? a : Math.min(lo, a); hi = hi == null ? b : Math.max(hi, b); });
          D.reservations.forEach(function (r) { if (r.status === 'cancelled' || r.status === 'declined') return; lo = lo == null ? r.start_min : Math.min(lo, r.start_min); hi = hi == null ? r.start_min + r.duration : Math.max(hi, r.start_min + r.duration); });
          if (lo == null) { lo = 12 * 60; hi = 23 * 60; }
          return [Math.floor(lo / 60) * 60, Math.min(1440, Math.ceil(hi / 60) * 60)];
        }
        function timeline() {
          var rg = range(), lo = rg[0], hi = rg[1], span = hi - lo, hours = span / 60;
          var pos = function (m) { return ((m - lo) / span * 100) + '%'; };
          var w = function (m) { return (m / span * 100) + '%'; };
          var live = D.reservations.filter(function (r) { return r.status === 'pending' || r.status === 'confirmed'; });
          var ticks = '';
          for (var h = lo; h < hi; h += 60) ticks += '<span class="tick" style="left:' + pos(h) + '">' + PP.hm(h) + '</span>';
          // shade the closed parts of the day
          var shade = '', cur = lo;
          D.hours.map(function (p) { return [PP.toMin(p[0]), PP.toMin(p[1])]; }).forEach(function (p) {
            if (p[0] > cur) shade += '<span class="closed" style="left:' + pos(cur) + ';width:' + w(p[0] - cur) + '"></span>';
            cur = Math.max(cur, p[1]);
          });
          if (cur < hi) shade += '<span class="closed" style="left:' + pos(cur) + ';width:' + w(hi - cur) + '"></span>';
          var thr = D.settings.auto_threshold;
          var occ = D.curve.map(function (c) {
            var m = PP.toMin(c.time);
            return '<span class="col' + (c.pct >= thr ? ' hot' : '') + '" title="' + esc(c.time + ' · ' + c.pct + '% booked · ' + c.guests + ' guests') + '" style="left:' + pos(m) + ';width:calc(' + w(D.settings.slot_min) + ' - 2px);height:' + Math.max(2, c.pct * .32) + 'px"></span>';
          }).join('');
          var rows = D.tables.map(function (t) { return { id: t.id, name: t.name, seats: t.seats }; });
          if (live.some(function (r) { return !r.tables.length; })) rows.push({ id: '', name: 'No table', seats: '' });
          var nowLine = D.now_min != null && D.now_min >= lo && D.now_min <= hi ? '<span class="now" style="left:calc(var(--lab) + (100% - var(--lab)) * ' + ((D.now_min - lo) / span) + ')"></span>' : '';
          return '<div class="tl" style="--hours:' + hours + '"><div class="tl-in" style="min-width:calc(var(--lab) + ' + hours * HOUR + 'px)">' + nowLine +
            '<div class="tl-row head"><div class="lab">Table</div><div class="lane">' + ticks + '</div></div>' +
            '<div class="tl-row occ"><div class="lab">Booked</div><div class="lane">' + occ + '</div></div>' +
            rows.map(function (row) {
              var blocks = live.filter(function (r) { return row.id ? r.tables.indexOf(row.id) >= 0 : !r.tables.length; }).map(function (r) {
                var joined = r.tables.length > 1 ? ' · ' + r.table_names.join('+') : '';
                return '<button class="blk ' + r.status + '" data-action="edit" data-id="' + esc(r.id) + '" style="left:' + pos(r.start_min) + ';width:' + w(r.duration) + '" title="' +
                  esc(r.time + '–' + r.end + ' · ' + r.name + ' · ' + r.party + ' guests' + (r.status === 'pending' ? ' · awaiting approval' : '')) + '"><b>' + esc(r.name) + '</b> · ' + r.party + esc(joined) + '</button>';
              }).join('');
              return '<div class="tl-row"><div class="lab">' + esc(row.name) + (row.seats ? ' <span>' + row.seats + '</span>' : '') + '</div>' +
                '<div class="lane" data-lane="' + esc(row.id) + '" data-lo="' + lo + '" data-span="' + span + '">' + shade + blocks + '</div></div>';
            }).join('') + '</div></div>' +
            '<p class="hint" style="margin-top:10px">Click an empty spot on a table\'s row to book it at that time. Striped bookings are waiting for approval.</p>';
        }

        // ---------- list
        function list() {
          if (!D.reservations.length) return '<div class="empty">No reservations on this day yet.</div>';
          var order = { pending: 0, confirmed: 0, declined: 1, cancelled: 1 };
          var rows = D.reservations.slice().sort(function (a, b) { return (order[a.status] - order[b.status]) || (a.start_min - b.start_min); });
          return '<div class="card" style="overflow:hidden"><table class="list"><thead><tr><th>Time</th><th>Guest</th><th>Guests</th><th>Table</th><th>Status</th><th>Source</th></tr></thead><tbody>' +
            rows.map(function (r) {
              var gone = r.status === 'cancelled' || r.status === 'declined';
              return '<tr data-action="edit" data-id="' + esc(r.id) + '" class="' + (gone ? 'gone' : '') + '"><td class="t">' + esc(r.time) + '</td>' +
                '<td><strong>' + esc(r.name) + '</strong>' + (r.notes ? '<span class="note">' + esc(r.notes) + '</span>' : '') + (r.staff_note ? '<span class="note">Staff: ' + esc(r.staff_note) + '</span>' : '') + '</td>' +
                '<td>' + r.party + '</td><td class="hide-m">' + esc(r.table_names.join(' + ') || '—') + '</td><td>' + PP.status(r.status) + '</td><td class="hide-m muted">' + esc(PP.SOURCE[r.source] || r.source) + '</td></tr>';
            }).join('') + '</tbody></table></div>';
        }

        function render() {
          root.innerHTML = '<div class="wrap pp-res">' + PP.subnav(D.nav, 'reservations') + approvals() + dayHeader() +
            '<div data-el="body">' + (view === 'timeline' ? (D.tables.length ? timeline() : '<div class="empty">Add tables first, under Tables &amp; layout.</div>') : list()) + '</div></div>';
        }

        function load(date) {
          var body = root.querySelector('[data-el=body]');
          if (body) body.style.opacity = '.4';
          return emit('day', { date: date }).then(function (d) { if (d) { D = d; render(); } }, function (e) { PP.toast(PP.err(e), true); if (body) body.style.opacity = ''; });
        }
        function setStatus(id, status) {
          var r = resById(id);
          var go = status === 'declined' || status === 'cancelled'
            ? PP.confirm(status === 'declined' ? 'Decline this request?' : 'Cancel this booking?', (r ? r.name + ', ' + PP.fmtShort(r.date) + ' at ' + r.time + '. ' : '') + 'The table is released for other guests.', status === 'declined' ? 'Decline' : 'Cancel booking', true)
            : Promise.resolve(true);
          return go.then(function (yes) {
            if (!yes) return false;
            return emit('status', { id: id, status: status, day: D.date }).then(function (res) {
              if (res && res.ok) { D = res.day; render(); PP.toast(status === 'confirmed' ? 'Approved' : status === 'declined' ? 'Declined' : status === 'cancelled' ? 'Cancelled' : 'Updated'); return true; }
              PP.toast((res && res.error) || 'Could not update it.', true); return false;
            });
          });
        }

        // ---------- the booking editor
        function editor(r, preset) {
          var isNew = !r;
          r = r || Object.assign({ name: '', phone: '', email: '', date: D.date, time: '19:00', duration: D.settings.duration_min, party: 2, notes: '', staff_note: '', status: 'confirmed', source: 'phone', tables: [] }, preset || {});
          var durs = [];
          for (var m = 30; m <= 300; m += 15) durs.push(m);
          if (durs.indexOf(r.duration) < 0) durs.push(r.duration);
          durs.sort(function (a, b) { return a - b; });
          var manual = !!(preset && preset.tables && preset.tables.length) || (!isNew && r.tables.length > 0);
          var tbl = byTable();
          var html = '<div class="pp-ed"><div class="eyebrow">' + (isNew ? 'New booking' : esc(PP.STATUS[r.status] || r.status)) + '</div>' +
            '<h2>' + (isNew ? 'Add a booking' : esc(r.name)) + '</h2>' +
            (r.status === 'pending' && r.review_reason ? '<div class="feedback info" style="margin:0 0 14px">' + esc(r.review_reason) + '</div>' : '') +
            '<form><div class="stack">' +
            '<div class="grid3"><div><label class="f">Date</label><input type="date" name="date" required value="' + esc(r.date) + '"></div>' +
              '<div><label class="f">Time</label><input type="time" name="time" required step="' + (D.settings.slot_min * 60) + '" value="' + esc(r.time) + '"></div>' +
              '<div><label class="f">Guests</label><input type="number" name="party" min="1" max="200" required value="' + r.party + '"></div></div>' +
            '<div class="grid2"><div><label class="f">Stays for</label><select name="duration">' + durs.map(function (m) {
                return '<option value="' + m + '"' + (m === r.duration ? ' selected' : '') + '>' + Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '') + '</option>';
              }).join('') + '</select></div>' +
              '<div><label class="f">Table</label><select name="table_mode"><option value="auto">Best free table</option><option value="manual"' + (manual ? ' selected' : '') + '>Choose tables…</option></select><div class="meta" data-el="opt"></div></div></div>' +
            '<div data-el="manual"' + (manual ? '' : ' hidden') + '><div class="tables-pick">' + D.tables.map(function (t) {
                return '<label class="check small"><input type="checkbox" name="t" value="' + esc(t.id) + '"' + (r.tables.indexOf(t.id) >= 0 ? ' checked' : '') + '><span>' + esc(t.name) + ' <span class="faint">· ' + t.seats + '</span></span></label>';
              }).join('') + '</div></div>' +
            '<div class="grid2"><div><label class="f">Guest name</label><input type="text" name="name" required maxlength="100" value="' + esc(r.name) + '"></div>' +
              '<div><label class="f">Phone</label><input type="tel" name="phone" maxlength="40" value="' + esc(r.phone) + '"></div></div>' +
            '<div class="grid2"><div><label class="f">Email</label><input type="email" name="email" maxlength="200" value="' + esc(r.email) + '"></div>' +
              '<div><label class="f">Taken by</label><select name="source">' + ['phone', 'walk_in', 'online', 'staff'].map(function (s) {
                return '<option value="' + s + '"' + (r.source === s ? ' selected' : '') + '>' + PP.SOURCE[s] + '</option>';
              }).join('') + '</select></div></div>' +
            '<div><label class="f">Guest\'s requests</label><textarea name="notes" maxlength="1000" style="min-height:60px">' + esc(r.notes) + '</textarea></div>' +
            '<div><label class="f">Staff note <span class="faint">(guests never see this)</span></label><textarea name="staff_note" maxlength="1000" style="min-height:60px">' + esc(r.staff_note) + '</textarea></div>' +
            '<label class="check small"><input type="checkbox" name="notify"' + (isNew ? ' checked' : '') + '><span>Email the guest ' + (isNew ? 'a confirmation' : 'about this change') + ' <span class="faint">(when there is an email address)</span></span></label>' +
            (isNew ? '' : '<div class="linkbox"><code>' + esc(PP.manageUrl(r.token)) + '</code><button type="button" class="btn sm" data-copy>' + PP.icon('copy') + 'Guest link</button></div>') +
            '<div data-el="msg"></div></div>' +
            '<div class="foot">' +
              (!isNew && r.status === 'pending' ? '<button type="button" class="btn good" data-st="confirmed">' + PP.icon('check') + 'Approve</button><button type="button" class="btn danger" data-st="declined">Decline</button>' : '') +
              (!isNew && r.status === 'confirmed' ? '<button type="button" class="btn danger" data-st="cancelled">Cancel booking</button>' : '') +
              (!isNew && (r.status === 'cancelled' || r.status === 'declined') ? '<button type="button" class="btn" data-st="confirmed">Restore booking</button>' : '') +
              '<span class="spacer"></span><button type="button" class="btn" data-close>Close</button><button class="btn primary" type="submit">' + (isNew ? 'Add booking' : 'Save changes') + '</button></div></form>' +
            (!isNew && r.history && r.history.length ? '<details><summary>History</summary><ul class="hist">' + r.history.slice().reverse().map(function (h) {
              return '<li><time>' + esc(PP.fmtStamp(h.at)) + '</time><span>' + esc(h.what) + '</span></li>';
            }).join('') + '</ul></details>' : '') +
            (!isNew && r.consent ? '<p class="hint">The guest agreed to the privacy notice on ' + esc(PP.fmtStamp(r.consent_at)) + '.</p>' : '') + '</div>';
          var d = PP.modal(html, { wide: true });
          var f = d.el.querySelector('form'), optBox = d.el.querySelector('[data-el=opt]'), msg = d.el.querySelector('[data-el=msg]');
          var seq = 0;
          function refreshOptions() {
            var my = ++seq;
            optBox.innerHTML = '<span class="spin"></span>';
            emit('options', { date: f.date.value, time: f.time.value, party: f.party.value, duration: f.duration.value, id: isNew ? null : r.id }).then(function (o) {
              if (my !== seq) return;
              if (!o || !o.ok) { optBox.textContent = (o && o.error) || ''; return; }
              var best = o.units[0];
              optBox.innerHTML = (o.open ? '' : '<span style="color:var(--pp-bad)">Closed at this time. </span>') +
                (best ? 'Best fit: ' + esc(best.label) + ' (' + best.seats + ')' : '<span style="color:var(--pp-bad)">No free table fits.</span>') + ' · ' + o.pct + '% booked';
            });
          }
          ['date', 'time', 'party', 'duration'].forEach(function (n) { f[n].addEventListener('change', refreshOptions); });
          f.table_mode.addEventListener('change', function () { d.el.querySelector('[data-el=manual]').hidden = f.table_mode.value !== 'manual'; });
          refreshOptions();
          var copy = d.el.querySelector('[data-copy]');
          if (copy) copy.onclick = function () { PP.copy(PP.manageUrl(r.token), 'Guest link'); };
          d.el.querySelectorAll('[data-st]').forEach(function (b) {
            b.onclick = function () { setStatus(r.id, b.dataset.st).then(function (done) { if (done) d.close(); }); };
          });
          function save(force) {
            var payload = { id: isNew ? null : r.id, force: !!force, notify: f.notify.checked && !!f.email.value.trim() };
            ['date', 'time', 'party', 'duration', 'name', 'phone', 'email', 'source', 'notes', 'staff_note'].forEach(function (n) { payload[n] = f[n].value; });
            payload.tables = f.table_mode.value === 'manual' ? Array.prototype.map.call(f.querySelectorAll('input[name=t]:checked'), function (c) { return c.value; }) : 'auto';
            if (payload.tables !== 'auto' && !payload.tables.length) payload.tables = 'auto';
            var b = f.querySelector('[type=submit]'); b.disabled = true;
            msg.innerHTML = '';
            emit('save', payload).then(function (res) {
              b.disabled = false;
              if (res && res.ok) {
                d.close(); D = res.day; render();
                PP.toast((isNew ? 'Booking added' : 'Saved') + (res.emailed && res.emailed.indexOf('guest') >= 0 ? ' · guest emailed' : ''));
                return;
              }
              msg.innerHTML = '<div class="feedback ' + (res && res.conflict ? 'info' : 'bad') + '">' + esc((res && res.error) || 'Could not save.') +
                (res && res.conflict ? ' <button type="button" class="btn sm" data-force style="margin-left:6px">Save anyway</button>' : '') + '</div>';
              var fb = msg.querySelector('[data-force]');
              if (fb) fb.onclick = function () { save(true); };
            }, function (e) { b.disabled = false; msg.innerHTML = '<div class="feedback bad">' + esc(PP.err(e)) + '</div>'; });
          }
          f.onsubmit = function (e) { e.preventDefault(); save(false); };
          return d;
        }

        root.addEventListener('click', function (e) {
          if (PP.subnavClick(e, D.nav, emit)) return;
          var el = e.target.closest('[data-action]');
          if (!el) {
            var lane = e.target.closest('[data-lane]');
            if (lane && !e.target.closest('.blk')) {
              var rect = lane.getBoundingClientRect();
              var m = +lane.dataset.lo + (e.clientX - rect.left) / rect.width * +lane.dataset.span;
              var step = D.settings.slot_min;
              m = Math.max(0, Math.floor(m / step) * step);
              editor(null, { time: PP.hm(m), tables: lane.dataset.lane ? [lane.dataset.lane] : [] });
            }
            return;
          }
          var a = el.dataset.action, card = el.closest('[data-id]');
          var id = el.dataset.id || (card && card.dataset.id);
          if (a === 'shift') load(PP.addDays(D.date, +el.dataset.n));
          else if (a === 'today') load(D.today);
          else if (a === 'goto') load(el.dataset.date);
          else if (a === 'view') { view = el.dataset.v; try { localStorage.setItem('pp.resView', view); } catch (x) {} render(); }
          else if (a === 'new') editor(null);
          else if (a === 'edit' && id) editor(resById(id));
          else if (a === 'status' && id) setStatus(id, el.dataset.status);
        });
        root.addEventListener('change', function (e) {
          if (PP.subnavChange(e, 'reservations', emit)) return;
          if (e.target.matches('[data-el=pick]') && e.target.value) load(e.target.value);
        });
        render();
        return { reload: function () { return load(D.date); } };
      });
    })();
    </script>

    <!-- ===== HoursPage component ===== -->
    <style>
    .pp-hours .layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
    .pp-hours .cal-col { position: sticky; top: 80px; }
    .pp-hours .intro { color: var(--pp-muted); max-width: 64ch; margin-bottom: 22px; font-size: .92rem; }
    .pp-hours .pc { padding: 18px 20px; margin-bottom: 12px; border-left: 3px solid var(--c); }
    .pp-hours .pc .hd { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .pp-hours .pc h3 { margin: 0; }
    .pp-hours .pc .range { font-size: .82rem; color: var(--pp-muted); }
    .pp-hours .wk { display: grid; grid-template-columns: 48px 1fr; gap: 4px 12px; font-size: .86rem; font-variant-numeric: tabular-nums; }
    .pp-hours .wk .d { color: var(--pp-muted); }
    .pp-hours .wk .c { color: var(--pp-faint); }
    .pp-hours .sp { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--pp-line); }
    .pp-hours .sp:last-child { border-bottom: 0; }
    .pp-hours .sp .dt { min-width: 120px; font-weight: 500; font-size: .9rem; }
    .pp-hours .sp .lb { flex: 1; min-width: 0; font-size: .88rem; }
    .pp-hours .sp .lb span { display: block; color: var(--pp-muted); font-size: .8rem; }
    .pp-hours .cal { padding: 16px; }
    .pp-hours .cal .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .pp-hours .cal .hd h3 { margin: 0; flex: 1; text-align: center; }
    .pp-hours .cal .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .pp-hours .cal .wd { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--pp-faint); text-align: center; padding-bottom: 4px; }
    .pp-hours .cal .day { all: unset; box-sizing: border-box; cursor: pointer; min-height: 62px; padding: 5px 5px 5px 7px; border-radius: 6px; background: var(--pp-panel-2); border-left: 3px solid var(--c, transparent); font-size: .68rem; line-height: 1.3; color: var(--pp-muted); overflow: hidden; }
    .pp-hours .cal .day:hover { outline: 1px solid var(--pp-ink); }
    .pp-hours .cal .day:focus-visible { outline: 2px solid var(--pp-brass); }
    .pp-hours .cal .day b { display: block; font: 600 .82rem var(--pp-sans); color: var(--pp-ink); margin-bottom: 1px; }
    .pp-hours .cal .day.closed { background: transparent; border: 1px dashed var(--pp-line); border-left: 3px solid var(--c, var(--pp-line)); }
    .pp-hours .cal .day.today b { color: var(--pp-brass); }
    .pp-hours .cal .day.past { opacity: .5; }
    .pp-hours .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .78rem; color: var(--pp-muted); }
    .pp-hours .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .pp-hours .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
    @media (max-width: 960px) { .pp-hours .layout { grid-template-columns: 1fr; } .pp-hours .cal-col { position: static; } }
    @media (max-width: 480px) { .pp-hours .cal .day { min-height: 48px; font-size: .6rem; padding: 3px 3px 3px 5px; } .pp-hours .cal .day .h { display: none; } .pp-hours .cal .day.closed .h { display: none; } }

    .pp-pe .days { display: grid; gap: 2px; }
    .pp-pe .dayrow { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--pp-line); }
    .pp-pe .dayrow:last-child { border-bottom: 0; }
    .pp-pe .dayrow .ivs { display: grid; gap: 6px; }
    .pp-pe .iv { display: flex; gap: 6px; align-items: center; }
    .pp-pe .iv input { width: 112px; min-height: 36px; padding: 6px 8px; }
    .pp-pe .closed-note { color: var(--pp-faint); font-size: .85rem; padding-top: 7px; }
    @media (max-width: 520px) { .pp-pe .dayrow { grid-template-columns: 1fr; } .pp-pe .iv input { width: 100%; flex: 1; } }
    </style>
    <script>
    (function () {
      var PP = window.PP;
      var COLORS = ['#7d8b6a', '#3d5a80', '#9c7a43', '#8a5a6a', '#5b7f86', '#a0714f', '#6b6f8a'];
      var SPECIAL = '#b5523b';
      PP.define('hours', function (root, data, emit) {
        var esc = PP.esc, D = data;

        function color(pid) {
          var i = D.periods.map(function (p) { return p.id; }).indexOf(pid);
          return i < 0 ? 'transparent' : COLORS[i % COLORS.length];
        }
        function short(t) { return t.replace(':00', ''); }
        function rangeText(p) {
          if (!p.start && !p.end) return 'All year, every year';
          if (p.start && p.end) return PP.fmtDate(p.start, { day: 'numeric', month: 'short', year: 'numeric' }) + ' – ' + PP.fmtDate(p.end, { day: 'numeric', month: 'short', year: 'numeric' });
          return p.start ? 'From ' + PP.fmtDate(p.start, { day: 'numeric', month: 'short', year: 'numeric' }) : 'Until ' + PP.fmtDate(p.end, { day: 'numeric', month: 'short', year: 'numeric' });
        }
        function periodCard(p) {
          return '<div class="card pc fade-in" style="--c:' + color(p.id) + '" data-id="' + esc(p.id) + '"><div class="hd"><div style="flex:1;min-width:0"><h3>' + esc(p.name) + '</h3><div class="range">' + esc(rangeText(p)) + '</div></div>' +
            '<button class="btn ghost sm" data-action="edit-period">' + PP.icon('edit') + 'Edit</button>' +
            '<button class="btn ghost icon" data-action="del-period" aria-label="Delete ' + esc(p.name) + '">' + PP.icon('trash') + '</button></div>' +
            '<div class="wk">' + PP.DAYS3.map(function (d, i) {
              var iv = p.week[String(i)] || [];
              return '<span class="d">' + d + '</span><span class="' + (iv.length ? '' : 'c') + '">' + esc(PP.hoursText(iv)) + '</span>';
            }).join('') + '</div></div>';
        }
        function specials() {
          if (!D.specials.length) return '<div class="empty" style="padding:28px">No special days yet. Add holidays, closures, or events with different hours.</div>';
          return '<div class="card">' + D.specials.map(function (s) {
            return '<div class="sp" data-id="' + esc(s.id) + '"><div class="dt">' + esc(PP.fmtDate(s.date, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })) + '</div>' +
              '<div class="lb">' + esc(s.label || 'Special day') + '<span>' + (s.closed ? 'Closed' : esc(PP.hoursText(s.hours))) + '</span></div>' +
              '<button class="btn ghost icon" data-action="edit-special" aria-label="Edit">' + PP.icon('edit') + '</button>' +
              '<button class="btn ghost icon" data-action="del-special" aria-label="Delete">' + PP.icon('trash') + '</button></div>';
          }).join('') + '</div>' + (D.past_specials ? '<p class="hint">' + PP.plural(D.past_specials, 'older special day') + ' not shown.</p>' : '');
        }
        function calendar() {
          var first = D.month + '-01', lead = PP.weekday(first);
          var cells = '';
          for (var i = 0; i < lead; i++) cells += '<span></span>';
          D.calendar.forEach(function (c) {
            var col = c.kind === 'special' ? SPECIAL : color(c.period_id);
            var closed = !c.hours.length;
            cells += '<button class="day' + (closed ? ' closed' : '') + (c.date === D.today ? ' today' : '') + (c.date < D.today ? ' past' : '') + '" data-action="day" data-date="' + c.date + '" style="--c:' + col + '" title="' +
              esc(PP.fmtDate(c.date) + ': ' + PP.hoursText(c.hours) + ' (' + c.label + ')') + '"><b>' + (+c.date.slice(8)) + '</b><span class="h">' +
              (closed ? 'Closed' : c.hours.map(function (p) { return short(p[0]) + '–' + short(p[1]); }).join('<br>')) + '</span></button>';
          });
          var m = PP.parseDate(first);
          return '<div class="card cal"><div class="hd"><button class="btn icon" data-action="month" data-n="-1" aria-label="Previous month">' + PP.icon('left') + '</button>' +
            '<h3>' + PP.MONTHS[m.getMonth()] + ' ' + m.getFullYear() + '</h3><button class="btn icon" data-action="month" data-n="1" aria-label="Next month">' + PP.icon('right') + '</button></div>' +
            '<div class="g">' + PP.DAYS3.map(function (d) { return '<span class="wd">' + d.slice(0, 2) + '</span>'; }).join('') + cells + '</div>' +
            '<div class="legend">' + D.periods.map(function (p) { return '<span style="--c:' + color(p.id) + '"><i></i>' + esc(p.name) + '</span>'; }).join('') +
              '<span style="--c:' + SPECIAL + '"><i></i>Special day</span></div>' +
            '<p class="hint">Click a day to give it special hours or close it.</p></div>';
        }
        function render() {
          root.innerHTML = '<div class="wrap pp-hours">' + PP.subnav(D.nav, 'hours') +
            '<div class="layout"><div>' +
              '<div class="row" style="margin-bottom:8px"><h2 style="margin:0">Regular hours</h2><span class="spacer"></span><button class="btn primary sm" data-action="new-period">' + PP.icon('plus') + 'Add a period</button></div>' +
              '<p class="intro">A period sets the hours for each weekday between two dates (or always). Where periods overlap, the <strong>shorter one wins</strong>: a “Summer 2026” period overrides “Regular hours” for those dates. Special days override both.</p>' +
              (D.periods.length ? D.periods.map(periodCard).join('') : '<div class="empty">No opening hours yet. Guests can\'t book until you add a period.</div>') +
              '<div class="section-title"><h2>Special days</h2><span class="spacer"></span><button class="btn sm" data-action="new-special">' + PP.icon('plus') + 'Add a special day</button></div>' +
              specials() +
            '</div><div class="cal-col">' + calendar() + '</div></div></div>';
        }

        function apply(res, d, okMsg) {
          if (res && res.ok === false) {
            var box = d && d.el.querySelector('[data-el=msg]');
            if (box) box.innerHTML = '<div class="feedback bad">' + esc(res.error) + '</div>'; else PP.toast(res.error, true);
            return false;
          }
          if (res) { D = res; render(); }
          if (d) d.close();
          if (okMsg) PP.toast(okMsg);
          return true;
        }
        function busy(d, on) { var b = d.el.querySelector('[type=submit]'); if (b) b.disabled = on; }

        // ---------- period editor
        function ivRow(p) {
          return '<div class="iv"><input type="time" value="' + esc(p[0]) + '" aria-label="Opens" required><span class="faint">to</span><input type="time" value="' + esc(p[1]) + '" aria-label="Closes" required>' +
            '<button type="button" class="btn ghost icon" data-rm aria-label="Remove these hours">' + PP.icon('x') + '</button></div>';
        }
        function dayRow(i, iv) {
          return '<div class="dayrow" data-day="' + i + '"><label class="check"><input type="checkbox" data-open' + (iv.length ? ' checked' : '') + '><span>' + PP.DAYS[i] + '</span></label>' +
            '<div class="ivs">' + (iv.length ? iv.map(ivRow).join('') : '<div class="closed-note">Closed</div>') +
            '<div' + (iv.length ? '' : ' hidden') + '><button type="button" class="btn ghost sm" data-add>' + PP.icon('plus') + 'Add hours (split shift)</button></div></div></div>';
        }
        function periodEditor(p) {
          var isNew = !p;
          p = p || { name: D.periods.length ? '' : 'Regular hours', start: null, end: null, week: D.periods[0] ? JSON.parse(JSON.stringify(D.periods[0].week)) : {} };
          var d = PP.modal('<div class="pp-pe"><div class="eyebrow">' + (isNew ? 'New period' : 'Edit period') + '</div><h2>' + (isNew ? 'Add opening hours' : esc(p.name)) + '</h2>' +
            '<form><div class="stack"><div><label class="f">Name</label><input type="text" name="name" required maxlength="60" placeholder="e.g. Summer 2026" value="' + esc(p.name) + '"></div>' +
            '<div class="grid2"><div><label class="f">From</label><input type="date" name="start" value="' + esc(p.start || '') + '"></div><div><label class="f">Until</label><input type="date" name="end" value="' + esc(p.end || '') + '"></div></div>' +
            '<div class="hint" style="margin-top:-6px">Leave both empty for hours that always apply.</div>' +
            '<div><div class="row" style="margin-bottom:4px"><label class="f" style="margin:0">Weekly hours</label><span class="spacer"></span><button type="button" class="btn ghost sm" data-copy-mon>Copy Monday to every day</button></div>' +
            '<div class="days">' + [0, 1, 2, 3, 4, 5, 6].map(function (i) { return dayRow(i, p.week[String(i)] || []); }).join('') + '</div>' +
            '<div class="hint">A closing time of 00:00 means midnight.</div></div><div data-el="msg"></div></div>' +
            '<div class="foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save hours</button></div></form></div>', { wide: true });
          var f = d.el.querySelector('form');
          function rowIvs(row) {
            return Array.prototype.map.call(row.querySelectorAll('.iv'), function (iv) { var t = iv.querySelectorAll('input'); return [t[0].value, t[1].value]; });
          }
          function redraw(row, iv) { row.outerHTML = dayRow(+row.dataset.day, iv); }
          d.el.addEventListener('click', function (e) {
            var row = e.target.closest('.dayrow');
            if (e.target.closest('[data-add]') && row) {
              var cur = rowIvs(row), last = cur[cur.length - 1];
              cur.push(last ? [last[1] < '22:00' ? '18:00' : last[1], '22:00'] : ['12:00', '22:00']);
              redraw(row, cur);
            } else if (e.target.closest('[data-rm]') && row) {
              e.target.closest('.iv').remove();
              if (!row.querySelector('.iv')) redraw(row, []);
            } else if (e.target.closest('[data-copy-mon]')) {
              var mon = rowIvs(d.el.querySelector('.dayrow[data-day="0"]'));
              d.el.querySelectorAll('.dayrow').forEach(function (r) { if (r.dataset.day !== '0') redraw(r, mon.slice()); });
            }
          });
          d.el.addEventListener('change', function (e) {
            if (!e.target.matches('[data-open]')) return;
            var row = e.target.closest('.dayrow');
            redraw(row, e.target.checked ? [['12:00', '22:00']] : []);
          });
          f.onsubmit = function (e) {
            e.preventDefault();
            var week = {};
            d.el.querySelectorAll('.dayrow').forEach(function (r) { week[r.dataset.day] = rowIvs(r); });
            var bad = Object.keys(week).some(function (k) { return week[k].some(function (iv) { return iv[1] !== '00:00' && iv[1] <= iv[0]; }); });
            if (bad) { d.el.querySelector('[data-el=msg]').innerHTML = '<div class="feedback bad">Each closing time must be after its opening time.</div>'; return; }
            busy(d, true);
            emit('save_period', { id: isNew ? null : p.id, name: f.name.value, start: f.start.value || null, end: f.end.value || null, week: week })
              .then(function (res) { busy(d, false); apply(res, d, 'Hours saved'); }, function (err) { busy(d, false); PP.toast(PP.err(err), true); });
          };
        }

        // ---------- special day editor
        function specialEditor(s, date) {
          var isNew = !s;
          s = s || { date: date || D.today, label: '', closed: true, hours: [['12:00', '22:00']] };
          var hours = s.hours && s.hours.length ? s.hours : [['12:00', '22:00']];
          var d = PP.modal('<div class="pp-pe"><div class="eyebrow">' + (isNew ? 'Special day' : 'Edit special day') + '</div><h2>' + esc(PP.fmtDate(s.date)) + '</h2>' +
            '<form><div class="stack"><div class="grid2"><div><label class="f">Date</label><input type="date" name="date" required value="' + esc(s.date) + '"></div>' +
              (isNew ? '<div><label class="f">Until <span class="faint">(optional)</span></label><input type="date" name="to"></div>' : '<div></div>') + '</div>' +
            '<div><label class="f">Label</label><input type="text" name="label" maxlength="60" placeholder="e.g. Christmas, Private event" value="' + esc(s.label) + '"></div>' +
            '<div class="seg" role="radiogroup"><button type="button" data-mode="closed" class="' + (s.closed ? 'on' : '') + '">Closed</button><button type="button" data-mode="open" class="' + (s.closed ? '' : 'on') + '">Special hours</button></div>' +
            '<div data-el="ivs" class="ivs"' + (s.closed ? ' hidden' : '') + ' style="display:grid;gap:6px">' + hours.map(ivRow).join('') +
              '<div><button type="button" class="btn ghost sm" data-add>' + PP.icon('plus') + 'Add hours</button></div></div>' +
            '<div data-el="msg"></div></div><div class="foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div></form></div>');
          var f = d.el.querySelector('form'), closed = !!s.closed, box = d.el.querySelector('[data-el=ivs]');
          d.el.addEventListener('click', function (e) {
            var m = e.target.closest('[data-mode]');
            if (m) { closed = m.dataset.mode === 'closed'; d.el.querySelectorAll('[data-mode]').forEach(function (b) { b.classList.toggle('on', b === m); }); box.hidden = closed; }
            if (e.target.closest('[data-add]')) { var wrap = document.createElement('div'); wrap.innerHTML = ivRow(['18:00', '22:00']); box.insertBefore(wrap.firstChild, box.lastElementChild); }
            if (e.target.closest('[data-rm]') && box.querySelectorAll('.iv').length > 1) e.target.closest('.iv').remove();
          });
          f.onsubmit = function (e) {
            e.preventDefault();
            var iv = Array.prototype.map.call(box.querySelectorAll('.iv'), function (x) { var t = x.querySelectorAll('input'); return [t[0].value, t[1].value]; });
            busy(d, true);
            emit('save_special', { id: isNew ? null : s.id, date: f.date.value, to: f.to ? f.to.value || null : null, label: f.label.value, closed: closed, hours: iv })
              .then(function (res) { busy(d, false); apply(res, d, 'Special day saved'); }, function (err) { busy(d, false); PP.toast(PP.err(err), true); });
          };
        }

        root.addEventListener('click', function (e) {
          if (PP.subnavClick(e, D.nav, emit)) return;
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var a = el.dataset.action, host = el.closest('[data-id]'), id = host && host.dataset.id;
          if (a === 'new-period') periodEditor(null);
          else if (a === 'edit-period') periodEditor(D.periods.filter(function (p) { return p.id === id; })[0]);
          else if (a === 'del-period') {
            var p = D.periods.filter(function (x) { return x.id === id; })[0];
            PP.confirm('Delete “' + p.name + '”?', 'Dates it covered fall back to your other periods, or are closed if none apply.', 'Delete period', true)
              .then(function (yes) { if (yes) emit('delete_period', { id: id }).then(function (res) { apply(res, null, 'Period deleted'); }); });
          } else if (a === 'new-special') specialEditor(null);
          else if (a === 'edit-special') specialEditor(D.specials.filter(function (s) { return s.id === id; })[0]);
          else if (a === 'del-special') emit('delete_special', { id: id }).then(function (res) { apply(res, null, 'Special day removed'); });
          else if (a === 'month') {
            var m = PP.parseDate(D.month + '-01'); m.setMonth(m.getMonth() + +el.dataset.n);
            emit('month', { month: PP.isoDate(m).slice(0, 7) }).then(function (res) { apply(res); });
          } else if (a === 'day') {
            var hit = D.specials.filter(function (s) { return s.date === el.dataset.date; })[0];
            specialEditor(hit || null, el.dataset.date);
          }
        });
        root.addEventListener('change', function (e) { PP.subnavChange(e, 'hours', emit); });
        render();
        return {};
      });
    })();
    </script>

    <!-- ===== TablesPage component ===== -->
    <style>
    .pp-tables .when { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-bottom: 14px; }
    .pp-tables .when .lbl { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--pp-muted); }
    .pp-tables .hours { display: flex; gap: 4px; overflow-x: auto; padding: 2px; scrollbar-width: thin; }
    .pp-tables .hours .chip { min-width: 52px; padding: 6px 8px; }
    .pp-tables .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
    .pp-tables .floor { position: relative; aspect-ratio: 16 / 10; min-height: 360px; background-color: var(--pp-panel); background-image: radial-gradient(circle, var(--pp-line) 1px, transparent 1.2px); background-size: 22px 22px; border: 1px solid var(--pp-line); border-radius: var(--pp-radius); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    .pp-tables .floor svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .pp-tables .floor svg.links line { stroke: var(--pp-brass); stroke-width: 3; stroke-dasharray: 2 5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .pp-tables .tb { position: absolute; transform: translate(-50%, -50%) scale(var(--s, 1)); display: grid; place-items: center; cursor: grab; touch-action: none; }
    .pp-tables .tb.dragging { cursor: grabbing; z-index: 5; }
    .pp-tables .tb .top { position: relative; z-index: 1; display: grid; place-items: center; background: var(--pp-panel-2); border: 1.5px solid var(--pp-ink); color: var(--pp-ink); text-align: center; line-height: 1.1; transition: background .15s, box-shadow .15s; }
    .pp-tables .tb .top b { font: 600 .82rem var(--pp-sans); display: block; }
    .pp-tables .tb .top span { font-size: .68rem; color: var(--pp-muted); }
    .pp-tables .tb.round .top { border-radius: 50%; }
    .pp-tables .tb.square .top, .pp-tables .tb.long .top { border-radius: 8px; }
    .pp-tables .tb .chair { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--pp-line); border: 1px solid var(--pp-faint); transform: translate(-50%, -50%); }
    .pp-tables .tb.sel .top { box-shadow: 0 0 0 4px color-mix(in srgb, var(--pp-brass) 40%, transparent); border-color: var(--pp-brass); }
    .pp-tables .tb.joined .top { background: var(--pp-brass-soft); border-color: var(--pp-brass); }
    .pp-tables .tb.off { opacity: .4; } .pp-tables .tb.off .top { border-style: dashed; }
    .pp-tables .tb .jtag { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); z-index: 2; font-size: .62rem; background: var(--pp-brass); color: #fff; padding: 1px 6px; border-radius: 99px; white-space: nowrap; letter-spacing: .04em; }
    .pp-tables .floor .hint-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--pp-muted); }
    .pp-tables .side { padding: 20px; }
    .pp-tables .side h3 { margin-bottom: 4px; }
    .pp-tables .side .stack > * + * { margin-top: 12px; }
    .pp-tables .summary { font-size: .86rem; color: var(--pp-muted); margin-bottom: 10px; }
    .pp-tables .summary b { color: var(--pp-ink); }
    .pp-tables .jc { padding: 16px 18px; margin-bottom: 10px; }
    .pp-tables .jc .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .pp-tables .jc .chips .chip { min-width: 44px; padding: 5px 6px; font-size: .76rem; }
    .pp-tables .jc .days .chip { min-width: 40px; }
    .pp-tables .mini-label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--pp-muted); margin: 10px 0 6px; }
    @media (max-width: 900px) { .pp-tables .layout { grid-template-columns: minmax(0, 1fr); } .pp-tables .floor { min-height: 0; aspect-ratio: 1 / 1; } }
    .pp-tables .when > div { min-width: 0; max-width: 100%; }
    .pp-tables .when .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    @media (max-width: 520px) { .pp-tables .when { flex-direction: column; align-items: stretch; } .pp-tables .when .seg button { padding: 6px 9px; } }
    </style>
    <script>
    (function () {
      var PP = window.PP;
      PP.define('tables', function (root, data, emit) {
        var esc = PP.esc, D = data;
        var S = { day: D.today_weekday, hour: null, mode: 'arrange', sel: null, picks: [] };
        S.hour = D.open_hours.indexOf(D.now_hour) >= 0 ? D.now_hour : (D.open_hours.indexOf(19) >= 0 ? 19 : D.open_hours[0]);

        function tableById(id) { return D.tables.filter(function (t) { return t.id === id; })[0]; }
        function activeJoins() {
          var used = {}, out = [];
          D.joins.forEach(function (j) {
            var live = j.tables.filter(function (id) { var t = tableById(id); return t && t.active; });
            if (live.length < 2 || j.hours.indexOf(S.hour) < 0 || (j.days.length && j.days.indexOf(S.day) < 0)) return;
            if (live.some(function (id) { return used[id]; })) return;
            live.forEach(function (id) { used[id] = j; });
            out.push(j);
          });
          return { list: out, of: used };
        }
        function size(t) {
          if (t.shape === 'round') { var d = 44 + t.seats * 5; return [d, d]; }
          if (t.shape === 'long') return [60 + t.seats * 11, 48];
          var s = 44 + t.seats * 4; return [s, s];
        }
        function chairs(t, w, h) {
          var out = '', n = t.seats, i;
          if (t.shape === 'round') {
            for (i = 0; i < n; i++) {
              var a = (i / n) * Math.PI * 2 - Math.PI / 2, r = w / 2 + 9;
              out += '<span class="chair" style="left:' + (w / 2 + 9 + Math.cos(a) * r) + 'px;top:' + (h / 2 + 9 + Math.sin(a) * r) + 'px"></span>';
            }
            return out;
          }
          var top = Math.ceil(n / 2), bot = n - top;
          if (t.shape === 'square' && n <= 2) { top = 1; bot = n - 1; }
          for (i = 0; i < top; i++) out += '<span class="chair" style="left:' + (9 + w * (i + 1) / (top + 1)) + 'px;top:2px"></span>';
          for (i = 0; i < bot; i++) out += '<span class="chair" style="left:' + (9 + w * (i + 1) / (bot + 1)) + 'px;top:' + (h + 16) + 'px"></span>';
          return out;
        }
        function floor() {
          var aj = activeJoins();
          var lines = aj.list.map(function (j) {
            var ts = j.tables.map(tableById).filter(Boolean), seg = '';
            for (var i = 1; i < ts.length; i++) seg += '<line x1="' + ts[i - 1].x + '%" y1="' + ts[i - 1].y + '%" x2="' + ts[i].x + '%" y2="' + ts[i].y + '%"/>';
            return seg;
          }).join('');
          var shown = {};
          return '<div class="floor" data-el="floor"><svg class="links">' + lines + '</svg>' +
            (D.tables.length ? '' : '<div class="hint-empty">Add your first table to start the floor plan.</div>') +
            D.tables.map(function (t) {
              var sz = size(t), j = aj.of[t.id];
              var cls = 'tb ' + t.shape + (j ? ' joined' : '') + (t.active ? '' : ' off') + ((S.mode === 'arrange' ? S.sel === t.id : S.picks.indexOf(t.id) >= 0) ? ' sel' : '');
              var tag = '';
              if (j && !shown[j.id]) { shown[j.id] = 1; tag = '<span class="jtag">Joined · ' + j.seats + '</span>'; }
              return '<div class="' + cls + '" data-t="' + esc(t.id) + '" tabindex="0" role="button" aria-label="' + esc(t.name + ', ' + t.seats + ' seats' + (j ? ', joined' : '')) + '" style="left:' + t.x + '%;top:' + t.y + '%;width:' + (sz[0] + 18) + 'px;height:' + (sz[1] + 18) + 'px">' +
                chairs(t, sz[0], sz[1]) + tag + '<div class="top" style="width:' + sz[0] + 'px;height:' + sz[1] + 'px"><div><b>' + esc(t.name) + '</b><span>' + t.seats + '</span></div></div></div>';
            }).join('') + '</div>';
        }
        function hourChips(hours, on, attr) {
          return hours.map(function (h) { return '<button class="chip' + (on.indexOf(h) >= 0 ? ' on' : '') + '" ' + attr + '="' + h + '">' + String(h).padStart(2, '0') + ':00</button>'; }).join('');
        }
        function dayChips(on, attr) {
          return PP.DAYS3.map(function (d, i) { return '<button class="chip' + (!on.length || on.indexOf(i) >= 0 ? ' on' : '') + '" ' + attr + '="' + i + '">' + d + '</button>'; }).join('');
        }
        function side() {
          if (S.mode === 'join') {
            var picks = S.picks.map(tableById).filter(Boolean);
            var seats = picks.reduce(function (n, t) { return n + t.seats; }, 0);
            return '<div class="card side fade-in"><div class="eyebrow">Join tables</div><h3>' + (picks.length ? esc(picks.map(function (t) { return t.name; }).join(' + ')) : 'Pick tables') + '</h3>' +
              '<p class="small muted">Click two or more tables on the plan. Joined tables are booked as one table during the hours you choose.</p>' +
              (picks.length >= 2 ? '<form data-el="joinform"><div class="stack"><div><label class="f">Seats when joined</label><input type="number" name="seats" min="1" max="200" value="' + seats + '"><div class="hint">Pushing tables together can lose or add a seat or two.</div></div>' +
                '<div><div class="mini-label">Hours</div><div class="chips" data-el="jh">' + hourChips(D.open_hours, D.open_hours, 'data-jh') + '</div></div>' +
                '<div><div class="mini-label">Days</div><div class="chips" data-el="jd">' + dayChips([], 'data-jd') + '</div></div>' +
                '<div data-el="msg"></div><button class="btn primary block" type="submit">' + PP.icon('join') + 'Join tables</button></div></form>' : '') +
              '<button class="btn ghost block" data-action="mode" data-m="arrange" style="margin-top:10px">Done</button></div>';
          }
          var t = S.sel && tableById(S.sel);
          if (!t) {
            var aj = activeJoins();
            var units = D.tables.filter(function (x) { return x.active && !aj.of[x.id]; }).length + aj.list.length;
            return '<div class="card side"><div class="eyebrow">Floor plan</div><h3>' + PP.plural(D.tables.length, 'table') + ' · ' + D.seats + ' seats</h3>' +
              '<p class="small muted">Drag tables to arrange the room. Click one to edit it. On ' + PP.DAYS[S.day] + ' at ' + String(S.hour).padStart(2, '0') + ':00 guests can book <b>' + units + '</b> separate tables.</p>' +
              '<div class="stack"><button class="btn primary block" data-action="add">' + PP.icon('plus') + 'Add a table</button>' +
              '<button class="btn block" data-action="mode" data-m="join"' + (D.tables.length < 2 ? ' disabled' : '') + '>' + PP.icon('join') + 'Join tables</button></div></div>';
          }
          var j = activeJoins().of[t.id];
          return '<div class="card side fade-in"><div class="row" style="margin-bottom:6px"><div class="eyebrow" style="margin:0">Table</div><span class="spacer"></span><button type="button" class="btn ghost icon" data-action="deselect" aria-label="Close">' + PP.icon('x') + '</button></div><form data-el="tform"><div class="stack">' +
            '<div class="grid2"><div><label class="f">Name</label><input type="text" name="name" maxlength="20" required value="' + esc(t.name) + '"></div>' +
              '<div><label class="f">Seats</label><input type="number" name="seats" min="1" max="60" required value="' + t.seats + '"></div></div>' +
            '<div class="grid2"><div><label class="f">Shape</label><select name="shape">' + [['square', 'Square'], ['round', 'Round'], ['long', 'Long']].map(function (s) {
                return '<option value="' + s[0] + '"' + (t.shape === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select></div>' +
              '<div><label class="f">Smallest party</label><input type="number" name="min_party" min="1" max="60" value="' + t.min_party + '"></div></div>' +
            '<div><label class="f">Area</label><input type="text" name="area" maxlength="40" placeholder="e.g. Terrace" value="' + esc(t.area) + '"></div>' +
            '<label class="check"><input type="checkbox" name="active"' + (t.active ? ' checked' : '') + '><span>Available for bookings</span></label>' +
            (j ? '<div class="feedback info" style="margin:0">Joined with ' + esc(j.tables.filter(function (i) { return i !== t.id; }).map(function (i) { var x = tableById(i); return x ? x.name : ''; }).join(', ')) +
              ' on ' + PP.DAYS[S.day] + ' at ' + String(S.hour).padStart(2, '0') + ':00.<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-action="split-hour" data-j="' + esc(j.id) + '">' + PP.icon('split') + 'Split at this hour</button>' +
              '<button type="button" class="btn sm ghost" data-action="split-all" data-j="' + esc(j.id) + '">Split all day</button></div></div>' : '') +
            '<div data-el="msg"></div><div class="row"><button class="btn primary" type="submit">Save</button><button type="button" class="btn ghost" data-action="join-from">' + PP.icon('join') + 'Join with…</button><span class="spacer"></span>' +
            '<button type="button" class="btn ghost icon danger" data-action="delete" aria-label="Delete table">' + PP.icon('trash') + '</button></div></div></form></div>';
        }
        function joinsList() {
          if (!D.joins.length) return '<div class="empty" style="padding:26px">No joined tables. Use <b>Join tables</b> to push tables together at busy times, or to keep a large table split into smaller ones at quiet times.</div>';
          return D.joins.map(function (j) {
            var names = j.tables.map(function (i) { var t = tableById(i); return t ? t.name : '?'; }).join(' + ');
            var hours = D.open_hours.slice();
            j.hours.forEach(function (h) { if (hours.indexOf(h) < 0) hours.push(h); });
            hours.sort(function (a, b) { return a - b; });
            return '<div class="card jc" data-j="' + esc(j.id) + '"><div class="hd"><h3 style="margin:0">' + esc(j.label || names) + '</h3><span class="badge plain">' + j.seats + ' seats</span><span class="spacer"></span>' +
              '<button class="btn ghost sm danger" data-action="del-join">' + PP.icon('split') + 'Split for good</button></div>' +
              '<div class="mini-label">Joined at these hours (click to split or join an hour)</div><div class="chips">' + hourChips(hours, j.hours, 'data-toggle-h') + '</div>' +
              '<div class="mini-label">On these days</div><div class="chips days">' + dayChips(j.days, 'data-toggle-d') + '</div></div>';
          }).join('');
        }
        function render() {
          var keepScroll = root.querySelector('.hours') ? root.querySelector('.hours').scrollLeft : null;
          root.innerHTML = '<div class="wrap pp-tables">' + PP.subnav(D.nav, 'tables') +
            '<div class="when"><div><div class="lbl">Layout on</div><div class="seg" style="margin-top:6px">' + PP.DAYS3.map(function (d, i) {
                return '<button data-action="day" data-d="' + i + '" class="' + (S.day === i ? 'on' : '') + '">' + d + '</button>'; }).join('') + '</div></div>' +
              '<div style="min-width:0;flex:1"><div class="lbl">At</div><div class="hours" style="margin-top:6px">' + hourChips(D.open_hours, [S.hour], 'data-hour') + '</div></div></div>' +
            '<div class="layout"><div>' + floor() + '</div><div>' + side() + '</div></div>' +
            '<div class="section-title"><h2>Joined tables</h2><span class="muted small">Tables pushed together are booked as one</span></div>' + joinsList() + '</div>';
          if (keepScroll != null) root.querySelector('.hours').scrollLeft = keepScroll;
          scale();
          var tf = root.querySelector('[data-el=tform]'); if (tf) tf.onsubmit = saveTable;
          var jf = root.querySelector('[data-el=joinform]'); if (jf) jf.onsubmit = createJoin;
        }

        // Table sizes are in pixels at a 760px-wide floor; smaller floors (phones) shrink them to match.
        function scale() {
          var fl = root.querySelector('[data-el=floor]');
          if (fl) fl.style.setProperty('--s', Math.max(0.62, Math.min(1, fl.clientWidth / 760)).toFixed(3));
        }
        window.addEventListener('resize', scale);

        function apply(res, okMsg) {
          if (res && res.ok === false) { var box = root.querySelector('[data-el=msg]'); if (box) box.innerHTML = '<div class="feedback bad">' + esc(res.error) + '</div>'; else PP.toast(res.error, true); return false; }
          if (res) D = res;
          if (S.sel && !tableById(S.sel)) S.sel = null;
          render();
          if (okMsg) PP.toast(okMsg);
          return true;
        }
        function saveTable(e) {
          e.preventDefault();
          var f = e.target;
          emit('save_table', { id: S.sel, name: f.name.value, seats: f.seats.value, shape: f.shape.value, min_party: f.min_party.value, area: f.area.value, active: f.active.checked })
            .then(function (res) { apply(res, 'Table saved'); });
        }
        function createJoin(e) {
          e.preventDefault();
          var f = e.target;
          var hours = Array.prototype.map.call(f.querySelectorAll('[data-jh].on'), function (b) { return +b.dataset.jh; });
          var days = Array.prototype.map.call(f.querySelectorAll('[data-jd].on'), function (b) { return +b.dataset.jd; });
          emit('save_join', { tables: S.picks, seats: f.seats.value, hours: hours, days: days }).then(function (res) {
            if (apply(res, 'Tables joined')) { S.mode = 'arrange'; S.picks = []; render(); }
          });
        }
        function saveJoin(j, changes) { return emit('save_join', Object.assign({}, j, changes)).then(function (res) { apply(res); }); }

        // ---------- dragging
        var drag = null;
        root.addEventListener('pointerdown', function (e) {
          var el = e.target.closest('.tb');
          if (!el || e.button > 0) return;
          var fl = root.querySelector('[data-el=floor]').getBoundingClientRect();
          drag = { el: el, id: el.dataset.t, x0: e.clientX, y0: e.clientY, fl: fl, moved: false };
          el.setPointerCapture(e.pointerId);
        });
        root.addEventListener('pointermove', function (e) {
          if (!drag) return;
          if (!drag.moved && Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 4) return;
          drag.moved = true;
          drag.el.classList.add('dragging');
          var x = Math.max(3, Math.min(97, (e.clientX - drag.fl.left) / drag.fl.width * 100));
          var y = Math.max(5, Math.min(95, (e.clientY - drag.fl.top) / drag.fl.height * 100));
          drag.x = Math.round(x * 2) / 2; drag.y = Math.round(y * 2) / 2;
          drag.el.style.left = drag.x + '%'; drag.el.style.top = drag.y + '%';
        });
        function endDrag() {
          if (!drag) return;
          var d = drag; drag = null;
          d.el.classList.remove('dragging');
          if (!d.moved) { pick(d.id); return; }
          var t = tableById(d.id); t.x = d.x; t.y = d.y;
          render();
          emit('save_positions', { positions: [{ id: d.id, x: d.x, y: d.y }] });
        }
        root.addEventListener('pointerup', endDrag);
        root.addEventListener('pointercancel', function () { if (drag) { drag.el.classList.remove('dragging'); drag = null; render(); } });
        function pick(id) {
          if (S.mode === 'join') {
            var i = S.picks.indexOf(id);
            if (i >= 0) S.picks.splice(i, 1); else S.picks.push(id);
          } else S.sel = S.sel === id ? null : id;
          render();
        }
        root.addEventListener('keydown', function (e) {
          var el = e.target.closest && e.target.closest('.tb');
          if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(el.dataset.t); }
        });

        root.addEventListener('click', function (e) {
          if (PP.subnavClick(e, D.nav, emit)) return;
          var b;
          if ((b = e.target.closest('[data-hour]'))) { S.hour = +b.dataset.hour; render(); return; }
          if ((b = e.target.closest('[data-jh], [data-jd]'))) { e.preventDefault(); b.classList.toggle('on'); return; }
          if ((b = e.target.closest('[data-toggle-h]'))) {
            var j = D.joins.filter(function (x) { return x.id === b.closest('[data-j]').dataset.j; })[0], h = +b.dataset.toggleH;
            var hours = j.hours.indexOf(h) >= 0 ? j.hours.filter(function (x) { return x !== h; }) : j.hours.concat([h]);
            if (!hours.length) { PP.confirm('Split these tables all day?', 'With no hours left, the join is removed and the tables are booked separately.', 'Split them', true).then(function (y) { if (y) saveJoin(j, { hours: [] }); }); return; }
            saveJoin(j, { hours: hours }); return;
          }
          if ((b = e.target.closest('[data-toggle-d]'))) {
            var jj = D.joins.filter(function (x) { return x.id === b.closest('[data-j]').dataset.j; })[0], d = +b.dataset.toggleD;
            var days = jj.days.length ? jj.days.slice() : [0, 1, 2, 3, 4, 5, 6];
            days = days.indexOf(d) >= 0 ? days.filter(function (x) { return x !== d; }) : days.concat([d]);
            if (!days.length) { PP.toast('Keep at least one day, or split the tables for good.', true); return; }
            saveJoin(jj, { days: days }); return;
          }
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var a = el.dataset.action;
          if (a === 'day') { S.day = +el.dataset.d; render(); }
          else if (a === 'mode') { S.mode = el.dataset.m; S.picks = []; S.sel = null; render(); }
          else if (a === 'deselect') { S.sel = null; render(); }
          else if (a === 'join-from') { S.mode = 'join'; S.picks = [S.sel]; S.sel = null; render(); }
          else if (a === 'add') emit('save_table', { name: '', seats: 4 }).then(function (res) { if (apply(res, 'Table added')) { S.sel = D.tables[D.tables.length - 1].id; render(); } });
          else if (a === 'delete') {
            var t = tableById(S.sel);
            PP.confirm('Delete ' + t.name + '?', 'It is removed from the floor plan and from any joins. Existing bookings keep their record.', 'Delete table', true)
              .then(function (y) { if (y) emit('delete_table', { id: t.id }).then(function (res) { S.sel = null; apply(res, 'Table deleted'); }); });
          } else if (a === 'split-hour' || a === 'split-all') {
            var jo = D.joins.filter(function (x) { return x.id === el.dataset.j; })[0];
            saveJoin(jo, { hours: a === 'split-all' ? [] : jo.hours.filter(function (x) { return x !== S.hour; }) });
          } else if (a === 'del-join') {
            var jd = el.closest('[data-j]').dataset.j;
            PP.confirm('Split these tables for good?', 'They will always be booked separately.', 'Split them', true).then(function (y) { if (y) emit('delete_join', { id: jd }).then(function (res) { apply(res, 'Tables split'); }); });
          }
        });
        root.addEventListener('change', function (e) { PP.subnavChange(e, 'tables', emit); });
        render();
        return {};
      });
    })();
    </script>

    <!-- ===== MenuEditPage component ===== -->
    <style>
    .pp-menued .intro { color: var(--pp-muted); font-size: .92rem; max-width: 68ch; margin-bottom: 22px; }
    .pp-menued .sec { margin-bottom: 18px; overflow: hidden; }
    .pp-menued .sec .hd { display: flex; align-items: center; gap: 8px; padding: 18px 20px 14px; border-bottom: 1px solid var(--pp-line); flex-wrap: wrap; }
    .pp-menued .sec .hd h3 { margin: 0; }
    .pp-menued .sec .hd .d { width: 100%; color: var(--pp-muted); font-size: .85rem; }
    .pp-menued .it { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 14px; align-items: center; padding: 13px 20px; border-bottom: 1px solid var(--pp-line); }
    .pp-menued .it:last-child { border-bottom: 0; }
    .pp-menued .it .n { font-weight: 500; }
    .pp-menued .it .n .badge { margin-left: 6px; }
    .pp-menued .it .ds { color: var(--pp-muted); font-size: .84rem; }
    .pp-menued .it .pr { font-family: var(--pp-serif); font-size: 1.15rem; white-space: nowrap; }
    .pp-menued .it.off .n, .pp-menued .it.off .pr { color: var(--pp-faint); text-decoration: line-through; }
    .pp-menued .it .acts { display: flex; gap: 2px; }
    .pp-menued .add-dish { padding: 10px 14px; }
    @media (max-width: 620px) { .pp-menued .it { grid-template-columns: minmax(0, 1fr) auto; } .pp-menued .it .acts { grid-column: 1 / -1; } }
    </style>
    <script>
    (function () {
      var PP = window.PP;
      PP.define('menuedit', function (root, data, emit) {
        var esc = PP.esc, D = data;

        function item(i, s, k, n) {
          return '<div class="it' + (i.available ? '' : ' off') + '" data-i="' + esc(i.id) + '" data-s="' + esc(s.id) + '"><div><div class="n">' + esc(i.name) +
              i.tags.map(function (t) { return '<span class="badge plain" title="' + esc(D.tags[t]) + '">' + esc(t) + '</span>'; }).join('') +
              (i.available ? '' : '<span class="badge cancelled">Sold out</span>') + '</div>' + (i.description ? '<div class="ds">' + esc(i.description) + '</div>' : '') + '</div>' +
            '<div class="pr">' + esc(i.price) + '</div>' +
            '<div class="acts"><button class="btn ghost sm" data-action="toggle">' + (i.available ? 'Mark sold out' : 'Back on') + '</button>' +
              '<button class="btn ghost icon" data-action="up" data-kind="item"' + (k ? '' : ' disabled') + ' aria-label="Move up">' + PP.icon('left', 'rot') + '</button>' +
              '<button class="btn ghost icon" data-action="down" data-kind="item"' + (k < n - 1 ? '' : ' disabled') + ' aria-label="Move down">' + PP.icon('right', 'rot') + '</button>' +
              '<button class="btn ghost icon" data-action="edit-item" aria-label="Edit">' + PP.icon('edit') + '</button></div></div>';
        }
        function section(s, k) {
          return '<div class="card sec fade-in" data-s="' + esc(s.id) + '"><div class="hd"><h3>' + esc(s.title) + '</h3><span class="spacer"></span>' +
              '<button class="btn ghost icon" data-action="up" data-kind="section"' + (k ? '' : ' disabled') + ' aria-label="Move section up">' + PP.icon('left', 'rot') + '</button>' +
              '<button class="btn ghost icon" data-action="down" data-kind="section"' + (k < D.sections.length - 1 ? '' : ' disabled') + ' aria-label="Move section down">' + PP.icon('right', 'rot') + '</button>' +
              '<button class="btn ghost icon" data-action="edit-section" aria-label="Edit section">' + PP.icon('edit') + '</button>' +
              '<button class="btn ghost icon" data-action="del-section" aria-label="Delete section">' + PP.icon('trash') + '</button>' +
              (s.description ? '<div class="d">' + esc(s.description) + '</div>' : '') + '</div>' +
            s.items.map(function (i, j) { return item(i, s, j, s.items.length); }).join('') +
            '<div class="add-dish"><button class="btn ghost sm" data-action="new-item">' + PP.icon('plus') + 'Add a dish</button></div></div>';
        }
        function render() {
          root.innerHTML = '<div class="wrap pp-menued">' + PP.subnav(D.nav, 'menu') +
            '<div class="row" style="margin-bottom:8px"><h2 style="margin:0">Menu</h2><span class="spacer"></span>' +
              '<a class="btn sm" target="_blank" rel="noopener" href="' + esc(PP.menuUrl(D.slug)) + '">' + PP.icon('ext') + 'View menu</a>' +
              '<button class="btn primary sm" data-action="new-section">' + PP.icon('plus') + 'Add a section</button></div>' +
            '<p class="intro">Guests see this menu at its own page, which the menu QR code opens (Settings &amp; sharing). Changes show there, and on your website, straight away, so the QR code never needs reprinting. Sold-out dishes are hidden from guests.</p>' +
            (D.sections.length ? D.sections.map(section).join('') : '<div class="empty"><h3>Start your menu</h3><p>Add a section such as Starters, then its dishes.</p><button class="btn primary" data-action="new-section">' + PP.icon('plus') + 'Add a section</button></div>') +
            '</div>';
        }
        function apply(res, d, msg) {
          if (res && res.ok === false) {
            var box = d && d.el.querySelector('[data-el=msg]');
            if (box) box.innerHTML = '<div class="feedback bad">' + esc(res.error) + '</div>'; else PP.toast(res.error, true);
            return;
          }
          if (res) { D = res; render(); }
          if (d) d.close();
          if (msg) PP.toast(msg);
        }
        function sectionEditor(s) {
          s = s || { title: '', description: '' };
          var d = PP.modal('<div class="eyebrow">' + (s.id ? 'Edit section' : 'New section') + '</div><h2>' + (s.id ? esc(s.title) : 'Add a section') + '</h2>' +
            '<form class="stack"><div><label class="f">Title</label><input type="text" name="title" maxlength="80" required placeholder="e.g. Starters" value="' + esc(s.title) + '"></div>' +
            '<div><label class="f">Note <span class="faint">(optional)</span></label><input type="text" name="description" maxlength="300" placeholder="e.g. Served until 22:00" value="' + esc(s.description) + '"></div>' +
            '<div data-el="msg"></div><div class="foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div></form>');
          d.el.querySelector('form').onsubmit = function (e) {
            e.preventDefault();
            emit('save_section', { id: s.id || null, title: e.target.title.value, description: e.target.description.value }).then(function (res) { apply(res, d, 'Section saved'); });
          };
        }
        function itemEditor(i, sid) {
          i = i || { name: '', description: '', price: '', tags: [], available: true };
          var d = PP.modal('<div class="eyebrow">' + (i.id ? 'Edit dish' : 'New dish') + '</div><h2>' + (i.id ? esc(i.name) : 'Add a dish') + '</h2>' +
            '<form class="stack"><div class="grid2" style="grid-template-columns:2fr 1fr"><div><label class="f">Name</label><input type="text" name="name" maxlength="120" required value="' + esc(i.name) + '"></div>' +
              '<div><label class="f">Price</label><input type="text" name="price" maxlength="30" placeholder="€18" value="' + esc(i.price) + '"></div></div>' +
            '<div><label class="f">Description <span class="faint">(optional)</span></label><textarea name="description" maxlength="500" style="min-height:70px">' + esc(i.description) + '</textarea></div>' +
            '<div><label class="f">Section</label><select name="section">' + D.sections.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === sid ? ' selected' : '') + '>' + esc(s.title) + '</option>'; }).join('') + '</select></div>' +
            '<div><label class="f">Labels</label><div class="chips">' + Object.keys(D.tags).map(function (t) {
              return '<button type="button" class="chip' + (i.tags.indexOf(t) >= 0 ? ' on' : '') + '" data-tag="' + t + '" title="' + esc(D.tags[t]) + '">' + esc(t) + ' · ' + esc(D.tags[t]) + '</button>'; }).join('') + '</div></div>' +
            '<label class="check"><input type="checkbox" name="available"' + (i.available ? ' checked' : '') + '><span>Available today</span></label>' +
            '<div data-el="msg"></div><div class="foot">' + (i.id ? '<button type="button" class="btn danger" data-del>Delete dish</button><span class="spacer"></span>' : '') +
              '<button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div></form>', { wide: true });
          d.el.addEventListener('click', function (e) { var t = e.target.closest('[data-tag]'); if (t) t.classList.toggle('on'); });
          var del = d.el.querySelector('[data-del]');
          if (del) del.onclick = function () { emit('delete_item', { id: i.id }).then(function (res) { apply(res, d, 'Dish deleted'); }); };
          d.el.querySelector('form').onsubmit = function (e) {
            e.preventDefault();
            var f = e.target;
            emit('save_item', { id: i.id || null, section_id: f.section.value, name: f.name.value, price: f.price.value, description: f.description.value,
              available: f.available.checked, tags: Array.prototype.map.call(d.el.querySelectorAll('[data-tag].on'), function (b) { return b.dataset.tag; }) })
              .then(function (res) { apply(res, d, 'Dish saved'); });
          };
        }
        function find(sid, iid) {
          var s = D.sections.filter(function (x) { return x.id === sid; })[0];
          return { s: s, i: s && iid ? s.items.filter(function (x) { return x.id === iid; })[0] : null };
        }
        root.addEventListener('click', function (e) {
          if (PP.subnavClick(e, D.nav, emit)) return;
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var a = el.dataset.action, sEl = el.closest('[data-s]'), iEl = el.closest('[data-i]');
          var f = find(sEl && sEl.dataset.s, iEl && iEl.dataset.i);
          if (a === 'new-section') sectionEditor(null);
          else if (a === 'edit-section') sectionEditor(f.s);
          else if (a === 'del-section') PP.confirm('Delete “' + f.s.title + '”?', 'Its ' + PP.plural(f.s.items.length, 'dish', 'dishes') + ' are deleted too.', 'Delete section', true)
            .then(function (y) { if (y) emit('delete_section', { id: f.s.id }).then(function (res) { apply(res, null, 'Section deleted'); }); });
          else if (a === 'new-item') itemEditor(null, f.s.id);
          else if (a === 'edit-item') itemEditor(f.i, f.s.id);
          else if (a === 'toggle') emit('save_item', Object.assign({}, f.i, { section_id: f.s.id, available: !f.i.available })).then(function (res) { apply(res, null, f.i.available ? 'Marked sold out' : 'Back on the menu'); });
          else if (a === 'up' || a === 'down') emit('move', { kind: el.dataset.kind, id: el.dataset.kind === 'section' ? f.s.id : f.i.id, step: a === 'up' ? -1 : 1 }).then(function (res) { apply(res); });
        });
        root.addEventListener('change', function (e) { PP.subnavChange(e, 'menu', emit); });
        render();
        return {};
      });
    })();
    </script>

    <!-- ===== SettingsPage component ===== -->
    <style>
