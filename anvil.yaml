    .pp-res .ap .acts { display: flex; gap: 6px; flex-wrap: wrap; }

    .pp-res .daybar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .pp-res .daybar h2 { margin: 0 6px; min-width: 0; }
