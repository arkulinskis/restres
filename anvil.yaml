    .pp-header .me { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--pp-ink); color: var(--pp-bg); font: 600 .8rem var(--pp-sans); }
    .pp-header .me:focus-visible { outline: 2px solid var(--pp-brass); outline-offset: 2px; }
    .pp-header .menu { position: absolute; right: 0; top: calc(100% + 10px); width: 300px; padding: 8px; z-index: 60; }
    .pp-header .menu.alerts { width: 360px; }
    .pp-header .menu .who { padding: 8px 10px 12px; border-bottom: 1px solid var(--pp-line); margin-bottom: 6px; }
    .pp-header .menu .item { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; padding: 9px 10px; border-radius: 8px; font-size: .9rem; }
    .pp-header .menu .item:hover { background: var(--pp-panel-2); }
    .pp-header .menu .item .sub { display: block; color: var(--pp-muted); font-size: .8rem; }
    .pp-header .menu .head { padding: 8px 10px; font-weight: 600; font-size: .9rem; }
    .pp-header .menu .none { padding: 8px 10px 12px; color: var(--pp-muted); font-size: .88rem; }
