metadata:
  description: 'Run bookings for all your restaurants: opening hours, a drag-and-drop floor plan, automatic approvals, menus,
    specials, events and a booking form for your website.'
  logo_img: asset:icon-512.png
  title: 'PlanPlate: restaurant reservations, floor plans and websites'
name: PlanPlate
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=d70e59cf18"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f3ee">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- seo:start (APP_MAKER/seo: edit seo/apps/restres.json and run seo.py, not here) -->
    <link rel="canonical" href="https://planplate-test.anvil.app/">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="restaurant reservation system, online table booking, restaurant booking widget, restaurant floor plan software, table management, restaurant website builder, multi-location restaurant software, restaurant menu QR code, waitlist and approvals">
