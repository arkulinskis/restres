      };
      PP.LANGS.fr = {
        reserve: 'Réserver une table', guests: 'Personnes', date: 'Date', time: 'Heure', details: 'Vos coordonnées',
        guest: 'personne', guestsN: 'personnes', more: 'Plus…', pickDate: 'Choisissez une date pour voir les horaires.',
        loading: 'Recherche de tables…', noTimes: 'Plus de table pour {n} ce jour-là. Essayez une autre date.',
        walkIn: 'Sans réservation', walkNote: 'Nous sommes presque complets à certains horaires : venez sans réserver.',
        reviewNote: 'Le restaurant confirme personnellement les demandes à ces horaires.', closedDay: 'Fermé ce jour-là.',
        name: 'Nom complet', email: 'E-mail', phone: 'Téléphone', notes: 'Demandes particulières', notesPh: 'Allergies, occasion spéciale, chaise haute…', optional: 'facultatif',
        change: 'Modifier', consent: 'J\'ai lu la {link} et j\'accepte que {r} utilise mes coordonnées pour gérer cette réservation.',
        privacyLink: 'politique de confidentialité', submit: 'Réserver', submitReview: 'Envoyer la demande', back: 'Retour',
        doneTitle: 'Votre table est réservée', doneWait: 'Demande reçue', doneText: 'Au plaisir de vous accueillir. Gardez ce lien pour modifier ou annuler votre réservation :',
        waitText: 'Le restaurant confirmera votre demande sous peu. Ce lien vous permet de la suivre, la modifier ou l\'annuler :',
