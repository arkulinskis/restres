    .pp-header nav { display: flex; gap: 2px; }
    .pp-header nav button { all: unset; cursor: pointer; color: var(--pp-muted); padding: 7px 12px; border-radius: 99px; font-size: .9rem; }
    .pp-header nav button.on, .pp-header nav button:hover { color: var(--pp-ink); background: var(--pp-panel-2); }
    .pp-header .right { margin-left: auto; display: flex; align-items: center; gap: 6px; position: relative; }
