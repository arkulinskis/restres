    .pp-res .daymeta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--pp-muted); font-size: .86rem; margin-bottom: 18px; }
    .pp-res .daymeta span { display: inline-flex; gap: 6px; align-items: center; }
