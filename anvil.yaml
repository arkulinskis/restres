    .pp-set .team .m { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--pp-line); flex-wrap: wrap; }
    .pp-set .team .m:first-child { border-top: 0; }
    .pp-set .team .m .who { flex: 1; min-width: 180px; }
    .pp-set .team .m .who span { display: block; color: var(--pp-muted); font-size: .82rem; }
    .pp-set .team .m select { width: auto; min-height: 34px; padding: 4px 28px 4px 10px; font-size: .85rem; border-radius: 99px; }
    .pp-set .team form { display: grid; grid-template-columns: minmax(0, 1fr) 140px auto; gap: 8px; margin-top: 16px; }
    .pp-set .langs-pick { display: flex; gap: 18px; flex-wrap: wrap; }
    @media (max-width: 620px) { .pp-set .qrs { grid-template-columns: 1fr; } .pp-set .team form { grid-template-columns: 1fr; } }
    .pp-set .danger-zone { border-color: color-mix(in srgb, var(--pp-bad) 35%, var(--pp-line)); }
    @media (max-width: 900px) { .pp-set .layout { grid-template-columns: 1fr; } .pp-set .toc { display: none; } .pp-set .layout > section { grid-column: auto; } .pp-set .rule { grid-template-columns: 1fr; } .pp-set section { padding: 20px 18px; } }
    </style>
    <script>
    (function () {
      var PP = window.PP;
      PP.define('settings', function (root, data, emit) {
        var esc = PP.esc, D = data, dirty = false;

        function field(name, label, type, opts) {
          opts = opts || {};
          var v = D.settings[name];
          return '<div><label class="f" for="st_' + name + '">' + label + '</label>' +
            (type === 'textarea' ? '<textarea id="st_' + name + '" name="' + name + '" maxlength="' + (opts.max || 4000) + '" placeholder="' + esc(opts.ph || '') + '" style="min-height:' + (opts.h || 90) + 'px">' + esc(v) + '</textarea>'
              : '<input id="st_' + name + '" type="' + type + '" name="' + name + '" value="' + esc(v) + '"' + (opts.max ? ' maxlength="' + opts.max + '"' : '') + (opts.req ? ' required' : '') + ' placeholder="' + esc(opts.ph || '') + '"' + (opts.list ? ' list="' + opts.list + '"' : '') + '>') +
            (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</div>';
        }
        function rule(name, title, desc, unit, min, max) {
          return '<div class="rule"><div><div class="t">' + title + '</div><div class="d">' + desc + '</div></div>' +
            '<div class="unit"><input type="number" name="' + name + '" min="' + min + '" max="' + max + '" value="' + D.settings[name] + '" aria-label="' + esc(title) + '"><span>' + unit + '</span></div></div>';
        }
        function codes() {
          var s = D.settings, link = PP.bookUrl(s.slug), origin = D.origin || PP.appUrl().replace(/\/$/, '');
          var iframe = '<iframe src="' + link + '" title="Reserve a table at ' + s.name + '" style="width:100%;max-width:560px;height:820px;border:0"></iframe>';
          var script = '<script src="' + origin + '/_/api/embed.js?r=' + s.slug + '"></' + 'script>';
          var custom = '<a href="#" data-planplate-open>Book a table</a>\n<script src="' + origin + '/_/api/embed.js?r=' + s.slug + '"></' + 'script>';
          function block(id, text) { return '<div class="code"><pre data-code="' + id + '">' + esc(text) + '</pre><button type="button" class="btn sm" data-copy="' + id + '">' + PP.icon('copy') + 'Copy</button></div>'; }
          return '<div class="share"><h3>Booking link</h3><p class="small muted">Share it anywhere: social media, Google Business Profile, email signatures.</p>' + block('link', link) +
            '<p style="margin-top:10px"><a class="btn sm" href="' + esc(link) + '" target="_blank" rel="noopener">' + PP.icon('ext') + 'Open the booking page</a></p>' +
            '<h3>“Reserve a table” button</h3><p class="small muted">Paste this where the button should appear on your website. It opens the booking form in a window over your page.</p>' + block('script', script) +
            '<h3>Use your own button or link</h3><p class="small muted">Give any element the attribute <code>data-planplate-open</code> and include the script once.</p>' + block('custom', custom) +
            '<h3>Embed the form in a page</h3>' + block('iframe', iframe) +
            '<h3>QR codes</h3><p class="small muted">For table cards, the window and the door. The menu code always opens your latest menu, so you never reprint it.</p>' +
            '<div class="qrs"><div class="qr">' + PP.qrSvg(link, 150) + '<strong>Book a table</strong><button type="button" class="btn sm" data-qr-png="' + esc(link) + '" data-kind="booking" data-caption="Reserve a table">' + PP.icon('download') + 'Download PNG</button></div>' +
              '<div class="qr">' + PP.qrSvg(PP.menuUrl(s.slug), 150) + '<strong>Menu</strong><button type="button" class="btn sm" data-qr-png="' + esc(PP.menuUrl(s.slug)) + '" data-kind="menu" data-caption="Menu">' + PP.icon('download') + 'Download PNG</button></div></div>' +
            '<h3>Live menu on your website</h3><p class="small muted">Put this where the menu should appear. It always shows the menu as it is in PlanPlate.</p>' +
              block('menu', '<div data-planplate-menu></div>\n<script src="' + origin + '/_/api/menu.js?r=' + s.slug + '"></' + 'script>') +
            '<h3>Live opening hours on your website</h3>' +
              block('hours', '<div data-planplate-hours></div>\n<script src="' + origin + '/_/api/hours.js?r=' + s.slug + '"></' + 'script>') +
            '<p class="small muted" style="margin-top:10px">Developers can read the same data as JSON: <code>' + esc(origin) + '/_/api/menu?r=' + esc(s.slug) + '</code> and <code>' + esc(origin) + '/_/api/hours?r=' + esc(s.slug) + '</code></p></div>';
        }
        var LANGS = { en: 'English', fr: 'Français', lv: 'Latviešu' };
        function teamHtml() {
          var owner = D.role === 'owner';
          return '<div>' + (D.team || []).map(function (m) {
            var roleCell = m.role === 'owner' ? '<span class="badge plain">Owner</span>'
              : owner ? '<select data-role="' + esc(m.id) + '" aria-label="Role"><option value="manager"' + (m.role === 'manager' ? ' selected' : '') + '>Manager</option><option value="staff"' + (m.role === 'staff' ? ' selected' : '') + '>Staff</option></select>'
              : '<span class="badge plain">' + esc(PP.ROLE[m.role] || m.role) + '</span>';
            return '<div class="m"><div class="who"><strong>' + esc(m.name || m.email) + '</strong>' + (m.name ? '<span>' + esc(m.email) + '</span>' : '') + '</div>' +
              (m.joined ? '' : '<span class="badge pending" title="They get access when they sign in with this email">Invited</span>') + roleCell +
              (owner && m.id ? '<button class="btn ghost icon" data-remove="' + esc(m.id) + '" aria-label="Remove ' + esc(m.email) + '">' + PP.icon('x') + '</button>' : '') + '</div>';
          }).join('') + '</div>' +
            (owner ? '<form data-el="invite"><input type="email" name="email" required placeholder="colleague@restaurant.com" aria-label="Email"><select name="role" aria-label="Role"><option value="staff">Staff</option><option value="manager">Manager</option></select>' +
              '<button class="btn primary" type="submit">' + PP.icon('plus') + 'Invite</button></form><p class="hint">They sign in, or create an account, with that email and the restaurant appears in their list. We email them an invitation.</p>' : '');
        }
        function render() {
          var s = D.settings, owner = D.role === 'owner';
          root.innerHTML = '<div class="wrap pp-set">' + PP.subnav(D.nav, 'settings') +
            '<div class="layout"><nav class="toc"><a href="#st-details">Details</a><a href="#st-rules">Booking rules</a><a href="#st-approval">Approvals</a><a href="#st-form">Booking form</a><a href="#st-emails">Emails</a><a href="#st-langs">Languages</a><a href="#st-share">Share &amp; embed</a><a href="#st-team">Team</a>' + (owner ? '<a href="#st-danger">Delete</a>' : '') + '</nav>' +
            '<form data-el="form" novalidate><section class="card" id="st-details"><h2>Details</h2><p class="lead">Shown to guests on the booking form and their reservation page.</p><div class="stack">' +
              field('name', 'Restaurant name', 'text', { max: 80, req: true }) +
              field('description', 'Short description', 'textarea', { max: 400, h: 60, ph: 'Seasonal French cooking in the heart of the old town.' }) +
              '<div class="grid2">' + field('address', 'Address', 'text', { max: 200 }) + field('phone', 'Phone', 'tel', { max: 40 }) + '</div>' +
              '<div class="grid2">' + field('email', 'Email', 'email', { max: 200 }) + field('website', 'Website', 'url', { max: 200, ph: 'https://' }) + '</div>' +
              '<div class="grid2">' + field('slug', 'Booking link', 'text', { max: 40, hint: esc(PP.appUrl()) + '#book/<b>' + esc(s.slug) + '</b>' }) +
                '<div><label class="f" for="st_timezone">Time zone</label>' + PP.tzField('timezone', s.timezone, 'st_timezone') +
                  '<div class="hint">All booking times are in this time zone. Search by country, city or GMT offset.</div></div></div>' +
            '</div></section>' +
            '<section class="card" id="st-rules"><h2>Booking rules</h2><p class="lead">How guests can book online. Staff bookings in the portal can go outside these.</p>' +
              '<label class="check" style="margin-bottom:8px"><input type="checkbox" name="accepting"' + (s.accepting ? ' checked' : '') + '><span><strong>Take bookings online</strong><br><span class="muted small">Turn off to pause the booking form. Guests are asked to call instead.</span></span></label>' +
              rule('duration_min', 'Table time', 'How long each booking holds its table. You can change it per booking.', 'min', 15, 600) +
              rule('slot_min', 'Time slots', 'Spacing of the times guests can pick.', 'min', 5, 120) +
              rule('last_booking_min', 'Last booking', 'How long before closing the last table can be booked.', 'min', 0, 600) +
              rule('lead_min', 'Minimum notice', 'How far ahead a guest must book.', 'min', 0, 10080) +
              rule('window_days', 'Booking window', 'How many days ahead guests can book.', 'days', 1, 730) +
              rule('max_party', 'Largest party online', 'Bigger groups are asked to contact you.', 'guests', 1, 100) +
            '</section>' +
            '<section class="card" id="st-approval"><h2>Approvals</h2><p class="lead">Bookings are confirmed straight away while there is room. Past these limits a manager decides.</p>' +
              rule('auto_threshold', 'Auto-confirm until', 'Once this share of seats is taken at a time, new bookings wait for approval. 100% confirms everything that fits; 0% sends every booking to you.', '% full', 0, 100) +
              rule('max_auto_party', 'Large parties', 'Parties bigger than this always wait for approval.', 'guests', 1, 100) +
              '<div class="rule"><div><div class="t">When the limit is reached</div><div class="d">Take requests for you to approve, or stop online booking at that time and invite guests to walk in.</div></div>' +
              '<select name="over_capacity"><option value="review"' + (s.over_capacity === 'review' ? ' selected' : '') + '>Ask me to approve</option><option value="walk_in"' + (s.over_capacity === 'walk_in' ? ' selected' : '') + '>Suggest walking in</option></select></div>' +
            '</section>' +
            '<section class="card" id="st-form"><h2>Booking form</h2><p class="lead">Texts on the form your guests fill in.</p><div class="stack">' +
              field('form_note', 'Note for guests', 'textarea', { max: 600, h: 70, ph: 'e.g. We hold tables for 15 minutes. For groups over 8, please call us.' }) +
              field('privacy_text', 'Privacy notice', 'textarea', { max: 4000, h: 140, ph: s.default_privacy, hint: 'Guests must tick a box confirming they have read this before they can book. Leave it empty to use the standard text shown above. The text each guest agreed to is saved with their booking.' }) +
            '</div></section>' +
            '<section class="card" id="st-emails"><h2>Emails</h2><p class="lead">Guests get an email when they book, when you approve or decline, and when a booking is cancelled. Each includes their private link.</p><div class="stack">' +
              '<label class="check"><input type="checkbox" name="emails_on"' + (s.emails_on ? ' checked' : '') + '><span><strong>Email guests</strong><br><span class="muted small">Turn off if you contact guests yourself.</span></span></label>' +
              field('notify_email', 'Send approval alerts to', 'email', { max: 200, ph: s.owner_email, hint: 'The moment a booking needs approval, an alert goes here. Leave empty to use the owner\'s address (' + esc(s.owner_email) + ').' }) +
              field('msg_confirmed', 'Added to confirmations', 'textarea', { max: 1000, h: 60, ph: 'e.g. Parking is free behind the building. We hold tables for 15 minutes.' }) +
              field('msg_pending', 'Added to “request received”', 'textarea', { max: 1000, h: 60, ph: 'e.g. We reply within the hour during opening times.' }) +
              field('msg_declined', 'Added to declines', 'textarea', { max: 1000, h: 60, ph: 'e.g. Our bar always keeps a few seats for walk-ins.' }) +
            '</div></section>' +
            '<section class="card" id="st-langs"><h2>Languages</h2><p class="lead">The booking form, guest page and emails come in these languages. Guests can switch between the ones you offer.</p><div class="stack">' +
              '<div><label class="f" for="st_language">Main language</label><select id="st_language" name="language" style="max-width:240px">' + Object.keys(LANGS).map(function (l) {
                return '<option value="' + l + '"' + (s.language === l ? ' selected' : '') + '>' + esc(LANGS[l]) + '</option>'; }).join('') + '</select></div>' +
              '<div><div class="f">Also offer</div><div class="langs-pick">' + Object.keys(LANGS).map(function (l) {
                return '<label class="check"><input type="checkbox" name="lang_' + l + '"' + (s.languages.indexOf(l) >= 0 ? ' checked' : '') + '><span>' + esc(LANGS[l]) + '</span></label>'; }).join('') + '</div></div>' +
            '</div></section>' +
            '<div class="savebar" data-el="savebar" hidden><span>You have unsaved changes</span><span class="spacer"></span><button type="button" class="btn ghost sm" data-action="revert">Discard</button><button class="btn primary sm" type="submit">Save changes</button></div>' +
            '</form>' +
            '<section class="card" id="st-share"><h2>Share &amp; embed</h2><p class="lead">Put the booking form on your website.</p>' + codes() + '</section>' +
            '<section class="card team" id="st-team"><h2>Team</h2><p class="lead">' + (owner ? 'Give managers and staff their own sign-in. <b>Managers</b> can change everything except the team; <b>staff</b> see and manage reservations only.' : 'Only the owner can change the team.') + '</p><div data-el="team">' + teamHtml() + '</div></section>' +
            (owner ? '<section class="card danger-zone" id="st-danger"><h2>Delete restaurant</h2><p class="lead">Removes the restaurant with its hours, tables, menu and every reservation. This can\'t be undone.</p>' +
              '<button class="btn danger" data-action="delete">' + PP.icon('trash') + 'Delete ' + esc(s.name) + '</button></section>' : '') +
            '</div></div>';
          wireTeam();
          var f = root.querySelector('[data-el=form]');
          f.onsubmit = save;
          f.addEventListener('input', markDirty);
          f.addEventListener('change', markDirty);
          dirty = false;
        }
        function teamReply(res) {
          if (res && res.ok) { D.team = res.team; root.querySelector('[data-el=team]').innerHTML = teamHtml(); wireTeam(); return true; }
          PP.toast((res && res.error) || 'Could not change the team.', true); return false;
        }
        function wireTeam() {
          var inv = root.querySelector('[data-el=invite]');
          if (inv) inv.onsubmit = function (e) {
            e.preventDefault();
            emit('invite', { email: inv.email.value, role: inv.role.value }).then(function (res) { if (teamReply(res)) PP.toast('Invitation sent'); });
          };
        }
        function markDirty(e) { if (e && e.target && e.target.matches('[data-pp-switch]')) return; dirty = true; root.querySelector('[data-el=savebar]').hidden = false; }
        function save(e) {
          e.preventDefault();
          var f = e.target, v = {};
          Array.prototype.forEach.call(f.elements, function (el) { if (el.name && el.name.indexOf('lang_') !== 0) v[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
          v.languages = Object.keys(LANGS).filter(function (l) { return f['lang_' + l].checked; });
          var b = f.querySelector('[type=submit]'); b.disabled = true;
          emit('save', v).then(function (res) {
            b.disabled = false;
            if (res && res.ok) { D.settings = res.settings; D.nav = res.nav; render(); PP.toast('Settings saved'); }
            else PP.toast((res && res.error) || 'Could not save.', true);
          }, function (err) { b.disabled = false; PP.toast(PP.err(err), true); });
        }
        function del() {
          var name = D.settings.name;
          var d = PP.modal('<h2>Delete ' + esc(name) + '?</h2><p class="muted">Every reservation, table and opening hour of this restaurant is deleted. Guests\' links stop working.</p>' +
            '<form><label class="f">Type <strong>' + esc(name) + '</strong> to confirm</label><input type="text" name="c" autocomplete="off"><div data-el="msg"></div>' +
            '<div class="foot"><button type="button" class="btn" data-close>Keep it</button><button class="btn danger" type="submit">Delete for good</button></div></form>');
          d.el.querySelector('form').onsubmit = function (e) {
            e.preventDefault();
            emit('delete', { confirm_name: e.target.c.value }).then(function (res) {
              if (res && res.ok) { d.close(); return; }
              d.el.querySelector('[data-el=msg]').innerHTML = '<div class="feedback bad">' + esc((res && res.error) || 'Could not delete it.') + '</div>';
            });
          };
        }
        root.addEventListener('click', function (e) {
          if (PP.subnavClick(e, D.nav, emit)) return;
          var rm = e.target.closest('[data-remove]');
          if (rm) { PP.confirm('Remove this person?', 'They lose access to this restaurant straight away.', 'Remove', true).then(function (y) { if (y) emit('remove_member', { id: rm.dataset.remove }).then(teamReply); }); return; }
          var qp = e.target.closest('[data-qr-png]');
          if (qp) { PP.qrPng(qp.dataset.qrPng, D.settings.slug + '-' + qp.dataset.kind + '-qr.png', qp.dataset.caption); return; }
          var toc = e.target.closest('.toc a');
          if (toc) { e.preventDefault(); var sec = root.querySelector(toc.getAttribute('href')); if (sec) sec.scrollIntoView({ behavior: 'smooth' }); return; }
          var c = e.target.closest('[data-copy]');
          if (c) { PP.copy(root.querySelector('[data-code=' + c.dataset.copy + ']').textContent, 'Code'); return; }
          var a = e.target.closest('[data-action]');
          if (!a) return;
          if (a.dataset.action === 'revert') render();
          else if (a.dataset.action === 'delete') del();
        });
        root.addEventListener('change', function (e) {
          if (PP.subnavChange(e, 'settings', emit)) return;
          var rs = e.target.closest('[data-role]');
          if (rs) { e.stopPropagation(); emit('set_role', { id: rs.dataset.role, role: rs.value }).then(function (res) { if (teamReply(res)) PP.toast('Role changed'); }); }
        });
        render();
        return { isDirty: function () { return dirty; } };
      });
    })();
    </script>

    <!-- ===== BookPage component ===== -->
    <style>
    .pp-book { min-height: 100vh; padding: 36px 16px 40px; }
    .pp-book .sheet { max-width: 560px; margin: 0 auto; }
    .pp-book .masthead { text-align: center; margin-bottom: 28px; }
    .pp-book .masthead .mark { width: 30px; height: 30px; color: var(--pp-brass); margin-bottom: 10px; }
    .pp-book .masthead h1 { font-size: 2.7rem; margin-bottom: 6px; }
    .pp-book .masthead p { color: var(--pp-muted); max-width: 44ch; margin: 0 auto; }
    .pp .langs { display: flex; justify-content: center; gap: 2px; margin-bottom: 18px; }
    .pp .langs button { all: unset; cursor: pointer; font-size: .72rem; letter-spacing: .14em; padding: 4px 9px; border-radius: 99px; color: var(--pp-faint); }
    .pp .langs button.on { color: var(--pp-ink); background: var(--pp-panel-2); }
    .pp .langs button:hover { color: var(--pp-ink); }
    .pp .langs button:focus-visible { outline: 2px solid var(--pp-brass); }
