    @media (max-width: 560px) {
      .pp-header .in { gap: 8px; padding: 10px 14px; } .pp-header nav { display: none; }
      .pp-header .menu, .pp-header .menu.alerts { position: fixed; left: 12px; right: 12px; top: 60px; width: auto; }
    }
    </style>
    <script>
    (function () {
      var PP = window.PP;
      PP.define('header', function (root, data, emit) {
        var esc = PP.esc;
        var S = { user: null, active: 'dashboard', open: null, alerts: { pending: 0, items: [] } };

        function initials(u) {
          var n = String(u.display_name || u.email || '?').trim().split(/\s+/);
          return ((n[0] || '?')[0] + (n.length > 1 ? n[n.length - 1][0] : '')).toUpperCase();
        }
        function alertsMenu() {
          var a = S.alerts;
          return '<div class="menu alerts card fade-in" role="menu"><div class="head">Awaiting your approval</div>' +
            (a.items.length ? a.items.map(function (i) {
              return '<button class="item" data-action="alert" data-r="' + esc(i.restaurant_id) + '" data-date="' + esc(i.date) + '">' +
                '<strong>' + esc(i.name) + '</strong> · ' + PP.plural(i.party, 'guest') +
                '<span class="sub">' + esc(i.restaurant) + ' · ' + esc(PP.fmtShort(i.date)) + ' at ' + esc(i.time) + '</span></button>';
            }).join('') + (a.pending > a.items.length ? '<div class="none">and ' + (a.pending - a.items.length) + ' more</div>' : '')
              : '<div class="none">Nothing to approve. New requests show up here when a booking needs a decision.</div>') + '</div>';
        }
        function userMenu() {
          var u = S.user, t = PP.theme();
          return '<div class="menu card fade-in" role="menu"><div class="who"><strong>' + esc(u.display_name) + '</strong><div class="muted small">' + esc(u.email) + '</div></div>' +
            '<div class="themes"><div class="small muted" style="margin-bottom:6px">Appearance</div><div class="seg">' +
              ['auto', 'light', 'dark'].map(function (k) { return '<button data-action="theme" data-t="' + k + '" class="' + (t === k ? 'on' : '') + '">' + k[0].toUpperCase() + k.slice(1) + '</button>'; }).join('') + '</div></div>' +
            '<button class="item" data-action="nav" data-page="dashboard">Your restaurants</button>' +
            '<button class="item" data-action="signout">Sign out</button></div>';
        }
        function render() {
          var u = S.user;
          document.documentElement.classList.toggle('pp-signed-out', !u);
          document.title = (S.alerts.pending ? '(' + S.alerts.pending + ') ' : '') + 'PlanPlate';
          if (!u) { root.innerHTML = ''; return; }
          root.innerHTML = '<header class="pp-header"><div class="in">' +
            '<button class="brand" data-action="nav" data-page="dashboard" aria-label="PlanPlate home">' + PP.mark() + '<span class="name">PlanPlate</span></button>' +
            '<nav><button data-action="nav" data-page="dashboard" class="' + (S.active === 'dashboard' ? 'on' : '') + '">Restaurants</button></nav>' +
            '<div class="right">' +
              '<button class="btn ghost icon bell" data-action="alerts" aria-label="Approvals (' + S.alerts.pending + ')" aria-expanded="' + (S.open === 'alerts') + '">' + PP.icon('bell') +
                (S.alerts.pending ? '<span class="n">' + S.alerts.pending + '</span>' : '') + '</button>' +
              '<button class="me" data-action="menu" aria-label="Account menu" aria-expanded="' + (S.open === 'menu') + '">' + esc(initials(u)) + '</button>' +
              (S.open === 'alerts' ? alertsMenu() : S.open === 'menu' ? userMenu() : '') +
            '</div></div></header>';
        }

        root.addEventListener('click', function (e) {
          e.ppHeader = true;
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var a = el.dataset.action;
          if (a === 'alerts' || a === 'menu') { S.open = S.open === a ? null : a; render(); return; }
          if (a === 'theme') { PP.setTheme(el.dataset.t); render(); return; }
          S.open = null;
          if (a === 'nav') { S.active = el.dataset.page; render(); emit('nav', { page: el.dataset.page }); }
          else if (a === 'alert') { render(); emit('open_alert', { restaurant_id: el.dataset.r, date: el.dataset.date }); }
          else if (a === 'signout') { render(); emit('signout', {}); }
        });
        document.addEventListener('click', function (e) { if (!e.ppHeader && S.open) { S.open = null; render(); } });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.open) { S.open = null; render(); } });

        // New requests arrive while the portal is open: check every minute.
        setInterval(function () {
          if (!S.user || document.hidden) return;
          emit('poll', {}).then(function (a) { if (a && typeof a.pending === 'number') { S.alerts = a; if (!S.open) render(); } }, function () {});
        }, 60000);

        render();
        return {
          setUser: function (json) { var me = json ? JSON.parse(json) : null; S.user = me; if (me && me.alerts) S.alerts = me.alerts; render(); },
          setActive: function (page) { S.active = page; S.open = null; render(); },
          setAlerts: function (json) { S.alerts = JSON.parse(json); render(); }
        };
      });
    })();
    </script>

    <!-- ===== AuthPage component ===== -->
    <style>
    .pp-auth { min-height: calc(100vh - 80px); display: grid; grid-template-columns: 1.1fr 1fr; }
    .pp-auth .side { background: #1d1b18; color: #efe9df; padding: 56px 56px 44px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
    .pp-auth .side .brand { display: flex; align-items: center; gap: 12px; font-family: var(--pp-serif); font-size: 1.7rem; font-weight: 600; }
    .pp-auth .side .brand .mark { width: 34px; height: 34px; color: #c9a56a; }
    .pp-auth .side h1 { color: inherit; font-size: 3.6rem; max-width: 11ch; line-height: 1.02; margin: 0 0 18px; font-weight: 500; }
    .pp-auth .side h1 em { color: #c9a56a; font-style: italic; }
    .pp-auth .side p { color: #b9b1a4; max-width: 38ch; font-size: 1.02rem; }
    .pp-auth .side ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 12px; color: #d8d1c4; font-size: .95rem; }
    .pp-auth .side li { display: flex; gap: 12px; align-items: baseline; }
    .pp-auth .side li::before { content: ""; flex: none; width: 18px; height: 1px; background: #c9a56a; transform: translateY(-4px); }
    .pp-auth .side .ring { position: absolute; right: -160px; bottom: -160px; width: 480px; height: 480px; color: rgba(201,165,106,.12); }
    .pp-auth .side .tag { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: #8e8678; }
    .pp-auth .main { display: grid; place-items: center; padding: 40px 20px; }
    .pp-auth .box { width: min(380px, 100%); }
    .pp-auth .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--pp-line); margin-bottom: 26px; }
    .pp-auth .tabs button { all: unset; cursor: pointer; padding: 10px 0; font-size: .92rem; color: var(--pp-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .pp-auth .tabs button.on { color: var(--pp-ink); border-bottom-color: var(--pp-ink); }
    .pp-auth form > div + div { margin-top: 16px; }
    .pp-auth .link { all: unset; cursor: pointer; color: var(--pp-muted); font-size: .84rem; text-decoration: underline; text-decoration-color: var(--pp-line); text-underline-offset: 3px; }
    .pp-auth .link:hover { color: var(--pp-ink); }
    @media (max-width: 860px) {
      .pp-auth { grid-template-columns: 1fr; min-height: 0; }
      .pp-auth .side { padding: 30px 22px; } .pp-auth .side h1 { font-size: 2.3rem; margin-top: 26px; } .pp-auth .side ul, .pp-auth .side .ring, .pp-auth .side .tag { display: none; }
    }
    </style>
    <script>
    (function () {
      var PP = window.PP;
      PP.define('auth', function (root, data, emit) {
        var esc = PP.esc;
        var S = { mode: 'login', busy: false, msg: null, email: '' };

        function form() {
          if (S.mode === 'reset') {
            return '<h2>Reset your password</h2><p class="muted small">We\'ll email you a link to choose a new one.</p>' +
              '<form data-form="reset"><div><label class="f" for="ppE">Email</label><input type="email" id="ppE" name="email" required autocomplete="email" value="' + esc(S.email) + '"></div>' +
              '<div><button class="btn primary block" type="submit">Send reset link</button></div></form>' +
              '<p style="margin-top:16px"><button class="link" data-action="mode" data-mode="login">Back to sign in</button></p>';
          }
          var signup = S.mode === 'signup';
          return '<div class="tabs" role="tablist">' +
              '<button role="tab" data-action="mode" data-mode="login" class="' + (!signup ? 'on' : '') + '">Sign in</button>' +
              '<button role="tab" data-action="mode" data-mode="signup" class="' + (signup ? 'on' : '') + '">Create account</button></div>' +
            '<h2>' + (signup ? 'Open your account' : 'Welcome back') + '</h2>' +
            '<p class="muted small">' + (signup ? 'Set up your restaurants, hours and tables in a few minutes.' : 'Sign in to manage your restaurants and reservations.') + '</p>' +
            '<form data-form="' + S.mode + '">' +
              (signup ? '<div><label class="f" for="ppN">Your name</label><input type="text" id="ppN" name="name" required autocomplete="name"></div>' : '') +
              '<div><label class="f" for="ppE">Email</label><input type="email" id="ppE" name="email" required autocomplete="email" value="' + esc(S.email) + '"></div>' +
              '<div><label class="f" for="ppP">Password</label><input type="password" id="ppP" name="password" required minlength="' + (signup ? 8 : 1) + '" autocomplete="' + (signup ? 'new-password' : 'current-password') + '">' +
                (signup ? '<div class="hint">At least 8 characters.</div>' : '<div class="hint" style="text-align:right"><button type="button" class="link" data-action="mode" data-mode="reset">Forgot your password?</button></div>') + '</div>' +
              '<div><button class="btn primary block" type="submit">' + (signup ? 'Create account' : 'Sign in') + '</button></div>' +
            '</form>';
        }

        function render() {
          root.innerHTML = '<div class="pp-auth">' +
            '<div class="side">' + PP.mark('ring') +
              '<div class="brand">' + PP.mark() + 'PlanPlate</div>' +
              '<div><h1>Reservations, <em>made simple.</em></h1>' +
              '<p>One calm place to run bookings for every restaurant you manage: opening hours, tables, approvals and a booking form for your website.</p>' +
              '<ul><li>Seasonal hours and special days that override them</li><li>Join and split tables hour by hour</li><li>Bookings confirm themselves until you are 80% full</li><li>Guests manage their own reservation from one private link</li></ul></div>' +
              '<div class="tag">Simple · Smart · Reliable</div></div>' +
            '<div class="main"><div class="box fade-in">' + form() + '<div data-el="msg"></div></div></div></div>';
          var f = root.querySelector('form');
          if (f) f.onsubmit = submit;
          showMsg();
        }
        function showMsg() {
          var box = root.querySelector('[data-el=msg]');
          if (box) box.innerHTML = S.msg ? '<div class="feedback ' + (S.msg.ok ? 'good' : 'bad') + '">' + esc(S.msg.text) + '</div>' : '';
        }
        function setBusy(on) {
          S.busy = on;
          root.querySelectorAll('.box button[type=submit]').forEach(function (b) {
            b.disabled = on;
            if (on) { b.dataset.label = b.innerHTML; b.innerHTML = '<span class="spin"></span>'; }
            else if (b.dataset.label) b.innerHTML = b.dataset.label;
          });
        }
        function submit(e) {
          e.preventDefault();
          if (S.busy) return;
          var v = {};
          new FormData(e.target).forEach(function (val, key) { v[key] = String(val); });
          S.email = v.email || '';
          S.msg = null; showMsg(); setBusy(true);
          emit(e.target.dataset.form, v).then(function (res) {
            setBusy(false);
            res = res || {};
            if (res.ok && !res.message) return; // Python navigates away
            S.msg = res.ok ? { ok: true, text: res.message } : { ok: false, text: res.error || 'Something went wrong.' };
            if (res.mode && res.mode !== S.mode) { S.mode = res.mode; render(); } else showMsg();
          }, function (err) { setBusy(false); S.msg = { ok: false, text: PP.err(err) }; showMsg(); });
        }
        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action=mode]');
          if (!el) return;
          var em = root.querySelector('input[name=email]');
          if (em) S.email = em.value;
          S.mode = el.dataset.mode; S.msg = null; render();
          var first = root.querySelector('form input:not([value]), form input[value=""]');
          if (first) first.focus();
        });
        render();
        return {};
      });
    })();
    </script>

    <!-- ===== DashboardPage component ===== -->
    <style>
    .pp-dash .hello { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 30px; }
    .pp-dash .hello h1 { margin: 0; }
    .pp-dash .alert { display: flex; gap: 16px; align-items: center; padding: 16px 20px; margin-bottom: 30px; background: var(--pp-warn-soft); border: 1px solid color-mix(in srgb, var(--pp-warn) 25%, transparent); border-radius: var(--pp-radius); color: var(--pp-ink); flex-wrap: wrap; }
    .pp-dash .alert .ic { width: 22px; height: 22px; color: var(--pp-warn); }
    .pp-dash .alert strong { font-weight: 600; }
    .pp-dash .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .pp-dash .rc { display: flex; flex-direction: column; padding: 22px 22px 16px; min-height: 230px; transition: border-color .15s, transform .15s; }
    .pp-dash .rc:hover { border-color: var(--pp-faint); }
    .pp-dash .rc h3 { font-size: 1.55rem; margin-bottom: 2px; overflow-wrap: anywhere; }
    .pp-dash .rc .addr { color: var(--pp-muted); font-size: .84rem; min-height: 1.3em; }
    .pp-dash .rc .today { margin: 14px 0 16px; font-size: .86rem; color: var(--pp-ink); display: flex; gap: 7px; align-items: center; }
    .pp-dash .rc .today .ic { color: var(--pp-brass); }
    .pp-dash .rc .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 0; border-top: 1px solid var(--pp-line); border-bottom: 1px solid var(--pp-line); }
    .pp-dash .rc .nums b { display: block; font: 500 1.6rem/1 var(--pp-serif); }
    .pp-dash .rc .nums span { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--pp-muted); }
    .pp-dash .rc .acts { display: flex; gap: 4px; align-items: center; margin-top: auto; padding-top: 12px; }
    .pp-dash .rc .top { display: flex; gap: 10px; align-items: flex-start; }
    .pp-dash .rc .top > div { flex: 1; min-width: 0; }
    .pp-dash .new { display: grid; place-items: center; text-align: center; border-style: dashed; color: var(--pp-muted); min-height: 230px; }
    .pp-dash .new:hover { color: var(--pp-ink); border-color: var(--pp-ink); }
    .pp-dash .new .plus { width: 44px; height: 44px; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; margin: 0 auto 10px; }
    </style>
    <script>
    (function () {
      var PP = window.PP;
      PP.define('dashboard', function (root, data, emit) {
        var esc = PP.esc;
        var list = data.restaurants || [], me = data.me || {};

        function greeting() {
          var h = new Date().getHours();
          return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
        }
        function card(r) {
          return '<div class="card rc fade-in" data-id="' + esc(r.id) + '">' +
            '<div class="top"><div><h3>' + esc(r.name) + '</h3><div class="addr">' + esc(r.address || '/' + r.slug) + '</div></div>' +
              (r.pending ? '<span class="badge pending">' + r.pending + ' to approve</span>' : !r.accepting ? '<span class="badge cancelled">Online booking off</span>' : '') +
              (r.role && r.role !== 'owner' ? '<span class="badge plain">' + esc(PP.ROLE[r.role]) + '</span>' : '') + '</div>' +
            '<div class="today">' + PP.icon('clock') + esc(r.today) + '</div>' +
            '<div class="nums"><div><b>' + r.bookings + '</b><span>Bookings</span></div><div><b>' + r.covers + '</b><span>Guests</span></div><div><b>' + r.seats + '</b><span>Seats</span></div></div>' +
            '<div class="acts"><button class="btn primary sm" data-action="open" data-page="reservations">Open</button>' +
              (r.role !== 'staff' ? '<button class="btn ghost sm" data-action="open" data-page="hours">Hours</button>' +
              '<button class="btn ghost sm" data-action="open" data-page="tables">Tables</button>' : '') + '<span class="spacer"></span>' +
              '<button class="btn ghost icon" data-action="copy" title="Copy booking link" aria-label="Copy booking link">' + PP.icon('link') + '</button>' +
              (r.role !== 'staff' ? '<button class="btn ghost icon" data-action="duplicate" title="Duplicate" aria-label="Duplicate restaurant">' + PP.icon('copy') + '</button>' : '') + '</div></div>';
        }
        function render() {
          var pending = list.reduce(function (n, r) { return n + r.pending; }, 0);
          var firstName = String(me.display_name || '').split(' ')[0];
          root.innerHTML = '<div class="wrap pp-dash">' +
            '<div class="hello"><div><div class="eyebrow">' + esc(new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })) + '</div>' +
              '<h1>' + greeting() + (firstName ? ', ' + esc(firstName) : '') + '</h1></div><span class="spacer"></span>' +
              (list.length ? '<button class="btn primary" data-action="new">' + PP.icon('plus') + 'New restaurant</button>' : '') + '</div>' +
            (pending ? '<div class="alert">' + PP.icon('bell') + '<div><strong>' + PP.plural(pending, 'booking') + ' waiting for your approval.</strong> ' +
              '<span class="muted">They came in while a restaurant was nearly full, or for a large party.</span></div><span class="spacer"></span>' +
              list.filter(function (r) { return r.pending; }).map(function (r) {
                return '<button class="btn sm" data-action="open" data-page="reservations" data-id="' + esc(r.id) + '">' + esc(r.name) + ' · ' + r.pending + '</button>';
              }).join('') + '</div>' : '') +
            (list.length ? '<div class="section-title"><h2>Your restaurants</h2><span class="muted small">' + list.length + '</span></div>' +
              '<div class="grid">' + list.map(card).join('') +
              '<button class="card new" data-action="new"><div><div class="plus">' + PP.icon('plus') + '</div>Add a restaurant</div></button></div>'
              : '<div class="empty" style="padding:70px 20px"><h2>Add your first restaurant</h2><p>Start with sample opening hours and tables, then make them yours.</p>' +
                '<button class="btn primary" data-action="new">' + PP.icon('plus') + 'New restaurant</button></div>') +
            '</div>';
        }

        function newModal() {
          var tz = 'UTC';
          try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) {}
          var d = PP.modal('<div class="eyebrow">New restaurant</div><h2>What is it called?</h2>' +
            '<form><div class="stack"><div><label class="f" for="nrName">Name</label><input id="nrName" name="name" type="text" required maxlength="80" autofocus></div>' +
            '<div><label class="f" for="nrTz">Time zone</label>' + PP.tzField('timezone', tz, 'nrTz') +
              '<div class="hint">Booking times are always in the restaurant\'s local time. Search by country, city or GMT offset.</div></div>' +
            '<label class="check"><input type="checkbox" name="sample" checked><span>Start with sample opening hours and 9 tables<br><span class="muted small">You can change all of it afterwards.</span></span></label>' +
            '<div data-el="msg"></div></div>' +
            '<div class="foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Create restaurant</button></div></form>');
          var f = d.el.querySelector('form');
          f.onsubmit = function (e) {
            e.preventDefault();
            var b = f.querySelector('[type=submit]'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
            emit('create', { name: f.name.value, timezone: f.timezone.value, sample: f.sample.checked }).then(function (res) {
              if (res && res.ok) { d.close(); return; }
              b.disabled = false; b.textContent = 'Create restaurant';
              d.el.querySelector('[data-el=msg]').innerHTML = '<div class="feedback bad">' + esc((res && res.error) || 'Could not create it.') + '</div>';
            }, function (err) { b.disabled = false; b.textContent = 'Create restaurant'; PP.toast(PP.err(err), true); });
          };
        }
        function dupModal(r) {
          var d = PP.modal('<div class="eyebrow">Duplicate</div><h2>Copy ' + esc(r.name) + '</h2>' +
            '<p class="muted small">The copy gets the same settings, opening hours, special days, tables and joins. Reservations stay with the original.</p>' +
            '<form><label class="f" for="dpName">Name of the new restaurant</label><input id="dpName" name="name" type="text" required maxlength="80" value="' + esc(r.name + ' (copy)') + '">' +
            '<div data-el="msg"></div><div class="foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Duplicate</button></div></form>');
          var f = d.el.querySelector('form');
          f.name.select();
          f.onsubmit = function (e) {
            e.preventDefault();
            var b = f.querySelector('[type=submit]'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
            emit('duplicate', { id: r.id, name: f.name.value }).then(function (res) {
              if (res && res.ok) { d.close(); return; }
              b.disabled = false; b.textContent = 'Duplicate';
              d.el.querySelector('[data-el=msg]').innerHTML = '<div class="feedback bad">' + esc((res && res.error) || 'Could not copy it.') + '</div>';
            });
          };
        }

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var host = el.closest('[data-id]');
          var r = host && list.filter(function (x) { return x.id === host.dataset.id; })[0];
          var a = el.dataset.action;
          if (a === 'new') newModal();
          else if (a === 'open' && r) emit('open', { id: r.id, page: el.dataset.page || 'reservations' });
          else if (a === 'duplicate' && r) dupModal(r);
          else if (a === 'copy' && r) PP.copy(PP.bookUrl(r.slug), 'Booking link');
        });
        render();
        return {};
      });
    })();
    </script>

    <!-- ===== ReservationsPage component ===== -->
