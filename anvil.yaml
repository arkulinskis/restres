    <script>
    (function () {
      var PP = window.PP;
      PP.LANGS.en = Object.assign({
        yourRes: 'Your reservation', st_confirmed: 'Your table is confirmed.', st_pending: 'The restaurant will confirm your request shortly.',
        st_cancelled: 'This reservation has been cancelled.', st_declined: 'Sorry, the restaurant couldn\'t accept this request. Please call them or pick another time.',
        changeRes: 'Change reservation', cancelRes: 'Cancel reservation', cancelQ: 'Cancel this reservation?', cancelText: 'Your table will be released for other guests.',
        keep: 'Keep it', yesCancel: 'Cancel reservation', saveChanges: 'Save changes', nothingChanged: 'Nothing to save yet.',
        saved: 'Your reservation has been updated', cancelled: 'Your reservation is cancelled', noChange: 'To change this reservation, please contact the restaurant.',
        badLink: 'Reservation not found', bookAgain: 'Book another table'
      }, PP.LANGS.en);

      PP.LANGS.en = Object.assign({ bd_confirmed: 'Confirmed', bd_pending: 'Awaiting confirmation', bd_cancelled: 'Cancelled', bd_declined: 'Declined' }, PP.LANGS.en);
      PP.LANGS.fr = Object.assign({
        yourRes: 'Votre réservation', st_confirmed: 'Votre table est confirmée.', st_pending: 'Le restaurant confirmera votre demande sous peu.',
        st_cancelled: 'Cette réservation a été annulée.', st_declined: 'Désolé, le restaurant n\'a pas pu accepter cette demande. Appelez-le ou choisissez un autre horaire.',
        changeRes: 'Modifier la réservation', cancelRes: 'Annuler la réservation', cancelQ: 'Annuler cette réservation ?', cancelText: 'Votre table sera libérée pour d\'autres clients.',
        keep: 'La garder', yesCancel: 'Annuler la réservation', saveChanges: 'Enregistrer', nothingChanged: 'Rien à enregistrer.',
        saved: 'Votre réservation a été modifiée', cancelled: 'Votre réservation est annulée', noChange: 'Pour modifier cette réservation, contactez le restaurant.',
        badLink: 'Réservation introuvable', bookAgain: 'Réserver une autre table',
        bd_confirmed: 'Confirmée', bd_pending: 'En attente', bd_cancelled: 'Annulée', bd_declined: 'Refusée'
      }, PP.LANGS.fr);
      PP.LANGS.lv = Object.assign({
        yourRes: 'Jūsu rezervācija', st_confirmed: 'Jūsu galdiņš ir apstiprināts.', st_pending: 'Restorāns drīz apstiprinās jūsu pieprasījumu.',
        st_cancelled: 'Šī rezervācija ir atcelta.', st_declined: 'Diemžēl restorāns nevarēja pieņemt šo pieprasījumu. Lūdzu, piezvaniet vai izvēlieties citu laiku.',
        changeRes: 'Mainīt rezervāciju', cancelRes: 'Atcelt rezervāciju', cancelQ: 'Atcelt šo rezervāciju?', cancelText: 'Jūsu galdiņš tiks atbrīvots citiem viesiem.',
        keep: 'Paturēt', yesCancel: 'Atcelt rezervāciju', saveChanges: 'Saglabāt', nothingChanged: 'Nav ko saglabāt.',
        saved: 'Jūsu rezervācija ir mainīta', cancelled: 'Jūsu rezervācija ir atcelta', noChange: 'Lai mainītu šo rezervāciju, sazinieties ar restorānu.',
        badLink: 'Rezervācija nav atrasta', bookAgain: 'Rezervēt citu galdiņu',
        bd_confirmed: 'Apstiprināta', bd_pending: 'Gaida apstiprinājumu', bd_cancelled: 'Atcelta', bd_declined: 'Noraidīta'
      }, PP.LANGS.lv);

      PP.define('manage', function (root, data, emit) {
        var esc = PP.esc, T = PP.T;
        var D = data, mode = 'view', pick = null, err = null, busy = false, picker = null, pickerEl = null;
        PP.setLang((D.reservation && D.reservation.language) || 'en');

        function facts(r) {
          return '<div class="facts"><div><b>' + esc(PP.fmtDate(r.date, { weekday: 'short', day: 'numeric', month: 'short' })) + '</b><span>' + esc(T('date')) + '</span></div>' +
            '<div><b>' + esc(r.time) + '</b><span>' + esc(T('time')) + '</span></div><div><b>' + r.party + '</b><span>' + esc(T('guests')) + '</span></div></div>';
        }
        function view() {
          var r = D.reservation, R = D.restaurant, live = r.status === 'pending' || r.status === 'confirmed';
          return '<div class="card status fade-in' + (live ? '' : ' gone') + '"><span class="badge ' + esc(r.status) + '">' + esc(T('bd_' + r.status)) + '</span>' +
            '<h2>' + esc(T('yourRes')) + '</h2><p class="lead">' + esc(T('st_' + r.status)) + '</p>' + facts(r) +
            '<div class="who">' + esc(r.name) + (r.notes ? '<br><span class="small">“' + esc(r.notes) + '”</span>' : '') + '</div></div>' +
            '<div class="acts">' +
              (D.can_change ? '<button class="btn primary" data-action="change">' + PP.icon('edit') + esc(T('changeRes')) + '</button>' : '') +
              (live ? '<button class="btn" data-action="ics">' + PP.icon('calendar') + esc(T('calendar')) + '</button>' : '') +
              (D.can_cancel ? '<button class="btn danger" data-action="cancel">' + esc(T('cancelRes')) + '</button>' : '') +
              (!live ? '<a class="btn primary" href="' + esc(PP.bookUrl(R.slug)) + '">' + esc(T('bookAgain')) + '</a>' : '') +
              (live && !D.can_change && R.phone ? '<p class="hint" style="text-align:center">' + esc(T('noChange')) + '</p>' : '') + '</div>';
        }
        function changeHtml() {
          var r = D.reservation, g = D.guest || {};
          return '<div class="card panel"><div data-el="picker"></div><hr>' +
            '<form data-el="form" class="stack"><div class="step" style="margin:0"><h2>' + esc(T('details')) + '</h2></div>' +
            '<div><label class="f" for="mgName">' + esc(T('name')) + '</label><input id="mgName" name="name" type="text" required maxlength="100" value="' + esc(r.name) + '"></div>' +
            '<div class="grid2"><div><label class="f" for="mgEmail">' + esc(T('email')) + '</label><input id="mgEmail" name="email" type="email" required maxlength="200" value="' + esc(g.email) + '"></div>' +
              '<div><label class="f" for="mgPhone">' + esc(T('phone')) + '</label><input id="mgPhone" name="phone" type="tel" required maxlength="40" value="' + esc(g.phone) + '"></div></div>' +
            '<div><label class="f" for="mgNotes">' + esc(T('notes')) + '</label><textarea id="mgNotes" name="notes" maxlength="1000" style="min-height:70px">' + esc(r.notes) + '</textarea></div>' +
            (err ? '<div class="feedback bad">' + esc(err) + '</div>' : '') +
            '<div class="row"><button type="button" class="btn" data-action="view">' + esc(T('back')) + '</button><span class="spacer"></span>' +
            '<button class="btn primary" type="submit"' + (busy ? ' disabled' : '') + '>' + (busy ? '<span class="spin"></span>' : esc(T('saveChanges'))) + '</button></div></form></div>';
        }
        function render() {
          var R = D.restaurant || {};
          var body = !D.ok ? '<div class="card panel" style="text-align:center"><h2>' + esc(T('badLink')) + '</h2><p class="muted">' + esc(D.error || '') + '</p></div>'
            : mode === 'change' ? changeHtml() : view();
          root.innerHTML = '<div class="pp-book pp-manage"><div class="sheet">' +
            (D.ok ? PP.langSwitch(R.languages) + '<div class="masthead">' + PP.mark() + '<h1>' + esc(R.name) + '</h1>' + (R.address ? '<p>' + esc(R.address) + '</p>' : '') + '</div>' : '') + body +
            (D.ok ? '<div class="foot">' + (R.phone ? '<span>' + PP.icon('phone') + '<a href="tel:' + esc(R.phone) + '">' + esc(R.phone) + '</a></span>' : '') + (R.email ? '<span><a href="mailto:' + esc(R.email) + '">' + esc(R.email) + '</a></span>' : '') + '</div>' : '') +
            '</div></div>';
          var holder = root.querySelector('[data-el=picker]');
          if (holder) {
            if (!picker) {
              pickerEl = document.createElement('div');
              var r = D.reservation;
              picker = PP.picker(pickerEl, { days: D.days, today: null, maxParty: R.max_party, party: r.party, date: r.date, time: r.time,
                load: function (date, party) { return emit('slots', { date: date, party: party }); },
                onChange: function (st) { pick = st; } });
            }
            holder.appendChild(pickerEl);
          }
          var f = root.querySelector('[data-el=form]');
          if (f) f.onsubmit = save;
        }
        function save(e) {
          e.preventDefault();
          var f = e.target;
          if (!f.reportValidity()) return;
          var st = pick || picker.state();
          if (!st.time) { err = T('pickDate'); render(); return; }
          busy = true; err = null;
          var payload = { date: st.date, time: st.time, party: st.party, name: f.name.value, email: f.email.value, phone: f.phone.value, notes: f.notes.value };
          render();
          emit('change', payload).then(function (res) {
            busy = false;
            if (res && res.ok) { D = res; mode = 'view'; picker = null; render(); PP.toast(T('saved')); window.scrollTo(0, 0); return; }
            err = (res && res.error) || 'Something went wrong.';
            var keepVals = payload; render();
            var nf = root.querySelector('[data-el=form]');
            ['name', 'email', 'phone', 'notes'].forEach(function (k) { nf[k].value = keepVals[k]; });
          }, function (x) { busy = false; err = PP.err(x); render(); });
        }
        root.addEventListener('click', function (e) {
          var lb = e.target.closest('[data-lang]');
          if (lb) { PP.setLang(lb.dataset.lang); if (pickerEl) { pick = picker ? picker.state() : pick; picker = null; } render(); return; }
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var a = el.dataset.action;
          if (a === 'change') { mode = 'change'; err = null; render(); }
          else if (a === 'view') { mode = 'view'; picker = null; err = null; render(); }
          else if (a === 'ics') PP.ics(D.reservation, D.restaurant, location.href);
          else if (a === 'cancel') {
            PP.confirm(T('cancelQ'), T('cancelText'), T('yesCancel'), true, T('keep')).then(function (yes) {
              if (!yes) return;
              emit('cancel', {}).then(function (res) {
                if (res && res.ok) { D = res; render(); PP.toast(T('cancelled')); }
                else PP.toast((res && res.error) || 'Could not cancel.', true);
              });
            });
          }
        });
        if (D.ok) document.title = T('yourRes') + ' · ' + D.restaurant.name;
        render();
        return {};
      });
    })();
    </script>

    <!-- ===== MenuPage component ===== -->
    <style>
    .pp-menu { min-height: 100vh; padding: 44px 18px 40px; }
    .pp-menu .sheet { max-width: 640px; margin: 0 auto; }
    .pp-menu .masthead { text-align: center; margin-bottom: 36px; }
    .pp-menu .masthead .mark { width: 30px; height: 30px; color: var(--pp-brass); margin-bottom: 10px; }
    .pp-menu .masthead h1 { font-size: 3rem; margin-bottom: 4px; }
    .pp-menu .masthead p { color: var(--pp-muted); margin: 0; }
    .pp-menu section { margin-bottom: 38px; }
    .pp-menu section h2 { text-align: center; font-size: 1.7rem; margin-bottom: 4px; }
    .pp-menu section h2::after { content: ""; display: block; width: 34px; height: 1px; background: var(--pp-brass); margin: 12px auto 0; }
    .pp-menu section .note { text-align: center; color: var(--pp-muted); font-size: .86rem; font-style: italic; margin-top: 8px; }
    .pp-menu .dish { margin: 20px 0; }
    .pp-menu .dish .line { display: flex; align-items: baseline; gap: 10px; }
    .pp-menu .dish .name { font-family: var(--pp-serif); font-size: 1.3rem; font-weight: 500; }
    .pp-menu .dish .dots { flex: 1; border-bottom: 1px dotted var(--pp-faint); transform: translateY(-5px); min-width: 20px; }
    .pp-menu .dish .price { font-family: var(--pp-serif); font-size: 1.2rem; white-space: nowrap; }
    .pp-menu .dish .ds { color: var(--pp-muted); font-size: .9rem; margin-top: 2px; }
    .pp-menu .dish .tags { font-size: .7rem; letter-spacing: .1em; color: var(--pp-brass); font-weight: 600; }
    .pp-menu .legend { text-align: center; color: var(--pp-faint); font-size: .76rem; margin-top: 10px; }
    .pp-menu .cta { text-align: center; margin-top: 26px; }
    @media (max-width: 520px) { .pp-menu .masthead h1 { font-size: 2.2rem; } .pp-menu .dish .name { font-size: 1.15rem; } }
    </style>
    <script>
    (function () {
      var PP = window.PP;
      PP.define('menu', function (root, data) {
        var esc = PP.esc, R = data.restaurant || {};
        function render() {
          if (!data.ok) { root.innerHTML = '<div class="pp-menu"><div class="sheet card pad" style="text-align:center"><h2>Menu not found</h2><p class="muted">' + esc(data.error || '') + '</p></div></div>'; return; }
          var used = {};
          var body = data.sections.map(function (s) {
            return '<section><h2>' + esc(s.title) + '</h2>' + (s.description ? '<div class="note">' + esc(s.description) + '</div>' : '') +
              s.items.map(function (i) {
                i.tags.forEach(function (t) { used[t] = 1; });
                return '<div class="dish"><div class="line"><span class="name">' + esc(i.name) + '</span>' + (i.tags.length ? '<span class="tags">' + esc(i.tags.join(' · ')) + '</span>' : '') +
                  '<span class="dots"></span><span class="price">' + esc(i.price) + '</span></div>' + (i.description ? '<div class="ds">' + esc(i.description) + '</div>' : '') + '</div>';
              }).join('') + '</section>';
          }).join('');
          root.innerHTML = '<div class="pp-menu"><div class="sheet"><div class="masthead">' + PP.mark() + '<div class="eyebrow">Menu</div><h1>' + esc(R.name) + '</h1>' +
              (R.description ? '<p>' + esc(R.description) + '</p>' : '') + '</div>' +
            (body || '<p class="muted" style="text-align:center">The menu is being written. Please ask your server.</p>') +
            (Object.keys(used).length ? '<div class="legend">' + Object.keys(used).map(function (t) { return esc(t) + ' ' + esc(data.tags[t]); }).join(' · ') + '</div>' : '') +
            (R.accepting ? '<div class="cta"><a class="btn primary" href="' + esc(PP.bookUrl(R.slug)) + '">' + PP.icon('calendar') + 'Reserve a table</a></div>' : '') +
            '</div></div>';
        }
        if (data.ok) document.title = 'Menu · ' + R.name;
        render();
        return {};
      });
    })();
    </script>
package_name: PlanPlate_2_0
