metadata:
  title: PlanPlate 2.0
name: PlanPlate
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=c5abea8f6d\"></script>\n\n<!--\n  PLANPLATE — SHARED THEME + CORE HELPERS\n\
    \  Goes into: Anvil → Native Libraries (tools/sync_to_anvil.py does this).\n  Fonts, colour tokens (light + dark), base\
    \ styles every component uses, and window.PP.\n  Look: ivory paper, warm ink, a brass accent. Serif display type, quiet\
    \ sans for the interface.\n-->\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\"\
    \ href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap\"\
    \ rel=\"stylesheet\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<!-- Browser tab icon:\
    \ the PlanPlate mark (a plate from above), brass on ink. Anvil's default icon is removed. -->\n<link id=\"pp-favicon\"\
    \ rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0\
    \ 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231d1b18'/%3E%3Ccircle cx='16' cy='16' r='11.8' fill='none' stroke='%23c9a56a'\
    \ stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7.4' fill='none' stroke='%23c9a56a' stroke-width='1.3'/%3E%3Cpath d='M16\
    \ 11.6v8.8' stroke='%23c9a56a' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E\">\n<link rel=\"apple-touch-icon\"\
    \ href=\"_/theme/icon-180.png\">\n<script>\n(function () {\n  function keepOurs() {\n    var ours = document.getElementById('pp-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n    if (ours !== document.head.lastElementChild) document.head.appendChild(ours);\n  }\n  keepOurs();\n  document.addEventListener('DOMContentLoaded',\
    \ keepOurs);\n  window.addEventListener('load', keepOurs);\n})();\n</script>\n<!-- QR codes for the booking page and the\
    \ menu (Settings → Share). -->\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js\"\
    ></script>\n\n<style>\n:root {\n  --pp-bg: #f6f3ee; --pp-panel: #fffdf9; --pp-panel-2: #f1ede6; --pp-ink: #1d1b18; --pp-muted:\
    \ #6f6a62; --pp-faint: #a19a8f; --pp-line: #e4ded4;\n  --pp-accent: #1d1b18; --pp-accent-ink: #faf8f4; --pp-brass: #9c7a43;\
    \ --pp-brass-soft: #f3ebdc;\n  --pp-good: #3f6b4e; --pp-good-soft: #e5efe7; --pp-warn: #93650f; --pp-warn-soft: #f7ecd6;\
    \ --pp-bad: #a23b2c; --pp-bad-soft: #f6e4e0;\n  --pp-info: #3d5a80; --pp-info-soft: #e6ecf4;\n  --pp-shadow: 0 1px 2px\
    \ rgba(29,27,24,.04), 0 10px 30px rgba(29,27,24,.06);\n  --pp-radius: 12px;\n  --pp-serif: \"Cormorant Garamond\", \"\
    Iowan Old Style\", Georgia, serif;\n  --pp-sans: \"Inter\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n\
    \  color-scheme: light;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --pp-bg:\
    \ #121110; --pp-panel: #1b1a18; --pp-panel-2: #161513; --pp-ink: #ece7de; --pp-muted: #a39d92; --pp-faint: #6f6a62; --pp-line:\
    \ #2e2b27;\n    --pp-accent: #ece7de; --pp-accent-ink: #151412; --pp-brass: #c9a56a; --pp-brass-soft: #2c2519;\n    --pp-good:\
    \ #8fbf9c; --pp-good-soft: #1d2a21; --pp-warn: #e2b660; --pp-warn-soft: #2f2615; --pp-bad: #e6907f; --pp-bad-soft: #33201b;\n\
    \    --pp-info: #9db7da; --pp-info-soft: #1c2532;\n    --pp-shadow: none; color-scheme: dark;\n  }\n}\n:root[data-theme=\"\
    dark\"] {\n  --pp-bg: #121110; --pp-panel: #1b1a18; --pp-panel-2: #161513; --pp-ink: #ece7de; --pp-muted: #a39d92; --pp-faint:\
    \ #6f6a62; --pp-line: #2e2b27;\n  --pp-accent: #ece7de; --pp-accent-ink: #151412; --pp-brass: #c9a56a; --pp-brass-soft:\
    \ #2c2519;\n  --pp-good: #8fbf9c; --pp-good-soft: #1d2a21; --pp-warn: #e2b660; --pp-warn-soft: #2f2615; --pp-bad: #e6907f;\
    \ --pp-bad-soft: #33201b;\n  --pp-info: #9db7da; --pp-info-soft: #1c2532;\n  --pp-shadow: none; color-scheme: dark;\n\
    }\n\n/* Our design owns the page, not the Anvil theme. */\nhtml, body { background: var(--pp-bg) !important; color: var(--pp-ink);\
    \ }\nbody { font: 15px/1.55 var(--pp-sans); margin: 0; -webkit-font-smoothing: antialiased; }\n\n.pp, .pp * { box-sizing:\
    \ border-box; }\n.pp { font: 15px/1.55 var(--pp-sans); color: var(--pp-ink); }\n.pp h1, .pp h2, .pp h3 { font-family:\
    \ var(--pp-serif); font-weight: 500; line-height: 1.1; margin: 0 0 .35em; color: var(--pp-ink); letter-spacing: -.005em;\
    \ }\n.pp h1 { font-size: 2.6rem; } .pp h2 { font-size: 1.75rem; } .pp h3 { font-size: 1.3rem; }\n.pp p { margin: 0 0 .8em;\
    \ }\n.pp a { color: inherit; text-decoration-color: var(--pp-brass); text-underline-offset: 3px; }\n.pp [hidden] { display:\
    \ none !important; }\n.pp .muted { color: var(--pp-muted); } .pp .small { font-size: .85rem; } .pp .faint { color: var(--pp-faint);\
    \ }\n.pp .eyebrow { font: 600 .7rem/1.2 var(--pp-sans); letter-spacing: .18em; text-transform: uppercase; color: var(--pp-brass);\
    \ margin-bottom: 10px; }\n.pp .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 96px; }\n.pp .narrow { max-width:\
    \ 760px; margin: 0 auto; }\n.pp .card { background: var(--pp-panel); border: 1px solid var(--pp-line); border-radius:\
    \ var(--pp-radius); box-shadow: var(--pp-shadow); }\n.pp .pad { padding: 22px 24px; }\n.pp .row { display: flex; align-items:\
    \ center; gap: 10px; flex-wrap: wrap; }\n.pp .spacer { flex: 1; }\n.pp .stack > * + * { margin-top: 14px; }\n.pp .grid2\
    \ { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }\n.pp .grid3 { display: grid; grid-template-columns:\
    \ repeat(3, 1fr); gap: 14px 16px; }\n.pp hr { border: 0; border-top: 1px solid var(--pp-line); margin: 22px 0; }\n.pp\
    \ .section-title { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 14px; }\n.pp .section-title h2 { margin:\
    \ 0; }\n.pp :where(button.card) { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; margin:\
    \ 0; -webkit-appearance: none; appearance: none; }\n\n.pp .btn { font: 500 .9rem/1.2 var(--pp-sans); border: 1px solid\
    \ var(--pp-line); background: var(--pp-panel); color: var(--pp-ink); border-radius: 999px; padding: 10px 18px; cursor:\
    \ pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; transition:\
    \ border-color .15s, background .15s, opacity .15s; white-space: nowrap; }\n.pp .btn:hover { border-color: var(--pp-ink);\
    \ }\n.pp .btn.primary { background: var(--pp-accent); border-color: var(--pp-accent); color: var(--pp-accent-ink); }\n\
    .pp .btn.primary:hover { opacity: .9; }\n.pp .btn.ghost { background: transparent; border-color: transparent; color: var(--pp-muted);\
    \ }\n.pp .btn.ghost:hover { color: var(--pp-ink); background: var(--pp-panel-2); }\n.pp .btn.good { background: var(--pp-good);\
    \ border-color: var(--pp-good); color: #fff; }\n.pp .btn.danger { color: var(--pp-bad); }\n.pp .btn.danger:hover { border-color:\
    \ var(--pp-bad); }\n.pp .btn.sm { padding: 6px 12px; font-size: .82rem; }\n.pp .btn.icon { padding: 8px; width: 36px;\
    \ height: 36px; }\n.pp .btn.block { width: 100%; }\n.pp .btn:disabled { opacity: .45; cursor: not-allowed; }\n.pp .btn\
    \ svg, .pp .ic { width: 16px; height: 16px; flex: none; }\n.pp .ic.rot { transform: rotate(90deg); }\n.pp .btn:focus-visible,\
    \ .pp input:focus-visible, .pp textarea:focus-visible, .pp select:focus-visible, .pp [tabindex]:focus-visible { outline:\
    \ 2px solid var(--pp-brass); outline-offset: 2px; }\n.pp input:focus, .pp textarea:focus, .pp select:focus { border-color:\
    \ var(--pp-ink); outline: none; }\n\n.pp input[type=text], .pp input[type=email], .pp input[type=password], .pp input[type=tel],\
    \ .pp input[type=number], .pp input[type=date], .pp input[type=time], .pp input[type=search], .pp input[type=url], .pp\
    \ textarea, .pp select {\n  font: inherit; color: var(--pp-ink); background: var(--pp-panel); border: 1px solid var(--pp-line);\
    \ border-radius: 10px; padding: 10px 12px; width: 100%; margin: 0; box-shadow: none; height: auto; min-height: 42px;\n\
    }\n.pp input[type=number] { -moz-appearance: textfield; }\n.pp textarea { min-height: 90px; resize: vertical; line-height:\
    \ 1.5; }\n.pp label.f { display: block; font-weight: 500; font-size: .84rem; margin-bottom: 6px; color: var(--pp-ink);\
    \ }\n.pp .hint { font-size: .8rem; color: var(--pp-muted); margin-top: 5px; line-height: 1.45; }\n.pp .check { display:\
    \ flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: .9rem; }\n.pp .check input { margin-top: 3px;\
    \ width: 17px; height: 17px; accent-color: var(--pp-accent); flex: none; }\n.pp .inline { display: flex; align-items:\
    \ center; gap: 8px; }\n.pp .inline input { width: auto; flex: 1; min-width: 0; }\n\n.pp .badge { display: inline-flex;\
    \ align-items: center; gap: 5px; font: 500 .74rem/1.3 var(--pp-sans); padding: 3px 10px; border-radius: 99px; background:\
    \ var(--pp-panel-2); color: var(--pp-muted); white-space: nowrap; letter-spacing: .02em; }\n.pp .badge::before { content:\
