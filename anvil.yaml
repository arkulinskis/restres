    .pp-res .tl { --lab: 104px; overflow-x: auto; border: 1px solid var(--pp-line); border-radius: var(--pp-radius); background: var(--pp-panel); }
    .pp-res .tl-in { position: relative; }
    .pp-res .tl-row { display: flex; border-top: 1px solid var(--pp-line); min-height: 46px; }
    .pp-res .tl-row:first-child { border-top: 0; }
    .pp-res .tl .lab { position: sticky; left: 0; z-index: 3; width: var(--lab); flex: none; padding: 12px 12px; background: var(--pp-panel); border-right: 1px solid var(--pp-line); font-size: .86rem; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .pp-res .tl .lab span { color: var(--pp-faint); font-weight: 400; font-size: .76rem; }
    .pp-res .tl .lane { position: relative; flex: 1; cursor: copy; background-image: linear-gradient(to right, var(--pp-line) 1px, transparent 1px); background-size: calc(100% / var(--hours)) 100%; }
    .pp-res .tl .head .lane { cursor: default; background: none; height: 34px; }
    .pp-res .tl .head .lab { color: var(--pp-muted); font-weight: 400; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; }
    .pp-res .tl .tick { position: absolute; top: 9px; font-size: .74rem; color: var(--pp-muted); transform: translateX(4px); font-variant-numeric: tabular-nums; }
    .pp-res .tl .closed { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--pp-line) 60%, transparent) 6px 7px); pointer-events: none; }
    .pp-res .tl .occ .lane { cursor: default; height: 40px; }
    .pp-res .tl .occ .col { position: absolute; bottom: 4px; background: color-mix(in srgb, var(--pp-ink) 22%, transparent); border-radius: 2px 2px 0 0; }
    .pp-res .tl .occ .col.hot { background: var(--pp-warn); }
    .pp-res .tl .blk { all: unset; box-sizing: border-box; position: absolute; top: 5px; bottom: 5px; border-radius: 7px; padding: 4px 8px; font-size: .76rem; line-height: 1.25; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; background: var(--pp-ink); color: var(--pp-bg); z-index: 2; box-shadow: 0 0 0 2px var(--pp-panel); }
    .pp-res .tl .blk.pending { background: repeating-linear-gradient(135deg, var(--pp-warn-soft) 0 8px, color-mix(in srgb, var(--pp-warn) 18%, var(--pp-panel)) 8px 16px); color: var(--pp-warn); border: 1px solid var(--pp-warn); }
    .pp-res .tl .blk:hover { filter: brightness(1.15); }
    .pp-res .tl .blk:focus-visible { outline: 2px solid var(--pp-brass); }
